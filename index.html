/* ===================== DISEÑO 2: una sola mano en todo el CRM ===================== */
:root{--fs-xs:12px;--fs-s:13.5px;--fs-m:15px;--fs-l:20px;--fs-xl:26px;--r-card:14px;--sh-1:0 1px 2px rgba(23,33,58,.04),0 1px 1px rgba(23,33,58,.02);
  --c1:#7b2d3e;--c2:#2f6fb5;--c3:#1d7a46;--c4:#c99a3a;--c5:#6b4bb8;--e-ok:#1d7a46;--e-w:#b7791f;--e-er:#d92d20;--e-g:#c99a3a;--e-az:#2f6fb5}
html.oscuro{--sh-1:none}
/* Letras: una escala fija y números de ancho parejo */
body{font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body,table,.num,.rh b,.rp-n span,.n{font-variant-numeric:tabular-nums}
#v>.bh h2,#v>h2,#v .bh>h2,#v .rp-hd h2,#v .ini-h h2{font-size:var(--fs-l)!important;font-weight:750;letter-spacing:-.01em}
@media(min-width:900px){#v>.bh h2,#v>h2,#v .bh>h2,#v .rp-hd h2,#v .ini-h h2{font-size:24px!important}}
#v .box h3,#v .td-h h3,#v .m1-h h3,.modal h3{font-size:16px!important;font-weight:700;letter-spacing:-.005em}
#v h4{font-size:var(--fs-m);font-weight:700}
#v small,#v .det{font-size:var(--fs-s)}
.kp .lab,.mv-ey,.rh small,#v .lab{text-transform:none!important;letter-spacing:0!important;font-size:var(--fs-s)!important;font-weight:600!important;color:var(--tx2)}
.kp .num{font-weight:750!important;letter-spacing:-.015em}
#v th{font-size:var(--fs-xs);font-weight:700;text-transform:none;letter-spacing:0;color:var(--tx2)}
/* Tarjetas: un solo estilo, menos ruido */
#v .box{border-radius:var(--r-card);border-color:var(--borde,#e6e9f0);box-shadow:var(--sh-1)}
#v .box .box{box-shadow:none}
#v .box h3+hr,#v hr{border:0;border-top:1px solid var(--borde,#e6e9f0)}
/* Íconos en lugar de emojis */
svg.eic{width:1.08em;height:1.08em;vertical-align:-.17em;margin-right:.08em;stroke-width:2;flex:none;color:currentColor}
h2 svg.eic,h3 svg.eic,h4 svg.eic{color:var(--m,#7b2d3e)}
svg.eic.e-ok{color:var(--e-ok)}svg.eic.e-w{color:var(--e-w)}svg.eic.e-er{color:var(--e-er)}svg.eic.e-g{color:var(--e-g)}
.edot{display:inline-block;width:.62em;height:.62em;border-radius:50%;vertical-align:.04em;margin-right:.25em;background:#a3abbd}.edot.er{background:var(--e-er)}.edot.w{background:#e0a100}.edot.ok{background:#2f9e5b}.edot.az{background:var(--e-az)}
.medal{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;font:800 .78em/1 inherit;font-style:normal;color:#fff;vertical-align:.02em;background:#c99a3a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}.medal.m2{background:#9aa0ad}.medal.m3{background:#b4743f}
/* Estados: píldoras con un color fijo cada uno */
.badge{border-radius:999px!important;padding:2px 9px 2px 8px!important;font-size:12px!important;font-weight:650!important;display:inline-flex;align-items:center;gap:5px;line-height:1.5;vertical-align:1px}
.badge[class*="b-"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;flex:none}
.b-pendiente{background:#fff4d6!important;color:#8a5a00!important}
.b-aprobado,.b-aprob{background:#e8f0ff!important;color:#2453a6!important}
.b-en_preparacion{background:#efe9fb!important;color:#5b3a9a!important}
.b-listo{background:#e2f4f4!important;color:#0f6b6f!important}
.b-en_reparto{background:#dde7f6!important;color:#234a87!important}
.b-entregado{background:#d8efe1!important;color:#14663a!important}
.b-cancelado{background:#f3f4f7!important;color:#6a7184!important;text-decoration:none}
html.oscuro .badge[class*="b-"]{filter:none!important;background:rgba(255,255,255,.08)!important}
.act-r small .badge{margin:0 2px}
/* Avatares con color */
.td-i{font-weight:700!important;font-size:12.5px!important;letter-spacing:.02em}
/* Minigráficos */
.rh.con-spk{position:relative;padding-right:84px!important}
.rh .spk2{position:absolute;right:10px;bottom:12px;overflow:visible}
.spk2 .spk-l{fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.spk2 .spk-a{fill:color-mix(in srgb,var(--c1) 10%,transparent);stroke:none}.spk2 .spk-p{fill:var(--c1)}
.spk2.c2 .spk-l{stroke:var(--c3)}.spk2.c2 .spk-a{fill:color-mix(in srgb,var(--c3) 10%,transparent)}.spk2.c2 .spk-p{fill:var(--c3)}
.spk2.c3 .spk-l{stroke:var(--c2)}.spk2.c3 .spk-a{fill:color-mix(in srgb,var(--c2) 10%,transparent)}.spk2.c3 .spk-p{fill:var(--c2)}
@media(max-width:520px){.rh.con-spk{padding-right:12px!important;padding-bottom:30px!important}.rh .spk2{left:12px;right:auto;bottom:8px;width:calc(100% - 24px);height:18px}}
/* Gráficos: una sola paleta */
#rp_g .bar path,.graf .bar path{fill:color-mix(in srgb,var(--c1) 28%,#fff)}#rp_g .bar.on path,.graf .bar.on path{fill:var(--c1)}
/* Vacíos */
p.vac{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 10px;margin:4px 0;color:var(--tx2)}
p.vac .vac-i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#f8eef1,#f6e9ec);color:var(--m,#7b2d3e)}
html.oscuro p.vac .vac-i{background:radial-gradient(circle at 30% 30%,#3a1d26,#2a1418)}
/* Movimiento sutil */
@media (prefers-reduced-motion:no-preference){
  button,.rh,.hc,.rp-r,.act-r,.td-r,[data-fc],a.lnk{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
  button:active:not(:disabled),.rh:active{transform:scale(.97)}
  .pr-tabs button{transition:color .15s,border-color .2s}
  details[open]>:not(summary){animation:dz .2s ease-out}
  @keyframes dz{from{opacity:0;transform:translateY(-4px)}}
  /* barra del pedido: salto al sumar un producto */
  .pbar.salta{animation:salta .42s cubic-bezier(.3,1.6,.5,1)}
  /* luz LED de la línea del encabezado: destello al abrir y latido cuando entra un pedido */
  header.luz::after{animation:luzBarre 1.7s .3s cubic-bezier(.4,0,.2,1) both}
  header.late::after{animation:luzBarre 1.2s cubic-bezier(.4,0,.2,1),luzLate 2.1s ease-in-out}
  @keyframes luzBarre{from{background-position:-60% 0,0 0}to{background-position:160% 0,0 0}}
  @keyframes luzLate{0%,40%,80%{box-shadow:0 1px 2px rgba(23,33,58,.12)}20%,60%{box-shadow:0 0 12px 2px rgba(116,172,223,.95),0 0 4px rgba(255,255,255,.9)}}
  @keyframes salta{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.015)}100%{transform:none}}
  /* anillo de la meta: se llena al abrir Inicio */
  .mjr .fl{animation:mjfill .9s .15s cubic-bezier(.2,.8,.2,1) both}
  @keyframes mjfill{from{stroke-dasharray:0 189}}
  /* Tu día: la fila hecha sale deslizando */
  .td-r.sale{transition:transform .3s ease-in,opacity .3s ease-in,height .25s .12s ease,margin .25s .12s,padding .25s .12s;transform:translateX(110%);opacity:0;height:0!important;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;overflow:hidden}
  /* campanita */
  .hbell.suena svg{animation:alRing .9s ease-in-out;transform-origin:50% 10%}
  .hbell.suena #hb_n{animation:pop .3s .1s ease-out}
  .rp-b i,.rp-bar i,.m1-b i,.rk-bar i,.pgb i,.barra i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
  #t{animation:tin .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
  input[type=checkbox]:checked{animation:pop .18s ease-out}
  @keyframes pop{50%{transform:scale(1.18)}}
  .badge{transition:background-color .2s,color .2s}
}

.li-ac{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:10px}.li-ac small{margin-right:auto;color:var(--tx2)}
.li-rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.li-rh span{display:flex;gap:6px;flex-wrap:wrap}.li-rh button{margin:0;padding:7px 11px;font-size:13px}
.li-l{display:grid}.li-r{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--borde,#eee);cursor:pointer}.li-r:last-child{border-bottom:0}.li-r>div{flex:1;min-width:0}
.li-r b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-r small{color:var(--tx2);font-size:12.5px}
.li-w{flex:none;display:grid;place-items:center;min-width:38px;height:38px;padding:0 10px;border-radius:999px;background:#25d366;color:#fff!important;font-weight:700;font-size:13px;text-decoration:none}
.li-r.li-ok{opacity:.55}.li-r.li-ok .li-w{background:#9aa0ad}
.li-act{border-color:var(--m)!important}
.ni-n{display:grid;gap:6px;margin-top:8px}.ni-n textarea{margin:0}.ni-m{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ni-m button{margin:0;padding:6px 10px;font-size:13px}
.ni-r{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--borde,#eee);position:relative}.ni-r>div{flex:1;min-width:0}.ni-r p{margin:2px 0 0;white-space:pre-wrap}.ni-r small{color:var(--tx2)}
.ni-r mark{background:var(--m2,#f6e9ec);color:var(--m);border-radius:6px;padding:0 3px;font-weight:600}
.ni-x{cursor:pointer;color:var(--tx2);font-size:18px;line-height:1;padding:0 4px}
.btn-up{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid var(--borde,#e6e9f0);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--m)}
.ar-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.ar-i{position:relative;display:grid;gap:2px;min-width:0}
.ar-i img,.ar-d{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--borde,#e6e9f0);background:#f6f7fa}
.ar-d{display:grid;place-items:center;align-content:center;gap:2px;color:var(--m);text-decoration:none;font-size:12.5px;font-weight:700}
.ar-i small{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ar-i .ar-f{color:var(--tx2);font-size:12.5px}
.ar-i .ni-x{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.9);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:15px}
.fc-acts button.ci-on{color:var(--ok,#1d7a46)!important}.fc-acts button.ci-on svg{color:var(--ok,#1d7a46)}
.cx-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cx-r input,.cx-r select{margin:0;flex:1;min-width:120px}
.ag-o{display:flex;gap:8px;flex-wrap:wrap}.ag-o a{display:inline-flex;gap:6px;align-items:center}
.au-r{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borde,#eee)}.au-r>div{flex:1}.au-r b{display:block}.au-r small{color:var(--tx2)}.au-r small input{width:64px;display:inline-block;margin:0 3px;padding:3px 6px}
.au-sw{position:relative;flex:none;width:42px;height:24px;margin-top:2px;cursor:pointer}.au-sw input{opacity:0;position:absolute}.au-sw i{position:absolute;inset:0;border-radius:999px;background:#cfd3dc;transition:background .2s}
.au-sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.au-sw input:checked+i{background:var(--ok,#1d7a46)}.au-sw input:checked+i::after{transform:translateX(18px)}
html.oscuro .li-c{background:#1c2333}html.oscuro .ar-i .ni-x{background:rgba(0,0,0,.6)}

@media(max-width:520px){#v .fc-acts>a span,#v .fc-acts>button span{font-size:12.5px!important;letter-spacing:-.02em;overflow:visible!important;text-overflow:clip!important}}
.ocr-ok{border-color:var(--ok,#1d7a46)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--ok,#1d7a46) 25%,transparent)!important;background:#f2faf5!important}
.aum-que{width:auto;margin:0}.pb-q{display:grid;gap:6px}.pb-o{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borde,#e6e9f0);border-radius:14px;padding:10px 12px;cursor:pointer}.pb-o input{width:auto;margin:3px 0 0}.pb-o span{display:grid}.pb-o small{color:var(--tx2)}.pb-o:has(input:checked){border-color:var(--m);box-shadow:inset 0 0 0 1px var(--m)}
.fl-car{overscroll-behavior-x:contain;scroll-behavior:smooth}.fl-car figure{scroll-snap-stop:always}
.fl-car img{aspect-ratio:auto!important;height:auto!important}
