<script>
const sb=supabase.createClient('https://ggfqdkgqtpnkvxoykoty.supabase.co','sb_publishable_kfvkZgS8FewPabohJrKf9Q_UDyEcQiR');
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $m=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?new Date(d+(String(d).length==10?'T12:00':'')).toLocaleDateString('es-AR'):'—';
const ESTADOS=['pendiente','aprobado','en_preparacion','listo','en_reparto','entregado','cancelado'];
let S={perfil:null,tab:'inicio',clientes:[],productos:[],items:[],sub:'ordenes',prov:[],oc:[]};
function toast(t,er){const e=$('#t');e.textContent=t;e.style.background=er?'var(--er)':'var(--ok)';e.style.display='block';setTimeout(()=>e.style.display='none',er?6000:3000)}
async function out(){await sb.auth.signOut();loginView()}

function loginView(){
  app.innerHTML=`<div class="box login">${MARCA.logo?`<img class="llogo" src="${MARCA.logo}" alt="">`:''}<h1>Sabores de mi País</h1><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña"><button id="go">Ingresar</button><p id="le" class="err"></p></div>`;
  const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#le').textContent=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':'Error de conexión: '+error.message+(error.status?' ('+error.status+')':'');else init()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};

/* Supabase devuelve como máximo 1000 filas por pedido: esto trae todas, de a tandas */
async function todo(armar){let out=[],i=0;for(;;){const{data,error}=await armar().range(i,i+999);if(error)return{data:out,error};out=out.concat(data);if(data.length<1000)return{data:out,error:null};i+=1000}}
const PROD_COLS='producto_id,codigo,ean,descripcion,familia,marca,costo,precio_mayorista,precio_minorista,precio_especial';

/* Stock: físico, reservado, disponible y mínimo por producto */
S.stock={};S.stockOk=false;S.min={};
async function cargarStock(){
  const[st,mi]=await Promise.all([todo(()=>sb.from('stock').select('producto_id,fisico,reservado,disponible').order('producto_id')),
    todo(()=>sb.from('productos').select('*').order('id'))]);
  S.stockOk=!st.error;S.stock={};S.inv=false;
  for(const r of st.data||[]){S.stock[r.producto_id]={f:+r.fisico||0,r:+r.reservado||0,d:r.disponible!=null?+r.disponible:(+r.fisico||0)-(+r.reservado||0)};if(+r.fisico)S.inv=true}
  S.min={};S.bultoOk=(mi.data||[]).some(r=>'unidades_bulto' in r);for(const r of mi.data||[])S.min[r.id]={m:+r.stock_minimo||0,a:r.activo!==false,pv:r.proveedor_id,b:Math.max(1,+r.unidades_bulto||1),tb:r.tipo_bulto||'Caja',iva:r.alicuota_iva!=null?+r.alicuota_iva:21,foto:r.foto||'',uc:r.ultimo_conteo||null,cf:r.codigo_fabricante||''};
}
const stk=id=>S.stock[id]||{f:0,r:0,d:0};
const nf=n=>Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
function chipStock(id,pide){if(!S.stockOk||!S.inv)return '';const d=stk(id).d,m=S.min[id]?.m||0;
  const c=d<=0||(pide&&pide>d)?'st0':(m&&d<=m?'stb':'stok');
  return `<span class="stk ${c}" title="Disponible en depósito">Disp. ${nf(d)}</span>`}

/* Búsqueda sin importar tildes ni mayúsculas; todas las palabras tienen que aparecer */
const norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const coincide=(texto,q)=>{const t=norm(texto);return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w))};
const txtProd=p=>p.descripcion+' '+p.codigo+' '+(p.marca||'')+' '+(p.familia||'');

/* ---------- Promociones ---------- */
S.promos=[];
async function cargarPromos(){const{data,error}=await sb.from('promociones').select('*').eq('activa',true);S.promos=error?[]:data}
function promoPara(id,lista,q){const p=S.productos.find(x=>x.producto_id==id),m=S.min[id]||{},hoy=diaLocal(new Date());if(!p)return null;let best=null;
  for(const r of S.promos){if(!r.activa||hoy<r.desde||(r.hasta&&hoy>r.hasta))continue;
    if(r.listas&&r.listas.length&&!r.listas.includes(lista))continue;
    const av=String(r.alcance_valor||'').toUpperCase();
    if(r.alcance=='marca'&&String(p.marca||'').toUpperCase()!==av)continue;if(r.alcance=='familia'&&String(p.familia||'').toUpperCase()!==av)continue;if(r.alcance=='producto'&&String(id)!==String(r.alcance_valor))continue;
    if(r.minimo_tipo=='unidades'&&q<r.minimo_unidades)continue;if(r.minimo_tipo=='bulto'&&!(m.b>1&&q>=m.b))continue;
    if(!best||+r.descuento_pct>+best.descuento_pct)best=r}
  return best}
const condPromo=r=>r.minimo_tipo=='bulto'?'llevando el bulto cerrado':r.minimo_tipo=='unidades'?'desde '+r.minimo_unidades+' u.':'';
function promoCerca(id,lista){const hoy=diaLocal(new Date()),p=S.productos.find(x=>x.producto_id==id);if(!p)return null;
  return S.promos.filter(r=>r.activa&&hoy>=r.desde&&(!r.hasta||hoy<=r.hasta)&&(!r.listas?.length||r.listas.includes(lista))&&
    (r.alcance=='todos'||(r.alcance=='marca'&&String(p.marca||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='familia'&&String(p.familia||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='producto'&&String(id)==String(r.alcance_valor)))&&
    (r.minimo_tipo!='bulto'||(S.min[id]?.b>1))).sort((a,b)=>b.descuento_pct-a.descuento_pct)[0]||null}
const chipPromo=r=>r?`<span class="promo">−${nf(r.descuento_pct)} % ${esc(condPromo(r)||r.nombre)}</span>`:'';

/* ---------- Bultos (caja / pack) ---------- */
const bul=id=>{const x=S.min[id];return x&&x.b>1?{n:x.b,t:x.tb||'Caja'}:null};
const plural=(t,n)=>{t=String(t||'Caja').toLowerCase();return n==1?t:(t.endsWith('s')?t:t+'s')};
function enBultos(id,q){const b=bul(id);q=Number(q)||0;if(!b||q<b.n)return '';const c=Math.floor(q/b.n),r=q-c*b.n;return c+' '+plural(b.t,c)+(r?' + '+nf(r)+' u.':'')}
const cantTxt=(id,q)=>{const e=enBultos(id,q);return nf(q)+(e?' ('+e+')':'')};
const chipBulto=id=>{const b=bul(id);return b?`<span class="bulto">${esc(b.t)} × ${b.n}</span>`:''};

/* ---------- Escáner de códigos de barras con la cámara ---------- */
const solo=x=>String(x??'').replace(/\D/g,'').replace(/^0+/,'');
function prodPorCodigo(code){const c=String(code).trim(),n=solo(c);
  return S.productos.find(p=>(n&&solo(p.ean)===n)||String(p.codigo).trim().toUpperCase()===c.toUpperCase())}
const btnScan=id=>`<button type="button" class="alt scan" id="${id}" title="Escanear código de barras" aria-label="Escanear código de barras"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`;
function cargarScript(src){return new Promise((ok,mal)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=mal;document.head.appendChild(e)})}
let audioCtx=null;function bip(bien){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=bien?1200:300;g.gain.value=.08;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(bien?.08:.25))}catch(e){}if(navigator.vibrate)navigator.vibrate(bien?60:[80,60,80])}
async function escanear(titulo,alLeer){
  const m=document.createElement('div');m.className='modal scanm';
  m.innerHTML=`<div class="mc"><div class="bh"><h3>${esc(titulo)}</h3><button id="sc_x">Listo</button></div>
    <div class="cam"><video id="sc_v" playsinline muted autoplay></video><div class="mira"></div></div>
    <p id="sc_e" class="sc-est">Apuntá la cámara al código de barras…</p>
    <form id="sc_f" class="sc-man"><input id="sc_i" inputmode="numeric" placeholder="O escribí el código" autocomplete="off"><button class="alt">Buscar</button></form></div>`;
  document.body.appendChild(m);
  let stream=null,reader=null,timer=null,fin=false,ultimo='',tUlt=0;
  const est=(t,cls)=>{const e=$('#sc_e');e.textContent=t;e.className='sc-est '+(cls||'')};
  const cerrar=()=>{fin=true;clearInterval(timer);try{reader&&reader.reset()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());m.remove()};
  $('#sc_x').onclick=cerrar;
  const leer=code=>{const now=Date.now();if(code===ultimo&&now-tUlt<1500)return;ultimo=code;tUlt=now;
    const p=prodPorCodigo(code);if(!p){bip(false);est('No encontré el código '+code+'. Revisá que el producto tenga el EAN cargado.','mal');return}
    bip(true);est(alLeer(p,code)||('✔ '+p.descripcion),'bien')};
  $('#sc_f').onsubmit=e=>{e.preventDefault();const v=$('#sc_i').value.trim();if(v){ultimo='';leer(v);$('#sc_i').value=''}};
  const v=$('#sc_v');
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('sin cámara');
    if('BarcodeDetector' in window){
      const fm=await BarcodeDetector.getSupportedFormats();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f=>fm.includes(f))});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      if(fin){stream.getTracks().forEach(t=>t.stop());return}
      v.srcObject=stream;await v.play();
      let ocupado=false;timer=setInterval(async()=>{if(ocupado||fin||v.readyState<2)return;ocupado=true;try{const r=await det.detect(v);if(r[0])leer(r[0].rawValue)}catch(e){}ocupado=false},180);
    }else{
      est('Preparando la cámara…');
      await cargarScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
      if(fin)return;
      reader=new ZXing.BrowserMultiFormatReader();
      await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,(r)=>{if(r&&!fin)leer(r.getText())});
      stream=v.srcObject;est('Apuntá la cámara al código de barras…');
    }
  }catch(e){est('No se pudo abrir la cámara. Dale permiso al navegador para usarla, o escribí el código abajo.','mal');$('#sc_i').focus()}
}

function leerImagen(file){return new Promise((ok,mal)=>{const r=new FileReader();r.onerror=()=>mal(new Error('No se pudo leer el archivo'));
  r.onload=()=>{const im=new Image();im.onerror=()=>mal(new Error('Ese archivo no es una imagen que se pueda usar. Probá con PNG o JPG.'));im.onload=()=>ok(im);im.src=r.result};r.readAsDataURL(file)})}
function prepararLogo(im,sinFondo){
  const k0=Math.min(1,1600/Math.max(im.width,im.height)),W=Math.max(1,Math.round(im.width*k0)),H=Math.max(1,Math.round(im.height*k0));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');cx.drawImage(im,0,0,W,H);
  const id=cx.getImageData(0,0,W,H),d=id.data,N=W*H;
  let x0=0,y0=0,x1=W-1,y1=H-1;
  if(sinFondo){
    // 1) Fondo: blanco, negro o transparente que toca el borde → transparente
    const yaTransp=[0,W-1,N-W,N-1].some(q=>d[q*4+3]<30);
    const fondo=q=>{const a=d[q*4+3];if(a<30)return true;if(yaTransp)return false;const r=d[q*4],g=d[q*4+1],b=d[q*4+2];return(r>232&&g>232&&b>232)||(r<28&&g<28&&b<28)};
    const vis=new Uint8Array(N),st=new Int32Array(N);let sp=0;
    const push=q=>{if(!vis[q]&&fondo(q)){vis[q]=1;st[sp++]=q}};
    for(let x=0;x<W;x++){push(x);push((H-1)*W+x)}for(let y=0;y<H;y++){push(y*W);push(y*W+W-1)}
    while(sp){const q=st[--sp],x=q%W;if(x>0)push(q-1);if(x<W-1)push(q+1);if(q>=W)push(q-W);if(q<N-W)push(q+W)}
    let quedan=0;for(let q=0;q<N;q++)if(!vis[q]&&d[q*4+3]>=30)quedan++;
    if(quedan>N*0.01){
      for(let q=0;q<N;q++)if(vis[q])d[q*4+3]=0;
      // 2) Quedarse con el dibujo principal (la pieza más grande y lo que está pegado a ella)
      const lab=new Int32Array(N),cajas=[];let n=0;
      for(let q0=0;q0<N;q0++){if(lab[q0]||d[q0*4+3]<30)continue;n++;let c=[W,H,0,0,0];sp=0;st[sp++]=q0;lab[q0]=n;
        while(sp){const q=st[--sp],x=q%W,y=(q-x)/W;c[4]++;if(x<c[0])c[0]=x;if(y<c[1])c[1]=y;if(x>c[2])c[2]=x;if(y>c[3])c[3]=y;
          for(const v of[x>0?q-1:-1,x<W-1?q+1:-1,y>0?q-W:-1,y<H-1?q+W:-1])if(v>=0&&!lab[v]&&d[v*4+3]>=30){lab[v]=n;st[sp++]=v}}
        cajas.push(c)}
      const big=cajas.reduce((a,c)=>c[4]>a[4]?c:a),mx=(big[2]-big[0])*.25,my=(big[3]-big[1])*.25;
      x0=big[0];y0=big[1];x1=big[2];y1=big[3];
      for(const c of cajas){if(c[4]<big[4]*0.002)continue;
        if(c[2]>=big[0]-mx&&c[0]<=big[2]+mx&&c[3]>=big[1]-my&&c[1]<=big[3]+my){x0=Math.min(x0,c[0]);y0=Math.min(y0,c[1]);x1=Math.max(x1,c[2]);y1=Math.max(y1,c[3])}}
      // aplicar la transparencia
      cx.putImageData(id,0,0)
    }else sinFondo=false}
  const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,600/cw,300/ch),w=Math.max(1,Math.round(cw*k)),h=Math.max(1,Math.round(ch*k));
  const out=document.createElement('canvas');out.width=w;out.height=h;const ox=out.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(cv,x0,y0,cw,ch,0,0,w,h);
  let u=out.toDataURL('image/png');if(u.length>450000)u=out.toDataURL('image/webp',.92);return u}

function catalogoPDF(l,L,c,nomLista){const w=window.open('','_blank');if(!w)return toast('Permití las ventanas emergentes para generar el catálogo.',1);
  const PALC=['#7b2d3e','#1f5fa8','#2e7d4f','#c4571a','#6b3fa0','#0f766e','#b45309','#be185d','#334155','#4d7c0f'];

  const cap=t=>{t=String(t||'').toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1)};
  const hoy=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  const card=x=>{const b=bul(x.id),r=promoCerca(x.id,l);return`<div class="cd">${r?`<span class="rb">−${nf(r.descuento_pct)} %</span>`:''}

/* ---------- Caja diaria y gastos ---------- */
const CAT_GASTO=['Combustible','Sueldos','Alquiler','Servicios (luz, gas, internet)','Impuestos','Mantenimiento vehículo','Comisiones','Bancarios','Otros'];
const MEDIOS=['efectivo','transferencia','cheque','tarjeta','debito_automatico','otro'];
const MED_TXT={efectivo:'Efectivo',transferencia:'Transferencia',cheque:'Cheque',echeq:'eCheq',tarjeta:'Tarjeta',debito_automatico:'Débito automático',otro:'Otro'};
async function vCaja(){
  S.cjD=S.cjD||diaLocal(new Date());
  const d=S.cjD,dd=new Date(d+'T12:00'),mi=d.slice(0,7)+'-01',mf=diaLocal(new Date(dd.getFullYear(),dd.getMonth()+1,1));
  const titulo=dd.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  $('#v').innerHTML=`<div class="bh"><h2 style="margin:0">Caja · ${titulo}</h2><div class="fc-acc"><button class="alt" id="cj_a" aria-label="Día anterior">←</button><input type="date" id="cj_d" value="${d}" style="width:auto;margin:0"><button class="alt" id="cj_s" aria-label="Día siguiente">→</button><button class="alt" id="cj_h">Hoy</button></div></div>
  <div id="cj">Cargando…</div>`;
  const ir=x=>{S.cjD=x;vCaja()},mov=n=>{const t=new Date(d+'T12:00');t.setDate(t.getDate()+n);ir(diaLocal(t))};
  $('#cj_a').onclick=()=>mov(-1);$('#cj_s').onclick=()=>mov(1);$('#cj_h').onclick=()=>ir(diaLocal(new Date()));$('#cj_d').onchange=e=>e.target.value&&ir(e.target.value);
  const ini=new Date(mi+'T00:00').toISOString(),fin=new Date(mf+'T00:00').toISOString();
  const[re,pp,ga,ci,ul,pe,co]=await Promise.all([
    todo(()=>sb.from('recibos').select('*').eq('anulado',false).gte('fecha',ini).lt('fecha',fin).order('fecha')),
    todo(()=>sb.from('pagos_proveedor').select('*,proveedores(razon_social)').gte('fecha',mi).lt('fecha',mf).order('fecha')),
    todo(()=>sb.from('gastos').select('*').gte('fecha',mi).lt('fecha',mf).order('fecha')),
    sb.from('cierres_caja').select('*').eq('fecha',d).maybeSingle(),
    sb.from('cierres_caja').select('fecha,efectivo_contado').lt('fecha',d).order('fecha',{ascending:false}).limit(1),
    todo(()=>sb.from('pedidos').select('*,pedido_items(producto_id,cantidad)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('productos').select('id,costo').order('id'))]);
  if(ga.error){$('#cj').innerHTML='<p class="err">No se pudo leer la caja: '+esc(ga.error.message)+'. Corré caja.sql en Supabase.</p>';return}
  const delDia=(x,k)=>diaLocal(x[k])===d;
  const R=(re.data||[]).filter(x=>delDia(x,'fecha')&&!/^Nota de crédito/.test(x.observacion||'')),P=(pp.data||[]).filter(x=>x.fecha===d),G=(ga.data||[]).filter(x=>x.fecha===d);
  const sum=(A,k='importe')=>A.reduce((a,x)=>a+Number(x[k]||0),0),porMedio=A=>{const o={};for(const x of A)o[x.medio]=(o[x.medio]||0)+Number(x.importe);return o};
  const cob=porMedio(R),ef=x=>x.medio==='efectivo';
  const inicial=ci.data?Number(ci.data.efectivo_inicial):Number(ul.data?.[0]?.efectivo_contado||0);
  const esperado=inicial+sum(R.filter(ef))-sum(P.filter(ef))-sum(G.filter(ef));
  // movimientos del día
  const cli=id=>S.clientes.find(c=>c.id==id)?.razon_social||'Cliente';
  const M=[...R.map(x=>({h:x.fecha,t:'Cobro',d:'Recibo N° '+x.numero+' · '+cli(x.cliente_id),m:x.medio,v:+x.importe})),
    ...P.map(x=>({h:x.created_at||x.fecha,t:'Pago',d:(x.proveedores?.razon_social||'Proveedor')+(x.referencia?' · '+x.referencia:''),m:x.medio,v:-x.importe})),
    ...G.map(x=>({h:x.creado_en||x.fecha,t:'Gasto',d:x.categoria+(x.descripcion?' · '+x.descripcion:''),m:x.medio,v:-x.importe,id:x.id}))].sort((a,b)=>String(a.h).localeCompare(String(b.h)));
  // mes
  const ventas=(pe.data||[]).filter(o=>{const f=fechaDe(o);return f&&diaLocal(f)>=mi&&diaLocal(f)<mf});
  const costo={};for(const r of co.data||[])costo[r.id]=Number(r.costo)||0;
  const vMes=sum(ventas,'total');let cmv=0,sinC=false;for(const o of ventas)for(const i of o.pedido_items||[]){const c=costo[i.producto_id];if(c>0)cmv+=c*Number(i.cantidad||0);else sinC=true}
  const gMes=sum(ga.data||[]),netoMes=vMes-cmv-gMes;
  const gCat={};for(const x of ga.data||[])gCat[x.categoria]=(gCat[x.categoria]||0)+Number(x.importe);
  const gC=Object.entries(gCat).sort((a,b)=>b[1]-a[1]),gMax=Math.max(1,...gC.map(x=>x[1]));
  const nomMes=dd.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  $('#cj').innerHTML=`<div class="kp">
    <div class="box ok"><span class="lab">Cobrado</span><span class="num">${$m(sum(R))}</span><span class="det">${Object.entries(cob).map(([k,v])=>(MED_TXT[k]||k)+' '+$m(v)).join(' · ')||'Sin cobros'}</span></div>
    <div class="box"><span class="lab">Pagado a proveedores</span><span class="num">${$m(sum(P))}</span><span class="det">${P.length} ${P.length==1?'pago':'pagos'}</span></div>
    <div class="box"><span class="lab">Gastos</span><span class="num">${$m(sum(G))}</span><span class="det">${G.length} ${G.length==1?'gasto':'gastos'}</span></div>
    <div class="box"><span class="lab">Efectivo en caja</span><span class="num">${$m(esperado)}</span><span class="det">Debería haber (inicial ${$m(inicial)})</span></div></div>
  <div class="dos fc2">
    <div class="box"><h3>Movimientos del día</h3>${M.length?`<table>${M.map(x=>`<tr><td><span class="badge ${x.v>0?'b-entregado':'b-mora30'}">${x.t}</span></td><td>${esc(x.d)}<br><small>${MED_TXT[x.m]||esc(x.m)}</small></td><td class="n ${x.v<0?'mora':''}">${x.v<0?'−':''}${$m(Math.abs(x.v))}</td><td>${x.id?`<a class="lnk" data-gb="${x.id}">Borrar</a>`:''}</td></tr>`).join('')}</table>`:'<p><small>No hay movimientos este día.</small></p>'}</div>
    <div class="box"><h3>Cargar gasto</h3><div class="g">
      <label class="f">Categoría<select id="g_c">${CAT_GASTO.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="f">Importe<input id="g_i" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="f">Medio de pago<select id="g_m">${MEDIOS.map(m=>`<option value="${m}">${MED_TXT[m]}</option>`).join('')}</select></label>
      <label class="f">Detalle (opcional)<input id="g_d" placeholder="Ej.: nafta camioneta"></label></div><div id="g_x"></div>
      <button id="g_g">Guardar gasto</button></div>
    <div class="box"><h3>Cierre de caja</h3>${ci.data?`<p>Cerrada: debería haber <b>${$m(ci.data.efectivo_esperado)}</b>, se contaron <b>${$m(ci.data.efectivo_contado)}</b>.</p>
      <p class="${Math.abs(ci.data.diferencia)<0.005?'':'mora'}"><b>${Math.abs(ci.data.diferencia)<0.005?'La caja cerró justa.':(ci.data.diferencia>0?'Sobran ':'Faltan ')+$m(Math.abs(ci.data.diferencia))}</b></p>${ci.data.nota?'<p><small>'+esc(ci.data.nota)+'</small></p>':''}<button class="alt" id="cc_re">Volver a cerrar</button>`:''}
      <div id="cc_f" ${ci.data?'hidden':''}><p><small>Contá el efectivo al final del día y escribilo. El CRM lo compara con lo que debería haber.</small></p><div class="g">
      <label class="f">Efectivo al empezar el día<input id="cc_i" type="number" step="0.01" min="0" value="${inicial.toFixed(2)}"></label>
      <label class="f">Efectivo contado<input id="cc_c" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="f">Nota (opcional)<input id="cc_n"></label></div><p id="cc_dif"></p><button id="cc_g">Cerrar caja</button></div></div>
    <div class="box"><h3>Ganancia de ${nomMes}</h3><table>
      <tr><td>Ventas</td><td class="n">${$m(vMes)}</td></tr>
      <tr><td>Costo de la mercadería vendida${sinC?' <small>(hay productos sin costo)</small>':''}</td><td class="n">− ${$m(cmv)}</td></tr>
      <tr><td>Gastos del negocio</td><td class="n">− ${$m(gMes)}</td></tr>

/* ---------- Reportes de ventas ---------- */
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PERIODOS=[['mes','Este mes'],['mesant','Mes anterior'],['3m','Últimos 3 meses'],['anio','Este año'],['12m','Últimos 12 meses']];
function rango(k){const h=new Date(),y=h.getFullYear(),m=h.getMonth(),f=(a,b)=>diaLocal(new Date(a,b,1));
  if(k=='mes')return[f(y,m),f(y,m+1)];if(k=='mesant')return[f(y,m-1),f(y,m)];if(k=='3m')return[f(y,m-2),f(y,m+1)];
  if(k=='anio')return[f(y,0),f(y+1,0)];return[f(y,m-11),f(y,m+1)]}
function aTabla(head,rows){return [head,...rows].map(r=>r.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n')}
async function copiarTabla(head,rows){const t=aTabla(head,rows);
  try{await navigator.clipboard.writeText(t);toast('Tabla copiada: pegala en Excel con Ctrl+V.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Tabla copiada: pegala en Excel con Ctrl+V.')}}
async function vReportes(){
  S.rp=S.rp||'mes';
  $('#v').innerHTML=`<h2>Reportes de ventas</h2>
  <div class="sub" id="rp_p">${PERIODOS.map(([k,t])=>`<button class="${S.rp==k?'':'alt'}" data-rp="${k}">${t}</button>`).join('')}</div>
  <p><small>Cuenta los pedidos aprobados en adelante (no incluye los que esperan aprobación ni los cancelados).</small></p>
  <div class="kp">
    <div class="box" id="r1"><span class="lab">Ventas</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r2"><span class="lab">Pedidos</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r3"><span class="lab">Ticket promedio</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r4"><span class="lab">Margen bruto</span><span class="num">…</span><span class="det"></span></div>
  </div>
  <div class="box"><h3>Ventas por mes · últimos 12 meses</h3><div id="rp_g" class="graf">Cargando…</div></div>
  <div class="dos fc2">
    <div class="box"><div class="bh"><h3>Mejores clientes</h3><button class="alt" id="cp_c">Copiar para Excel</button></div><div id="rp_c"></div></div>
    <div class="box"><div class="bh"><h3>Productos más vendidos</h3><button class="alt" id="cp_p">Copiar para Excel</button></div><div id="rp_pr"></div></div>
  </div>`;
  $$('[data-rp]').forEach(b=>b.onclick=()=>{S.rp=b.dataset.rp;$$('[data-rp]').forEach(x=>x.className=x.dataset.rp==S.rp?'':'alt');pintar()});
  const[pe,co]=await Promise.all([
    todo(()=>sb.from('pedidos').select('id,numero,total,estado,cliente_id,fecha,creado_en,created_at,clientes(razon_social),pedido_items(producto_id,cantidad,precio_unitario)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('productos').select('id,costo').order('id'))]);
  let P=pe.data;
  if(pe.error){const r2=await todo(()=>sb.from('pedidos').select('*,clientes(razon_social),pedido_items(producto_id,cantidad,precio_unitario)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false}));
    if(r2.error){$('#rp_g').innerHTML='<p class="err">No se pudieron leer los pedidos: '+esc(r2.error.message)+'</p>';return}P=r2.data}
  const costo={};for(const r of co.data||[])costo[r.id]=Number(r.costo)||0;
  for(const o of P)o._d=fechaDe(o)?diaLocal(fechaDe(o)):'';
  const nombre=id=>S.productos.find(p=>p.producto_id==id)?.descripcion||'Producto';
  let TC=[],TP=[];
  const pintar=()=>{
    const[a,b]=rango(S.rp),L=P.filter(o=>o._d>=a&&o._d<b);
    const v=L.reduce((x,o)=>x+Number(o.total||0),0);
    let vi=0,ci=0,sinC=0;
    const pc={},cc={};
    for(const o of L){const k=o.cliente_id;cc[k]=cc[k]||{n:o.clientes?.razon_social||'Cliente',p:0,v:0};cc[k].p++;cc[k].v+=Number(o.total||0);
      for(const it of o.pedido_items||[]){const q=Number(it.cantidad)||0,pu=Number(it.precio_unitario)||0,cu=costo[it.producto_id]||0;
        vi+=q*pu;if(cu>0)ci+=q*cu;else sinC+=q*pu;
        const x=pc[it.producto_id]=pc[it.producto_id]||{q:0,v:0,c:0,sc:false};x.q+=q;x.v+=q*pu;if(cu>0)x.c+=q*cu;else x.sc=true}}
    const conC=vi-sinC,mg=conC>0?(conC-ci)/conC:null;
    $('#r1 .num').textContent=$m(v);$('#r1 .det').textContent=PERIODOS.find(x=>x[0]==S.rp)[1];
    $('#r2 .num').textContent=String(L.length);$('#r2 .det').textContent=Object.keys(cc).length+(Object.keys(cc).length==1?' cliente':' clientes');
    $('#r3 .num').textContent=L.length?$m(v/L.length):'—';$('#r3 .det').textContent='por pedido';
    $('#r4 .num').textContent=mg==null?'—':(mg*100).toLocaleString('es-AR',{maximumFractionDigits:1})+' %';
    $('#r4 .det').textContent=mg==null?'Faltan costos cargados':('Ganancia '+$m(conC-ci)+(sinC>0?' · hay productos sin costo':''));
    // clientes
    TC=Object.values(cc).sort((x,y)=>y.v-x.v);
    $('#rp_c').innerHTML=TC.length?'<table><tr><th>Cliente</th><th class="n">Pedidos</th><th class="n">Ventas</th><th class="n">%</th></tr>'+TC.slice(0,10).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.p}</td><td class="n">${$m(x.v)}</td><td class="n">${v?Math.round(x.v/v*100):0} %</td></tr>`).join('')+'</table>'+(TC.length>10?`<small>Y ${TC.length-10} clientes más (se copian todos).</small>`:''):'<p><small>No hay ventas en este período.</small></p>';
    // productos
    TP=Object.entries(pc).map(([id,x])=>({n:nombre(id),...x})).sort((x,y)=>y.v-x.v);
    $('#rp_pr').innerHTML=TP.length?'<table><tr><th>Producto</th><th class="n">Unid.</th><th class="n">Ventas</th><th class="n">Margen</th></tr>'+TP.slice(0,10).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${nf(x.q)}</td><td class="n">${$m(x.v)}</td><td class="n">${x.sc||!x.v?'—':Math.round((x.v-x.c)/x.v*100)+' %'}</td></tr>`).join('')+'</table>'+(TP.length>10?`<small>Y ${TP.length-10} productos más (se copian todos).</small>`:''):'<p><small>No hay ventas en este período.</small></p>';
    grafico(a,b);vendedoresReporte()};
  const grafico=(a,b)=>{const h=new Date(),M=[];
    for(let i=11;i>=0;i--){const d=new Date(h.getFullYear(),h.getMonth()-i,1),k=diaLocal(d).slice(0,7);M.push({k,l:MESES[d.getMonth()]+(d.getMonth()==0||i==11?' '+String(d.getFullYear()).slice(2):''),v:0})}
    for(const o of P){const m=M.find(x=>x.k==o._d.slice(0,7));if(m)m.v+=Number(o.total||0)}
    const max=Math.max(...M.map(x=>x.v)),W=Math.max(340,Math.min(720,$('#rp_g').clientWidth||720)),H=W<500?200:230,pl=W<500?60:64,pb=28,pt=12,cw=(W-pl-8)/12,bw=Math.min(36,cw*0.6);
    if(cw<40)M.forEach(m=>m.l=m.l.split(' ')[0]);
    const paso=(()=>{if(!max)return 1;const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r)})();
    const top=max?Math.ceil(max/paso)*paso:4,y=v=>pt+(H-pt-pb)*(1-v/top);
    const corto=v=>v>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':v>=1e3?Math.round(v/1e3)+' mil':String(Math.round(v));
    let g='';for(let t=0;t<=top+1e-9;t+=paso)g+=`<line x1="${pl}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${pl-8}" y="${y(t)+4}" class="ax" text-anchor="end">$ ${corto(t)}</text>`;
    const enP=k=>k+'-01'>=a.slice(0,7)+'-01'&&k+'-01'<b;
    const bars=M.map((m,i)=>{const cx=pl+cw*i+cw/2,yy=y(m.v),hh=Math.max(0,H-pb-yy),r=Math.min(4,hh/2);
      const path=hh>0?`M${cx-bw/2},${H-pb}V${yy+r}Q${cx-bw/2},${yy} ${cx-bw/2+r},${yy}H${cx+bw/2-r}Q${cx+bw/2},${yy} ${cx+bw/2},${yy+r}V${H-pb}Z`:'';
      return `<g class="bar${enP(m.k)?' on':''}" data-i="${i}"><rect x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" class="hit"/>${path?`<path d="${path}"/>`:''}<text x="${cx}" y="${H-8}" class="ax" text-anchor="middle">${m.l}</text></g>`}).join('');
    $('#rp_g').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes de los últimos 12 meses">${g}<line x1="${pl}" x2="${W-8}" y1="${H-pb}" y2="${H-pb}" class="base"/>${bars}</svg><div class="tip" hidden></div>
      <details><summary><small>Ver como tabla</small></summary><table>${M.map(m=>`<tr><td>${m.l}</td><td class="n">${$m(m.v)}</td></tr>`).join('')}</table></details>`;
    const tip=$('#rp_g .tip');
    $$('#rp_g .bar').forEach(el=>{el.onmouseenter=el.onclick=()=>{const m=M[el.dataset.i];tip.hidden=false;tip.innerHTML=`<b>${m.l}</b><br>${$m(m.v)}`;
      const r=el.getBoundingClientRect(),pr=$('#rp_g').getBoundingClientRect();tip.style.left=(r.left-pr.left+r.width/2)+'px';tip.style.top=Math.max(0,(el.querySelector('path')?.getBoundingClientRect().top||r.top)-pr.top-46)+'px'};
      el.onmouseleave=()=>tip.hidden=true})};
  $('#cp_c').onclick=()=>copiarTabla(['Cliente','Pedidos','Ventas','% del total'],TC.map(x=>{const t=TC.reduce((a,y)=>a+y.v,0);return[x.n,x.p,x.v.toFixed(2).replace('.',','),(t?x.v/t*100:0).toFixed(1).replace('.',',')]}));
  $('#v').insertAdjacentHTML('beforeend','<div class="box" id="rp_v"></div><div class="box" id="rp_h"></div>');historialBox();
  $('#cp_p').onclick=()=>copiarTabla(['Producto','Unidades','Ventas','Margen %'],TP.map(x=>[x.n,x.q,x.v.toFixed(2).replace('.',','),x.sc||!x.v?'':((x.v-x.c)/x.v*100).toFixed(1).replace('.',',')]));
  pintar();
}

    $('#lk_n').onclick=async()=>{if(!confirm('¿Generar un link nuevo? El link anterior deja de funcionar.'))return;

  $('#fc_np').onclick=()=>{S.preCli=c;S.tab='pedidos';shell()};

    kp('f2',$m(tv),V.length?V.length+(V.length==1?' factura':' facturas')+' · hasta '+Math.max(...V.map(x=>x.dias_mora))+' días':'Nada vencido',V.length?'alerta':'ok');
    $('#fc_fa').innerHTML=F.length?'<table><tr><th>Factura</th><th>Vence</th><th class="n">Debe</th></tr>'+F.map(x=>`<tr><td>${x.tipo} ${x.numero}</td><td class="${x.dias_mora>0?'mora':''}">${fd(x.vencimiento)}${x.dias_mora>0?' · '+x.dias_mora+' d':''}</td><td class="n">${$m(x.pendiente)}</td></tr>`).join('')+'</table>':'<p><small>No tiene facturas pendientes.</small></p>'}
  // pagos

    const ya=val.filter(o=>String(fechaDe(o)||'').startsWith(anio));
    kp('f3',$m(ya.reduce((a,o)=>a+Number(o.total||0),0)),ya.length+(ya.length==1?' pedido':' pedidos'));
    const u=val[0];kp('f4',u?'N° '+u.numero:'—',u?(fechaDe(u)?fd(fechaDe(u))+' · ':'')+$m(u.total):'Todavía no compró');
    $('#fc_pe').innerHTML=P.length?'<table><tr><th>N°</th><th>Fecha</th><th>Estado</th><th class="n">Total</th><th></th></tr>'+P.slice(0,12).map(o=>`<tr><td>${o.numero}</td><td>${fd(fechaDe(o))}</td><td><span class="badge b-${o.estado}">${EST_TXT[o.estado]||o.estado}</span></td><td class="n">${$m(o.total)}</td><td><a class="lnk" data-pdf="${o.id}">PDF</a>${['pendiente','cancelado'].includes(o.estado)?'':` · <a class="lnk" data-rm="${o.id}">Remito</a>`}${o.estado=='entregado'?` · <a class="lnk" data-dv="${o.id}">Devolución</a>`:''}</td></tr>`).join('')+'</table>':'<p><small>Todavía no tiene pedidos.</small></p>';
    $$('#fc_pe [data-pdf]').forEach(a=>a.onclick=()=>pedidoPDF(P.find(o=>o.id==a.dataset.pdf)));
    $$('#fc_pe [data-rm]').forEach(a=>a.onclick=()=>remitos([P.find(o=>o.id==a.dataset.rm)]));
    $$('#fc_pe [data-dv]').forEach(a=>a.onclick=()=>devolucion(P.find(o=>o.id==a.dataset.dv),()=>fichaCliente(c)));
    const cnt={};for(const o of val)for(const it of o.pedido_items||[]){const k=it.producto_id;cnt[k]=cnt[k]||{n:0,q:0};cnt[k].n++;cnt[k].q+=Number(it.cantidad)||0}
    const top=Object.entries(cnt).sort((a,b)=>b[1].n-a[1].n||b[1].q-a[1].q).slice(0,8);
    $('#fc_pr').innerHTML=top.length?'<table><tr><th>Producto</th><th class="n">Pedidos</th><th class="n">Unidades</th></tr>'+top.map(([id,x])=>`<tr><td>${esc(S.productos.find(p=>p.producto_id==id)?.descripcion||'Producto')}</td><td class="n">${x.n}</td><td class="n">${nf(x.q)}</td></tr>`).join('')+'</table>':'<p><small>Cuando haga pedidos, acá vas a ver sus productos habituales.</small></p>'}
}

/* ---------- Pedidos y facturación ---------- */
async function vPedidos(){
  S.items=[];S.pcli=null;
  $('#v').innerHTML=`<h2>Pedidos</h2><div class="box">
  <input id="p_cq" placeholder="Cliente: escribí nombre o CUIT" autocomplete="off"><div id="p_cr"></div>
  <div id="p_sel" hidden><div class="clirow"><b id="p_cn"></b> <small id="p_cl"></small> <a id="p_cx">Cambiar</a></div>
    <div id="p_rep"></div><div id="p_fav" class="chips"></div></div>
  <div class="conscan"><input id="p_q" placeholder="Buscar producto (Enter agrega el primero)" autocomplete="off">${btnScan('p_sc')}</div><div id="p_r"></div><table id="p_i"></table><p><b id="p_t"></b></p><div id="p_av"></div><div id="p_sug" class="chips sug"></div><button id="p_g">Guardar pedido</button></div>
  <h3>Últimos pedidos</h3><table id="pl"></table>`;
  const cli=()=>S.pcli;
  const pr=p=>Number(p['precio_'+(cli()?.lista||'mayorista')]);
  const lis=()=>cli()?.lista||'mayorista',pi=i=>{const r=promoPara(i.p.producto_id,lis(),i.q);return{r,pu:r?Math.round(pr(i.p)*(1-r.descuento_pct/100)*100)/100:pr(i.p)}};
  const add=(p,q=1)=>{const it=S.items.find(i=>i.p.producto_id==p.producto_id);it?it.q+=q:S.items.push({p,q})};
  const drawI=()=>{let t=0;
    $('#p_i').innerHTML=S.items.map((i,k)=>{const P=pi(i),s=P.pu*i.q;t+=s;const pc=P.r?null:promoCerca(i.p.producto_id,lis());return `<tr><td>${esc(i.p.descripcion)} ${i.p.marca?`<span class="marca">${esc(i.p.marca)}</span>`:''}<br>${chipStock(i.p.producto_id,i.q)} ${chipBulto(i.p.producto_id)}</td><td class="qbox"><button class="alt qb" data-m="${k}" aria-label="Restar">−</button><input type="number" min="1" value="${i.q}" data-k="${k}" class="qty"><button class="alt qb" data-p="${k}" aria-label="Sumar">+</button>${bul(i.p.producto_id)?`<button class="alt qb bb" data-bb="${k}">+ ${esc(bul(i.p.producto_id).t)} (${bul(i.p.producto_id).n})</button>`:''}<br><small class="eq">${enBultos(i.p.producto_id,i.q)?'= '+enBultos(i.p.producto_id,i.q):''}</small></td><td class="pu">${P.r?`<s>${$m(pr(i.p))}</s><br>`:''}${$m(P.pu)}</td><td class="n">${$m(s)}${P.r?`<br>${chipPromo(P.r)}`:pc?`<br><small class="hint">Promo −${nf(pc.descuento_pct)} % ${esc(condPromo(pc))}</small>`:''}</td><td><a data-x="${k}">Quitar</a></td></tr>`}).join('');
    $('#p_t').textContent=S.items.length?S.items.length+(S.items.length==1?' producto':' productos')+' · Total: '+$m(t):'';
    const falta=S.stockOk&&S.inv?S.items.filter(i=>i.q>stk(i.p.producto_id).d).length:0;
    $('#p_av').innerHTML=falta?`<p class="aviso">${falta==1?'Un producto pide':falta+' productos piden'} más de lo disponible. Podés guardar igual; revisá antes de aprobar.</p>`:'';
    $$('.qty').forEach(e=>e.onchange=()=>{S.items[e.dataset.k].q=Math.max(1,+e.value||1);setTimeout(drawI)});
    $$('#p_i [data-m]').forEach(b=>b.onclick=()=>{const i=S.items[b.dataset.m];i.q>1?i.q--:S.items.splice(b.dataset.m,1);drawI()});
    $$('#p_i [data-p]').forEach(b=>b.onclick=()=>{S.items[b.dataset.p].q++;drawI()});
    $$('#p_i [data-bb]').forEach(b=>b.onclick=()=>{const i=S.items[b.dataset.bb];i.q+=bul(i.p.producto_id).n;drawI()});
    $$('#p_i [data-x]').forEach(a=>a.onclick=()=>{S.items.splice(a.dataset.x,1);drawI()});
    const SG=sugerencias(S.items,S.pfrec);$('#p_sug').innerHTML=SG.length?'<small>'+(SG.some(x=>x.t=='olvido')?'¿No se olvida de…? ':'')+(SG.some(x=>x.t=='otros')?'Otros clientes también llevan:':'')+'</small>'+SG.map(x=>`<button class="chip ${x.t}" data-sg="${x.p.producto_id}" data-sq="${Math.max(1,Math.round(x.q||bul(x.p.producto_id)?.n||1))}">+ ${esc(x.p.descripcion)}</button>`).join(''):'';
    $$('#p_sug [data-sg]').forEach(b=>b.onclick=()=>{add(S.productos.find(x=>x.producto_id==b.dataset.sg),+b.dataset.sq);drawI()})};
  drawI();
  /* Cliente: buscador */
  cargarCoocurrencias().then(()=>drawI());
  const elegir=async c=>{S.pcli=c;S.pfrec=null;$('#p_cq').hidden=true;$('#p_cr').innerHTML='';$('#p_sel').hidden=false;
    $('#p_cn').textContent=c.razon_social;$('#p_cl').textContent='Lista '+c.lista;drawI();
    $('#p_rep').innerHTML='<small>Buscando sus pedidos anteriores…</small>';$('#p_fav').innerHTML='';
    const{data:ped}=await sb.from('pedidos').select('id,numero,total,pedido_items(producto_id,cantidad)').eq('cliente_id',c.id).neq('estado','cancelado').order('numero',{ascending:false}).limit(10);
    if(S.pcli!==c)return;
    const P=(ped||[]).filter(o=>o.pedido_items?.length);
    if(!P.length){$('#p_rep').innerHTML='<small>Es su primer pedido.</small>';return}
    const u=P[0];
    $('#p_rep').innerHTML=`<button class="alt" id="p_ru">Repetir último pedido (N° ${u.numero} · ${u.pedido_items.length} productos)</button>`;
    $('#p_ru').onclick=()=>{let n=0;for(const it of u.pedido_items){const p=S.productos.find(x=>x.producto_id==it.producto_id);if(p){add(p,Number(it.cantidad)||1);n++}}
      drawI();toast(n+' productos agregados del pedido N° '+u.numero+'. Ajustá las cantidades si hace falta.')};
    const cnt={};for(const o of P)for(const it of o.pedido_items)cnt[it.producto_id]=(cnt[it.producto_id]||0)+1;
    {const fq={};for(const o of P)for(const it of o.pedido_items)fq[it.producto_id]=(fq[it.producto_id]||0)+Number(it.cantidad||0);S.pfrec={n:P.length,c:cnt,q:fq};drawI()}
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id])=>S.productos.find(x=>x.producto_id==id)).filter(Boolean);
    $('#p_fav').innerHTML=top.length?'<small>Lo que más compra (tocá para agregar):</small>'+top.map(p=>`<button class="chip" data-id="${p.producto_id}">${esc(p.descripcion)}</button>`).join(''):'';
    $$('#p_fav .chip').forEach(b=>b.onclick=()=>{add(S.productos.find(x=>x.producto_id==b.dataset.id));drawI()});
    $('#p_q').focus()};
  const listaCli=()=>{const q=$('#p_cq').value.toLowerCase().trim();
    const r=q?S.clientes.filter(c=>coincide(c.razon_social+' '+(c.cuit||''),q)).slice(0,8):[];
    $('#p_cr').innerHTML=q?(r.map(c=>`<div class="r" data-id="${c.id}">${esc(c.razon_social)} <small>${esc(c.cuit)}</small></div>`).join('')||'<small>No hay clientes con ese nombre.</small>'):'';
    $$('#p_cr .r').forEach(d=>d.onclick=()=>elegir(S.clientes.find(c=>c.id==d.dataset.id)));return r};
  $('#p_cq').oninput=listaCli;
  $('#p_cq').onkeydown=e=>{if(e.key=='Enter'){const r=listaCli();if(r.length)elegir(r[0])}};
  $('#p_cx').onclick=()=>{S.pcli=null;$('#p_sel').hidden=true;$('#p_cq').hidden=false;$('#p_cq').value='';$('#p_cq').focus();drawI()};
  /* Productos: Enter agrega el primero y deja el buscador listo */
  buscador('#p_q','#p_r',p=>{add(p);drawI();$('#p_q').focus()},p=>`<b>${$m(pr(p))}</b> ${chipStock(p.producto_id)} ${chipBulto(p.producto_id)} ${chipPromo(promoCerca(p.producto_id,lis()))}`);
  $('#p_sc').onclick=()=>escanear('Escanear productos del pedido',p=>{add(p);drawI();const it=S.items.find(i=>i.p.producto_id==p.producto_id);return '✔ '+p.descripcion+' · llevás '+it.q});
  $('#p_q').onkeydown=e=>{if(e.key=='Enter'){const f=$('#p_r .r');if(f)f.click()}};
  if(S.preCli){const c=S.preCli;S.preCli=null;elegir(c)}else $('#p_cq').focus();
  $('#p_g').onclick=async()=>{const c=cli();if(!c||!S.items.length)return toast('Elegí un cliente y agregá productos.',1);
    if(!await chequearCredito(c,S.items.reduce((a,i)=>a+pi(i).pu*i.q,0)))return;
    $('#p_g').disabled=true;
    const{data:o,error}=await sb.from('pedidos').insert({cliente_id:c.id,vendedor_id:S.perfil.id,lista:c.lista,descuento_pct:c.descuento_pct}).select().single();
    if(error){$('#p_g').disabled=false;return toast(error.message,1)}
    const{error:e2}=await sb.from('pedido_items').insert(S.items.map(i=>{const P=pi(i),x={pedido_id:o.id,producto_id:i.p.producto_id,cantidad:i.q,precio_unitario:P.pu};if(P.r)x.promo=P.r.nombre+' (−'+nf(P.r.descuento_pct)+' %)';return x}));
    if(e2){$('#p_g').disabled=false;return toast('El pedido N° '+o.numero+' quedó sin productos: '+e2.message,1)}
    toast('Pedido N° '+o.numero+' guardado.');await cargarStock();vPedidos()};
  listaPedidos();
}

/* ---------- Lista de pedidos: aprobar y facturar en un toque ---------- */
const EST_TXT={pendiente:'Por aprobar',aprobado:'Aprobado',en_preparacion:'En preparación',listo:'Listo',en_reparto:'En reparto',entregado:'Entregado',cancelado:'Cancelado'};
const SIG={aprobado:['en_preparacion','A preparación'],en_preparacion:['listo','Marcar listo'],listo:['en_reparto','Salió a reparto'],en_reparto:['entregado','Entregado']};
const FILTROS=[['abiertos','En curso'],['pendiente','Por aprobar'],['entregado','Entregados'],['todos','Todos']];
async function facturarPedido(o){
  const c=S.clientes.find(x=>x.id==o.cliente_id);if(!c){toast('No encuentro el cliente de este pedido.',1);return null}
  if(!(o.total>0)){toast('El pedido no tiene importe.',1);return null}
  const{data:ya}=await sb.from('facturas_venta').select('tipo,numero').eq('pedido_id',o.id).limit(1);
  if(ya?.length){toast('Este pedido ya tiene la factura '+ya[0].tipo+' N° '+ya[0].numero+'.',1);return null}
  const tipo=c.condicion_iva=='responsable_inscripto'?'A':'B';
  const{data:u}=await sb.from('facturas_venta').select('numero').eq('tipo',tipo).order('numero',{ascending:false}).limit(1);
  const v=new Date();v.setDate(v.getDate()+(c.condicion_pago_dias||0));
  const{data:f,error}=await sb.from('facturas_venta').insert({tipo,numero:(u?.[0]?.numero||0)+1,cliente_id:c.id,pedido_id:o.id,vencimiento:diaLocal(v),total:o.total}).select().single();
  if(error){toast(error.message,1);return null}
  return f}
async function cambiarEstado(o,e){const{error}=await sb.from('pedidos').update({estado:e}).eq('id',o.id);
  if(error){toast(error.message,1);return false}o.estado=e;cargarStock();return true}

          <button class="alt wa" data-w="${o.id}">WhatsApp</button><button class="alt" data-pdf="${o.id}">PDF</button>${['pendiente','cancelado'].includes(o.estado)?'':`<button class="alt" data-rm="${o.id}">Remito</button>`}${o.foto_remito?`<button class="alt" data-vr="${o.id}">🧾 Firmado</button>`:''}${['en_reparto','entregado'].includes(o.estado)?`<button class="alt wa" data-av="${o.id}">📲 Avisar</button>`:''}${o.estado=='entregado'?`<button class="alt" data-dv="${o.id}">Devolución</button>`:''}
          <select class="mas" data-e="${o.id}" aria-label="Cambiar estado"><option value="">Más…</option>${ESTADOS.filter(e=>e!=o.estado).map(e=>`<option value="${e}">${e=='cancelado'?'Cancelar pedido':'Pasar a: '+EST_TXT[e]}</option>`).join('')}</select></div></div>`}).join('')
      :'<p><small>No hay pedidos en esta lista.</small></p>';
    const ped=id=>data.find(x=>x.id==id);
    $$('#pl [data-ap]').forEach(b=>b.onclick=async()=>{const o0=ped(b.dataset.ap);if(!await chequearCredito(S.clientes.find(c=>c.id==o0.cliente_id),o0.total))return;b.disabled=true;if(await cambiarEstado(ped(b.dataset.ap),'aprobado'))toast('Pedido N° '+ped(b.dataset.ap).numero+' aprobado.');cargar()});
    $$('#pl [data-apf]').forEach(b=>b.onclick=async()=>{const o=ped(b.dataset.apf);if(!await chequearCredito(S.clientes.find(c=>c.id==o.cliente_id),o.total))return;b.disabled=true;

    $$('#pl [data-sig]').forEach(b=>b.onclick=async()=>{b.disabled=true;const o=ped(b.dataset.sig),n=SIG[o.estado][0];
      if(await cambiarEstado(o,n)){toast('Pedido N° '+o.numero+': '+EST_TXT[n]+'.');if(n=='en_reparto')modalAvisos([o],'sale');if(n=='entregado')fotoRemito(o,()=>modalAvisos([o],'entrega'))}cargar()});
    $$('#pl [data-fa]').forEach(b=>b.onclick=async()=>{b.disabled=true;const o=ped(b.dataset.fa),f=await facturarPedido(o);
      if(f)toast('Factura '+f.tipo+' N° '+f.numero+' generada por '+$m(f.total)+'.');cargar()});
    $$('#pl [data-e]').forEach(s=>s.onchange=async()=>{const o=ped(s.dataset.e),e=s.value;if(!e)return;
      if(e=='cancelado'&&!confirm('¿Cancelar el pedido N° '+o.numero+'? Se libera la mercadería reservada.')){s.value='';return}

/* ---------- Pedido por WhatsApp / PDF ---------- */
async function itemsPedido(o){
  const{data,error}=await sb.from('pedido_items').select('*').eq('pedido_id',o.id);
  if(error){toast('No se pudieron leer los productos: '+error.message,1);return null}
  return data.map(i=>({d:S.productos.find(p=>p.producto_id==i.producto_id)?.descripcion||'Producto',q:+i.cantidad,qt:cantTxt(i.producto_id,i.cantidad),pr:i.promo||'',pu:+i.precio_unitario,st:+i.cantidad*+i.precio_unitario}));
}
function telWA(t){let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9'))d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length==12)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,'$1$2');return d.length>=10?'549'+d:''}
async function enviarWA(o){
  const w=window.open('','_blank');
  const it=await itemsPedido(o);if(!it){w&&w.close();return}
  const c=S.clientes.find(x=>x.id==o.cliente_id)||{};
  const tot=it.reduce((a,i)=>a+i.st,0);
  const txt=`*Sabores de mi País*\nPedido N° ${o.numero} · ${c.razon_social||''}\n\n`+it.map(i=>`• ${i.qt} x ${i.d} — ${$m(i.st)}${i.pr?' _('+i.pr+')_':''}`).join('\n')+`\n\n*Total: ${$m(o.total||tot)}*`+(S.linkMP?'\n\n💳 Podés pagarlo con Mercado Pago:\n'+S.linkMP:'')+`\n\n¡Gracias por tu compra!`;
  const tel=telWA(c.telefono),url='https://wa.me/'+tel+'?text='+encodeURIComponent(txt);
  if(w)w.location.href=url;else location.href=url;
  if(!tel)toast('Este cliente no tiene teléfono cargado: elegí el contacto en WhatsApp.')
}

/* Extras contables al cobrar, pagar o cargar gastos (solo dueño): cuenta bancaria y cheques */

async function datosRecibo(x,c){
  const[sa,im]=await Promise.all([sb.from('saldos_clientes').select('saldo').eq('cliente_id',c.id).maybeSingle(),
    x.id!=null?sb.from('recibo_imputaciones').select('*').eq('recibo_id',x.id):Promise.resolve({data:[]})]);
  let fac=[];const I=im.error?[]:(im.data||[]);
  if(I.length){const ids=I.map(i=>i.factura_id).filter(Boolean);const{data:F}=ids.length?await sb.from('facturas_venta').select('id,tipo,numero').in('id',ids):{data:[]};
    fac=I.map(i=>{const f=(F||[]).find(y=>y.id==i.factura_id);return{t:f?'Factura '+f.tipo+' N° '+f.numero:'Factura',imp:Number(i.importe??i.monto??0)}})}
  const aplicado=fac.reduce((a,f)=>a+f.imp,0),cuenta=Math.max(0,Number(x.importe)-aplicado);
  return{saldo:sa.data?Number(sa.data.saldo):null,fac,cuenta:fac.length&&cuenta>0.005?cuenta:0}}

    w.document.write(`<html><head><meta charset="utf-8"><title>Reparto ${hoy}</title><style>body{font:13px system-ui,Segoe UI,sans-serif;margin:24px;color:#1c2333}h1{color:${MARCA.c};margin:0;font-size:20px}.top{display:flex;justify-content:space-between;border-bottom:2px solid ${MARCA.c};padding-bottom:8px;margin-bottom:8px}.p{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin:8px 0;page-break-inside:avoid}.p h2{font-size:15px;margin:0 0 4px}.n{font-variant-numeric:tabular-nums}.it{columns:2;font-size:12px;margin:6px 0;padding-left:18px}.pie{display:flex;justify-content:space-between;gap:12px;margin-top:6px}.f{border-top:1px solid #1c2333;width:200px;text-align:center;padding-top:2px;margin-top:28px;font-size:11px}.ayuda{background:#f6e9ec;padding:8px;border-radius:6px}@media print{.ayuda{display:none}}</style></head><body>

    ${E.map(x=>`<div class="p"><h2>${x.n}. ${esc(x.c.razon_social)} <span style="font-weight:400">· Pedido N° ${x.o.numero}${x.f?' · Factura '+x.f.tipo+' N° '+x.f.numero:''}</span></h2>

    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')};

/* ---------- Compras ---------- */

const provSel=(id,sel)=>`<select id="${id}"><option value="">Elegí un proveedor</option>${S.prov.map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.razon_social)}</option>`).join('')}</select>`;
const prodNom=id=>S.productos.find(p=>p.producto_id==id)?.descripcion||('Producto '+id);

async function vCompras(){
  $('#v').innerHTML=`<h2>Compras</h2><div class="sub">${[['ordenes','Órdenes de compra'],['sugerencia','Sugerencia de compra'],['proveedores','Proveedores'],['cuenta','Facturas y pagos']].map(([k,t])=>`<button class="${S.sub==k?'':'alt'}" data-s="${k}">${t}</button>`).join('')}</div><div id="cv">Cargando…</div>`;

/* Sugerencia de compra */
async function cSugerencia(){
  S.sg=S.sg||{dias:30,cob:15,bul:true,pv:''};const g=S.sg;
  $('#cv').innerHTML=`<div class="box"><p><small>Para cada producto calcula cuánto vendiste, cuánto tenés (disponible + lo que está en camino) y cuánto pedir para cubrir los próximos días, sin bajar del stock mínimo.</small></p>
    <div class="g"><label class="f">Proveedor<select id="sg_pv"><option value="">Todos</option>${S.prov.map(p=>`<option value="${p.id}" ${p.id==g.pv?'selected':''}>${esc(p.razon_social)}</option>`).join('')}</select></label>
      <label class="f">Mirar ventas de los últimos<select id="sg_d">${[15,30,60,90].map(n=>`<option value="${n}" ${n==g.dias?'selected':''}>${n} días</option>`).join('')}</select></label>
      <label class="f">Comprar para cubrir<select id="sg_c">${[7,15,30,45,60].map(n=>`<option value="${n}" ${n==g.cob?'selected':''}>${n} días</option>`).join('')}</select></label></div>
    <label class="chk"><input type="checkbox" id="sg_b" ${g.bul?'checked':''}> Redondear a bultos cerrados (caja / pack)</label></div><div id="sg_l">Calculando…</div>`;
  const re=()=>{g.pv=$('#sg_pv').value;g.dias=+$('#sg_d').value;g.cob=+$('#sg_c').value;g.bul=$('#sg_b').checked;calc()};
  ['#sg_pv','#sg_d','#sg_c','#sg_b'].forEach(k=>$(k).onchange=re);
  await cargarStock();
  const[pe,oc,uc]=await Promise.all([
    todo(()=>sb.from('pedidos').select('*,pedido_items(producto_id,cantidad)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('ordenes_compra_items').select('producto_id,cantidad,cantidad_recibida,ordenes_compra!inner(estado)').in('ordenes_compra.estado',['borrador','enviada','recibida_parcial'])),
    todo(()=>sb.from('ordenes_compra_items').select('producto_id,costo_unitario,id').order('id',{ascending:false}))]);
  if(pe.error){$('#sg_l').innerHTML='<p class="err">'+esc(pe.error.message)+'</p>';return}
  const camino={};for(const i of oc.data||[])camino[i.producto_id]=(camino[i.producto_id]||0)+Math.max(0,Number(i.cantidad)-Number(i.cantidad_recibida));
  const ultC={};for(const i of uc.data||[])if(ultC[i.producto_id]==null)ultC[i.producto_id]=Number(i.costo_unitario);
  const calc=()=>{
    const desde=new Date();desde.setDate(desde.getDate()-g.dias);const dd=diaLocal(desde);
    const vend={};for(const o of pe.data){const f=fechaDe(o);if(!f||diaLocal(f)<dd)continue;for(const i of o.pedido_items||[])vend[i.producto_id]=(vend[i.producto_id]||0)+Number(i.cantidad||0)}
    const filas=[];
    for(const p of S.productos){const id=p.producto_id,m=S.min[id]||{};if(m.a===false)continue;if(g.pv&&m.pv!=g.pv)continue;
      const v=vend[id]||0,min=m.m||0;if(!v&&!min)continue;
      const prom=v/g.dias,disp=S.inv?stk(id).d:0,cam=camino[id]||0,obj=Math.max(Math.ceil(prom*g.cob),min);
      let sug=Math.max(0,obj-disp-cam);if(sug>0&&g.bul&&m.b>1)sug=Math.ceil(sug/m.b)*m.b;
      if(!sug)continue;
      filas.push({p,id,pv:m.pv||'',v,prom,disp,cam,min,sug,c:ultC[id]??Number(p.costo||0)})}
    S.sgF=filas;
    const grupos={};for(const f of filas)(grupos[f.pv]=grupos[f.pv]||[]).push(f);
    const nomPv=id=>S.prov.find(p=>p.id==id)?.razon_social||'Sin proveedor asignado';
    $('#sg_l').innerHTML=(S.inv?'':'<p class="aviso">Todavía no cargaste el inventario: la sugerencia supone que no tenés stock. Cargalo en la pestaña Stock para que sea exacta.</p>')+
      (filas.length?Object.entries(grupos).sort((a,b)=>nomPv(a[0]).localeCompare(nomPv(b[0]))).map(([pv,F])=>{const tot=F.reduce((a,f)=>a+f.sug*f.c,0);return `<div class="box"><div class="bh"><h3>${esc(nomPv(pv))}</h3>${pv?`<button data-sgo="${pv}">Crear orden de compra · ${$m(tot)}</button>`:''}</div>
        <div class="tw"><table><tr><th>Producto</th><th class="n">Vendido ${g.dias} d.</th><th class="n">Por día</th><th class="n">Disponible</th><th class="n">En camino</th><th class="n">Mínimo</th><th class="n">Pedir</th><th class="n">Costo</th><th class="n">Subtotal</th></tr>
        ${F.sort((a,b)=>b.sug*b.c-a.sug*a.c).map(f=>`<tr><td>${esc(f.p.descripcion)} ${chipBulto(f.id)}</td><td class="n">${nf(f.v)}</td><td class="n">${nf(Math.round(f.prom*10)/10)}</td><td class="n ${f.disp<=0&&S.inv?'mora':''}">${S.inv?nf(f.disp):'—'}</td><td class="n">${f.cam?nf(f.cam):'—'}</td><td class="n">${f.min?nf(f.min):'—'}</td>
          <td class="n"><input type="number" min="0" step="1" class="sgq" data-id="${f.id}" value="${f.sug}"><br><small class="eq">${enBultos(f.id,f.sug)}</small></td><td class="n">${f.c?$m(f.c):'<span class="mora">sin costo</span>'}</td><td class="n" data-st="${f.id}">${$m(f.sug*f.c)}</td></tr>`).join('')}</table></div>
        ${pv?'':'<p><small>Asignales proveedor a estos productos para poder armar la orden.</small></p>'}</div>`}).join('')
      :`<div class="box"><p>No hace falta comprar nada${g.pv?' a este proveedor':''}: con lo que tenés y lo que viene en camino cubrís ${g.cob} días de ventas.</p>${Object.keys(vend).length?'':'<p><small>Todavía no hay ventas aprobadas en ese período para calcular.</small></p>'}</div>`);
    $$('.sgq').forEach(e=>e.onchange=()=>{const f=S.sgF.find(x=>x.id==e.dataset.id);f.sug=Math.max(0,Math.round(+e.value||0));e.nextElementSibling.nextElementSibling.textContent=enBultos(f.id,f.sug);$(`[data-st="${f.id}"]`).textContent=$m(f.sug*f.c)});
    $$('[data-sgo]').forEach(b=>b.onclick=async()=>{const F=S.sgF.filter(f=>f.pv==b.dataset.sgo&&f.sug>0);if(!F.length)return toast('No hay cantidades para pedir.',1);
      if(F.some(f=>!(f.c>0)))return toast('Hay productos sin costo: cargalo en Precios antes de armar la orden.',1);
      b.disabled=true;const{data:o,error}=await sb.from('ordenes_compra').insert({proveedor_id:b.dataset.sgo,observaciones:'Armada con la sugerencia de compra ('+g.cob+' días)'}).select().single();
      if(error){b.disabled=false;return toast(error.message,1)}
      const{error:e2}=await sb.from('ordenes_compra_items').insert(F.map(f=>({orden_id:o.id,producto_id:f.id,cantidad:f.sug,costo_unitario:f.c})));
      if(e2){await sb.from('ordenes_compra').delete().eq('id',o.id);b.disabled=false;return toast('No se pudo armar la orden: '+e2.message,1)}
      toast('Orden de compra N° '+o.id+' creada en borrador. Revisala e imprimila para mandarla.');S.sub='ordenes';vCompras()})};
  calc();
}

/* Órdenes de compra */
async function cOrdenes(){
  S.oc=[];
  $('#cv').innerHTML=`<div class="box"><b>Nueva orden de compra</b><div class="g" style="margin-top:8px">${provSel('o_p')}<input id="o_f" type="date" title="Fecha de entrega esperada"></div>
  <div class="conscan"><input id="o_q" placeholder="Buscar producto por nombre o código">${btnScan('o_sc')}</div><div id="o_r"></div><table id="o_i"></table><p><b id="o_t"></b></p>
  <input id="o_o" placeholder="Observaciones (opcional)"><button id="o_g">Guardar orden</button></div>
  <div id="rx"></div><h3>Órdenes</h3><table id="ol"></table>`;
  const drawI=()=>{let t=0;
    $('#o_i').innerHTML=S.oc.length?'<tr><th>Producto</th><th>Cant.</th><th>Costo unit.</th><th>Subtotal</th><th></th></tr>'+S.oc.map((i,k)=>{const s=i.c*i.q;t+=s;
      return `<tr><td>${esc(i.p.descripcion)}</td><td style="white-space:nowrap"><input type="number" min="1" value="${i.q}" data-k="${k}" class="oq">${bul(i.p.producto_id)?` <button class="alt qb bb" data-ob="${k}">+ ${esc(bul(i.p.producto_id).t)} (${bul(i.p.producto_id).n})</button><br><small class="eq">${enBultos(i.p.producto_id,i.q)?'= '+enBultos(i.p.producto_id,i.q):''}</small>`:''}</td><td><input type="number" min="0" step="0.01" value="${i.c}" data-k="${k}" class="oc" style="width:110px"></td><td>${$m(s)}</td><td><a data-x="${k}">Quitar</a></td></tr>`}).join(''):'';
    $('#o_t').textContent=S.oc.length?'Total: '+$m(t):'';
    $$('.oq').forEach(e=>e.onchange=()=>{S.oc[e.dataset.k].q=Math.max(1,+e.value||1);setTimeout(drawI)});
    $$('.oc').forEach(e=>e.onchange=()=>{S.oc[e.dataset.k].c=Math.max(0,+e.value||0);setTimeout(drawI)});
    $$('#o_i [data-x]').forEach(a=>a.onclick=()=>{S.oc.splice(a.dataset.x,1);drawI()});
    $$('#o_i [data-ob]').forEach(b=>b.onclick=()=>{const i=S.oc[b.dataset.ob];i.q+=bul(i.p.producto_id).n;drawI()})};
  drawI();
  $('#o_sc').onclick=()=>escanear('Escanear productos de la orden',p=>{agregarOC(p);return '✔ '+p.descripcion});
  const agregarOC=async p=>{const it=S.oc.find(i=>i.p.producto_id==p.producto_id);if(it){it.q++;return drawI()}
    const[u,pc]=await Promise.all([
      sb.from('ordenes_compra_items').select('costo_unitario').eq('producto_id',p.producto_id).order('id',{ascending:false}).limit(1),
      sb.from('productos').select('costo').eq('id',p.producto_id).maybeSingle()]);
    const c=Number(u.data?.[0]?.costo_unitario||pc.data?.costo||0);
    S.oc.push({p,q:1,c});drawI();
    if(!c)toast('Este producto no tiene costo cargado: escribilo a mano.',1)};
  buscador('#o_q','#o_r',agregarOC);
  $('#o_g').onclick=async()=>{const pv=$('#o_p').value;
    if(!pv||!S.oc.length)return toast('Elegí un proveedor y agregá productos.',1);
    if(S.oc.some(i=>!(i.c>0)))return toast('Completá el costo unitario de todos los productos.',1);
    const{data:o,error}=await sb.from('ordenes_compra').insert({proveedor_id:pv,fecha_entrega:$('#o_f').value||null,observaciones:$('#o_o').value.trim()||null}).select().single();
    if(error)return toast(error.message,1);
    const{error:e2}=await sb.from('ordenes_compra_items').insert(S.oc.map(i=>({orden_id:o.id,producto_id:i.p.producto_id,cantidad:i.q,costo_unitario:i.c})));
    if(e2){await sb.from('ordenes_compra').delete().eq('id',o.id);return toast('No se pudo guardar la orden: '+e2.message,1)}
    toast('Orden de compra N° '+o.id+' guardada.');cOrdenes()};

  const{data,error}=await sb.from('ordenes_compra').select('*,proveedores(razon_social)').order('id',{ascending:false}).limit(25);
  if(error)return $('#ol').innerHTML='<tr><td class="err">'+esc(error.message)+'</td></tr>';
  $('#ol').innerHTML='<tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Total</th><th>Estado</th><th></th></tr>'+(data.map(o=>{
    const cerrada=o.estado=='recibida'||o.estado=='anulada';
    const est=['borrador','enviada'].includes(o.estado)
      ?`<select data-e="${o.id}">${['borrador','enviada','anulada'].map(e=>`<option value="${e}" ${e==o.estado?'selected':''}>${OC_TXT[e]}</option>`).join('')}</select>`
      :`<span class="tag ${o.estado}">${OC_TXT[o.estado]}</span>`;
    return `<tr><td>${o.id}</td><td>${fd(o.fecha)}</td><td>${esc(o.proveedores?.razon_social)}</td><td>${$m(o.total)}</td><td>${est}</td>
      <td style="white-space:nowrap">${cerrada?'':`<button data-r="${o.id}">Recibir</button> `}<button class="alt" data-pr="${o.id}">Imprimir</button></td></tr>`}).join('')||'<tr><td colspan="6">Todavía no hay órdenes.</td></tr>');

function achicarFoto(file,max=800){return new Promise((ok,mal)=>{const r=new FileReader();r.onerror=()=>mal(new Error('No se pudo leer la foto'));
  r.onload=()=>{const im=new Image();im.onerror=()=>mal(new Error('Ese archivo no es una imagen.'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
    cv.toBlob(b=>b?ok(b):mal(new Error('No se pudo preparar la foto')),'image/webp',.85)};im.src=r.result};r.readAsDataURL(file)})}
function fotoProducto(id,alGuardar,pendientes){
  const p=S.productos.find(x=>x.producto_id==id);if(!p)return;let blob=null;
  const m=document.createElement('div');m.className='modal';
  const draw=()=>{const f=S.min[id]?.foto;m.innerHTML=`<div class="mc"><div class="bh"><h3>Foto · ${esc(p.descripcion)}</h3><button class="alt" id="fo_x">Cerrar</button></div>
    <div class="fpv" id="fo_pv">${blob?`<img src="${URL.createObjectURL(blob)}" alt="">`:f?`<img src="${esc(f)}" alt="">`:'Sin foto'}</div>
    <div class="fc-acc"><button id="fo_cam">📷 Sacar foto</button><button class="alt" id="fo_gal">Elegir de la galería</button>${f&&!blob?'<button class="alt" id="fo_del">Quitar foto</button>':''}</div>
    <input type="file" id="fo_fc" accept="image/*" capture="environment" hidden><input type="file" id="fo_fg" accept="image/*" hidden>
    <p><small>Consejo: fondo blanco o liso, buena luz y el paquete de frente. Se achica sola para que cargue rápido.</small></p>
    ${blob?'<div class="fc-acc"><button id="fo_ok">Guardar foto</button><button class="alt" id="fo_no">Descartar</button></div>':''}
    ${pendientes&&!blob?`<p id="fo_sig"></p>`:''}</div>`;
    $('#fo_x').onclick=()=>m.remove();$('#fo_cam').onclick=()=>$('#fo_fc').click();$('#fo_gal').onclick=()=>$('#fo_fg').click();
    const tomar=async e=>{const fi=e.target.files[0];if(!fi)return;try{blob=await achicarFoto(fi);draw()}catch(er){toast(er.message,1)}};$('#fo_fc').onchange=tomar;$('#fo_fg').onchange=tomar;
    $('#fo_no')&&($('#fo_no').onclick=()=>{blob=null;draw()});
    $('#fo_del')&&($('#fo_del').onclick=async()=>{if(!confirm('¿Quitar la foto de este producto?'))return;const{error}=await sb.rpc('fijar_foto',{p_producto:id,p_url:''});
      if(error)return toast(/fijar_foto/.test(error.message)?'Falta correr mejoras-clientes.sql en Supabase.':error.message,1);S.min[id].foto='';toast('Foto quitada.');alGuardar&&alGuardar();draw()});
    $('#fo_ok')&&($('#fo_ok').onclick=async()=>{const b=$('#fo_ok');b.disabled=true;b.textContent='Subiendo…';
      const path=id+'/'+Date.now()+'.webp';const up=await sb.storage.from('productos').upload(path,blob,{contentType:'image/webp',upsert:true});
      if(up.error){b.disabled=false;b.textContent='Guardar foto';return toast(/bucket|not found/i.test(up.error.message)?'Falta correr mejoras-clientes.sql en Supabase.':'No se pudo subir: '+up.error.message,1)}
      const url=sb.storage.from('productos').getPublicUrl(path).data.publicUrl;const{error}=await sb.rpc('fijar_foto',{p_producto:id,p_url:url});
      if(error){b.disabled=false;b.textContent='Guardar foto';return toast(error.message,1)}
      S.min[id]=Object.assign(S.min[id]||{},{foto:url});blob=null;toast('Foto guardada.');alGuardar&&alGuardar();
      if(pendientes){const L=pendientes().filter(x=>x!=id);if(L.length){m.remove();return fotoProducto(L[0],alGuardar,pendientes)}}draw()});
    if($('#fo_sig')){const L=pendientes().filter(x=>x!=id);$('#fo_sig').innerHTML=L.length?`<a class="lnk" id="fo_nx">Saltear y seguir con el próximo sin foto (quedan ${L.length}) →</a>`:'';
      $('#fo_nx')&&($('#fo_nx').onclick=()=>{m.remove();fotoProducto(L[0],alGuardar,pendientes)})}};
  document.body.appendChild(m);draw();
}

  if(!S.clientes.length||!('dias_visita' in S.clientes[0])){$('#cs').innerHTML='<div class="aviso">Falta correr <b>mejoras-clientes.sql</b> en Supabase. Después recargá la página.</div>';return}

  const del=S.clientes.filter(c=>(c.dias_visita||[]).includes(S.agD)).sort((a,b)=>(a.orden_visita||0)-(b.orden_visita||0)||a.razon_social.localeCompare(b.razon_social));
  const hace=d=>{if(!d)return 'nunca compró';const n=Math.floor((Date.now()-new Date(d))/864e5);return n<=0?'compró hoy':n==1?'compró ayer':'última compra hace '+n+' días'};

  $('#cs').innerHTML=`<div class="sub">${DIAS.slice(0,6).map(([n,t])=>`<button class="${S.agD==n?'':'alt'}" data-ad="${n}">${t}${n==hoyDow()?' (hoy)':''}</button>`).join('')}</div>

      <div class="acc"><button data-np="${c.id}">Pedido</button>${deuda[c.id]?`<button class="alt" data-co="${c.id}">Cobrar</button>`:''}<button class="alt wa" data-wa="${c.id}">WhatsApp</button><button class="alt" data-qt="${c.id}" aria-label="Quitar de este día">✕</button></div></div>`).join('')}</div>`

    <label class="f">¿Qué días se arma el pedido?</label>${chipsDias('fjd',f0?.dias||[])}

  const draw=()=>{const tot=it.reduce((a,x)=>a+x.q*Number(nom(x.id)?.['precio_'+(c.lista||'mayorista')]||0),0);
    $('#fj_l').innerHTML=it.length?it.map((x,i)=>`<div class="pf-it"><span>${esc(nom(x.id)?.descripcion||'Producto')}${enBultos(x.id,x.q)?' <small class="eq">'+enBultos(x.id,x.q)+'</small>':''}</span><input type="number" min="1" step="1" value="${x.q}" data-fq="${i}"><a class="lnk" data-fx="${i}">Quitar</a></div>`).join('')+`<p><small>${it.length} productos · aprox. ${$m(tot)} a precios de hoy</small></p>`:'<p><small>Agregá los productos que pide siempre.</small></p>';

  const add=p=>{if(!p)return;const x=it.find(y=>y.id==p.producto_id);const b=bul(p.producto_id)?.n||1;if(x)x.q+=b;else it.push({id:p.producto_id,q:b});draw()};
  buscador('#fj_q','#fj_r',add);$('#fj_sc').onclick=()=>escanear('Agregar al pedido fijo',p=>{add(p);return '✔ '+p.descripcion});
  $('#fj_ult').onclick=async()=>{const{data:o}=await sb.from('pedidos').select('id,pedido_items(producto_id,cantidad)').eq('cliente_id',c.id).neq('estado','cancelado').order('numero',{ascending:false}).limit(1);
    const I=o?.[0]?.pedido_items||[];if(!I.length)return toast('Este cliente todavía no tiene pedidos.',1);it=I.map(i=>({id:i.producto_id,q:+i.cantidad}));draw();toast(I.length+' productos copiados.')};

/* ======================= ALERTA DE MARGEN BAJO (Inicio, dueño) ======================= */
async function alertasMargen(){const box=$('#alm');if(!box||S.perfil.rol!='dueno')return;
  const min=S.margenMin??15,hace7=new Date(Date.now()-7*864e5).toISOString();
  const[hi,pr,pe]=await Promise.all([sb.from('historial_costos').select('producto_id,costo_anterior,costo_nuevo,fecha').gte('fecha',hace7).order('fecha',{ascending:false}).limit(2000),
    sb.from('promociones').select('*').eq('activa',true),
    todo(()=>sb.from('pedidos').select('id,numero,estado,cliente_id,pedido_items(producto_id,cantidad,precio_unitario)').in('estado',['pendiente','aprobado','en_preparacion','listo']).order('numero'))]);
  const A=[];const prod=id=>S.productos.find(p=>p.producto_id==id);
  // 1) costos que subieron
  const sub={};for(const h of hi.data||[]){if(sub[h.producto_id])continue;const a=+h.costo_anterior,n=+h.costo_nuevo;if(a>0&&n>a*1.0001)sub[h.producto_id]=n/a-1}
  const SU=Object.entries(sub).sort((a,b)=>b[1]-a[1]);
  if(SU.length){const prom=SU.reduce((a,x)=>a+x[1],0)/SU.length;
    A.push(`<div><b>${SU.length} ${SU.length==1?'producto subió':'productos subieron'} de costo esta semana</b> (promedio +${pctf(prom*100)}). Los precios de venta ya se actualizaron solos: avisales a tus clientes.
      <br><small>${SU.slice(0,4).map(([id,v])=>esc(prod(id)?.descripcion||'Producto')+' +'+pctf(v*100)).join(' · ')}${SU.length>4?' · y '+(SU.length-4)+' más':''}</small>
      <div class="fc-acc" style="margin-top:6px"><button class="alt" id="al_lp">Mandar lista actualizada</button><button class="alt" id="al_et">Imprimir etiquetas nuevas</button></div></div>`)}
  // 2) promociones que dejan poco margen
  for(const r of pr.data||[]){const hoy=diaLocal(new Date());if(r.desde>hoy||(r.hasta&&r.hasta<hoy))continue;
    const P=S.productos.filter(p=>r.alcance=='todos'||(r.alcance=='marca'&&String(p.marca||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='familia'&&String(p.familia||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='producto'&&p.producto_id==r.alcance_valor));
    const bajos=P.filter(p=>{const pv=+p.precio_mayorista*(1-r.descuento_pct/100),c=+p.costo;return pv>0&&c>0&&(pv-c)/pv*100<min});
    if(bajos.length)A.push(`<div><b>La promoción «${esc(r.nombre)}» (−${nf(r.descuento_pct)} %)</b> deja ${bajos.length} ${bajos.length==1?'producto':'productos'} con menos de ${nf(min)} % de ganancia en la lista mayorista.<br><small>${bajos.slice(0,3).map(p=>{const pv=+p.precio_mayorista*(1-r.descuento_pct/100);return esc(p.descripcion)+': '+pctf((pv-p.costo)/pv*100)}).join(' · ')}</small></div>`)}
  // 3) pedidos abiertos con precio viejo
  const malP=[];for(const o of pe.data||[]){const it=(o.pedido_items||[]).filter(i=>{const c=+(prod(i.producto_id)?.costo||0),pu=+i.precio_unitario;return c>0&&pu>0&&(pu-c)/pu*100<min});if(it.length)malP.push({o,it})}
  const av=await alertasVencimientos();if(av)A.push(av);
  if(malP.length)A.push(`<div><b>${malP.length} ${malP.length==1?'pedido abierto tiene':'pedidos abiertos tienen'} productos con menos de ${nf(min)} % de ganancia</b>, seguramente cargados antes de un aumento.<br><small>${malP.slice(0,5).map(x=>'Pedido N° '+x.o.numero+' ('+esc(nomCli(x.o.cliente_id))+'): '+x.it.length+' '+(x.it.length==1?'producto':'productos')).join(' · ')}</small></div>`);
  box.innerHTML=A.length?`<div class="aviso alm"><h3 style="margin:0 0 6px">⚠️ Alertas</h3>${A.join('<hr>')}<p><small>Te avisa cuando la ganancia baja del ${nf(min)} %. Lo cambiás en Precios.</small></p></div>`:'';
  $('#al_lp')&&($('#al_lp').onclick=()=>abrirListaPrecios(null));

async function leerArchivoLista(file){const n=file.name.toLowerCase();
  if(n.endsWith('.pdf')){await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,rows=[];
    for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();
      const it=tc.items.filter(x=>x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5],w:x.width}));
      const L=[];for(const t of it.sort((a,b)=>b.y-a.y||a.x-b.x)){let l=L.find(l=>Math.abs(l.y-t.y)<3);if(!l){l={y:t.y,t:[]};L.push(l)}l.t.push(t)}
      for(const l of L.sort((a,b)=>b.y-a.y)){const T=l.t.sort((a,b)=>a.x-b.x),cells=[];let prev=null;
        for(const t of T){if(prev&&t.x-(prev.x+prev.w)<6)cells[cells.length-1]+=' '+t.s;else cells.push(t.s);prev=t}rows.push(cells)}}
    return rows}
  if(/\.(xlsx|xls|ods)$/.test(n)){if(!window.XLSX)await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer());let rows=[];for(const sn of wb.SheetNames)rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''}));return rows.map(r=>r.map(c=>String(c??'').trim()))}
  return partirTexto(await file.text())}
function partirTexto(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.includes('\t')?l.split('\t'):l.includes(';')?l.split(';'):l.split(/\s{2,}/)).map(r=>r.map(c=>c.trim()))}
const kCod=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^0+(?=\d)/,'');
const STOP=new Set(['de','del','x','el','la','los','las','y','en','por','a','u','un','una','sabor','gr','g','grs','gramos','kg','cc','ml','lt','und','unid','uni']);
const toks=t=>norm(t).replace(/(\d)\s*(gr|g|grs|kg|cc|ml|lt)\b/g,'$1 ').split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w));
/* Qué tan parecido es un producto del CRM (a) a una fila del proveedor (b): los números del CRM (85 gr, 500 gr) tienen que estar en la fila */
function parecidoT(A,B){if(!A.size||!B.size)return 0;const nA=[...A].filter(w=>/^\d+$/.test(w));if(nA.some(n=>!B.has(n)))return 0;
  const wA=[...A].filter(w=>!/^\d+$/.test(w)),wB=[...B].filter(w=>!/^\d+$/.test(w));if(!wA.length)return 0;let i=0;for(const w of wA)if(B.has(w))i++;
  let j=0;for(const w of wB)if(A.has(w))j++;return .8*i/wA.length+.2*(wB.length?j/wB.length:0)}
const parecido=(a,b)=>parecidoT(new Set(toks(a)),new Set(toks(b)));

/* ======================= SUGERENCIAS AL CARGAR UN PEDIDO ======================= */
async function cargarCoocurrencias(){if(S.coOc)return S.coOc;
  const{data}=await sb.from('pedidos').select('id,pedido_items(producto_id)').neq('estado','cancelado').order('numero',{ascending:false}).limit(400);
  const co={},n={};for(const o of data||[]){const I=[...new Set((o.pedido_items||[]).map(i=>i.producto_id))];for(const a of I){n[a]=(n[a]||0)+1;for(const b of I)if(a!=b){co[a]=co[a]||{};co[a][b]=(co[a][b]||0)+1}}}
  return S.coOc={co,n}}
function sugerencias(items,frec){const en=new Set(items.map(i=>i.p.producto_id)),out=[];
  if(frec&&items.length)for(const[id,v]of Object.entries(frec.c).sort((a,b)=>b[1]-a[1]))if(!en.has(id)&&v>=2&&v/frec.n>=.3){const p=S.productos.find(x=>x.producto_id==id);if(p)out.push({p,t:'olvido',q:frec.q[id]/v})}
  if(S.coOc&&items.length){const sc={};for(const i of items){const r=S.coOc.co[i.p.producto_id]||{};for(const[b,k]of Object.entries(r))if(!en.has(b)&&k>=2)sc[b]=(sc[b]||0)+k/(S.coOc.n[i.p.producto_id]||1)}
    for(const[id]of Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,6)){if(out.some(x=>x.p.producto_id==id))continue;const p=S.productos.find(x=>x.producto_id==id);if(p)out.push({p,t:'otros'})}}
  return out.slice(0,8)}

async function objetivoMes(){const box=$('#obj');if(!box)return;
  const m=mesHoy(),[a,b]=mesRango(m),k='objetivo_'+m;
  const[cf,pe]=await Promise.all([sb.from('config_app').select('valor').eq('clave',k).maybeSingle(),
    todo(()=>sb.from('pedidos').select('total,creado_en').not('estado','in','(pendiente,cancelado)').gte('creado_en',tsAR(a)).lt('creado_en',tsAR(b)).order('creado_en'))]);
  const meta=Number(cf.data?.valor||0),v=(pe.data||[]).reduce((s,o)=>s+Number(o.total||0),0);
  const hoy=new Date(),dm=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate(),dh=hoy.getDate(),proy=v/dh*dm,falta=Math.max(0,meta-v),diasRest=dm-dh+1;
  if(!meta){box.innerHTML=S.perfil.rol=='dueno'?`<div class="box obj"><div class="bh"><h3 style="margin:0">🎯 Objetivo de ventas de ${mesNom(m).toLowerCase()}</h3><button class="alt" id="ob_e">Poner objetivo</button></div><p><small>Llevás vendido ${$m(v)} este mes. Poné una meta y te muestro cuánto te falta por día.</small></p></div>`:'';}
  else{const pc=Math.min(1,v/meta),ok=proy>=meta;
    box.innerHTML=`<div class="box obj"><div class="bh"><h3 style="margin:0">🎯 Objetivo de ${mesNom(m).toLowerCase()}: ${$m(meta)}</h3>${S.perfil.rol=='dueno'?'<a class="lnk" id="ob_e">Cambiar</a>':''}</div>
      <div class="obar"><i style="width:${(pc*100).toFixed(1)}%" class="${pc>=1?'lleno':''}"></i><span class="hoy" style="left:${(dh/dm*100).toFixed(1)}%" title="Hoy"></span></div>
      <div class="ofila"><span><b>${$m(v)}</b> vendido (${Math.round(v/meta*100)} %)</span><span>${pc>=1?'<b class="sube">¡Objetivo cumplido! 🎉</b>':'Faltan <b>'+$m(falta)+'</b> · '+$m(falta/diasRest)+' por día'}</span></div>
      <p><small>${pc>=1?'Vas '+$m(v-meta)+' arriba de la meta.':'A este ritmo cerrás el mes en <b class="'+(ok?'sube':'baja')+'">'+$m(proy)+'</b>'+(ok?': llegás.':': no llegás, faltarían '+$m(meta-proy)+'.')}</small></p></div>`}
  $('#ob_e')&&($('#ob_e').onclick=async()=>{const x=prompt('Objetivo de ventas de '+mesNom(m).toLowerCase()+' (en pesos, con IVA):',meta?String(meta):'');if(x===null)return;const n=numAR(x);if(!(n>0))return toast('Escribí un importe, por ejemplo 15000000.',1);
    const{error}=await sb.from('config_app').upsert({clave:k,valor:String(n)});error?toast(error.message,1):(toast('Objetivo guardado.'),objetivoMes())});
}

async function devolucion(o,alTerminar){
  const[it,nc]=await Promise.all([sb.from('pedido_items').select('producto_id,cantidad,precio_unitario').eq('pedido_id',o.id),sb.from('notas_credito').select('items').eq('pedido_id',o.id)]);
  if(nc.error)return toast(/notas_credito/.test(nc.error.message)?'Falta correr control.sql en Supabase.':nc.error.message,1);
  const dev={};for(const n of nc.data||[])for(const x of n.items||[])dev[x.id]=(dev[x.id]||0)+Number(x.q);
  const I=(it.data||[]).map(i=>({id:i.producto_id,max:Number(i.cantidad)-(dev[i.producto_id]||0),pu:Number(i.precio_unitario)})).filter(i=>i.max>0);
  if(!I.length)return toast('Todo este pedido ya fue devuelto.',1);
  const c=S.clientes.find(x=>x.id==o.cliente_id)||{};const m=document.createElement('div');m.className='modal';document.body.appendChild(m);
  m.innerHTML=`<div class="mc"><div class="bh"><h3>Devolución · Pedido N° ${o.numero}</h3><button class="alt" id="dv_x">Cerrar</button></div><p><small>${esc(c.razon_social||'')} · Poné cuántas unidades devuelve de cada producto.</small></p>
    <div class="tw"><table><tr><th>Producto</th><th class="n">Entregado</th><th class="n">Devuelve</th></tr>${I.map(i=>`<tr><td>${esc(nomProd(i.id))}<br><small>${$m(i.pu)} c/u</small></td><td class="n">${nf(i.max)}</td><td class="n"><input type="number" min="0" max="${i.max}" step="1" data-dq="${i.id}" style="width:80px;margin:0" inputmode="numeric"></td></tr>`).join('')}</table></div>
    <div class="g"><label class="f">Motivo<select id="dv_m"><option>Producto vencido</option><option>Producto roto o dañado</option><option>Error en el pedido</option><option>El cliente no lo quiso</option><option>Otro</option></select></label><input id="dv_n" placeholder="Detalle (opcional)"></div>
    <label class="chk"><input type="checkbox" id="dv_r" checked> La mercadería vuelve al stock para vender (destildá si se tira)</label>
    <p id="dv_t"></p><button id="dv_ok">Hacer nota de crédito</button></div>`;
  const tot=()=>I.reduce((a,i)=>a+Math.min(i.max,Math.max(0,+($(`[data-dq="${i.id}"]`).value||0)))*i.pu,0);
  const up=()=>$('#dv_t').innerHTML=tot()>0?'Nota de crédito por <b>'+$m(tot())+'</b>':'';m.querySelectorAll('[data-dq]').forEach(e=>e.oninput=up);
  $('#dv_m').onchange=()=>{if($('#dv_m').value.match(/vencido|roto/))$('#dv_r').checked=false};
  $('#dv_x').onclick=()=>m.remove();
  $('#dv_ok').onclick=async()=>{const items=I.map(i=>({id:i.id,q:Math.min(i.max,Math.max(0,Math.round(+($(`[data-dq="${i.id}"]`).value||0))))})).filter(x=>x.q>0);if(!items.length)return toast('Poné cuántas unidades devuelve.',1);
    $('#dv_ok').disabled=true;const motivo=$('#dv_m').value+($('#dv_n').value.trim()?' · '+$('#dv_n').value.trim():'');
    const{data,error}=await sb.rpc('registrar_devolucion',{p_pedido:o.id,p_items:items,p_motivo:motivo,p_reponer:$('#dv_r').checked});
    if(error){$('#dv_ok').disabled=false;return toast(error.message,1)}
    await cargarStock();m.innerHTML=`<div class="mc"><h3>Nota de crédito N° ${data.numero}</h3><p>Por <b>${$m(data.total)}</b>. ${data.facturado?'Ya se descontó de la cuenta del cliente.':'El pedido no estaba facturado: no se tocó la cuenta corriente.'}</p>
      <div class="fc-acc"><button id="nc_p">PDF</button><button class="alt wa" id="nc_w">WhatsApp</button><button class="alt" id="nc_x">Listo</button></div></div>`;
    const nc={numero:data.numero,total:data.total,motivo,items:items.map(x=>({...x,pu:I.find(i=>i.id==x.id).pu})),fecha:diaLocal(new Date()),pedido:o.numero};
    $('#nc_p').onclick=()=>ncPDF(nc,c);$('#nc_w').onclick=()=>window.open('https://wa.me/'+telWA(c.telefono)+'?text='+encodeURIComponent(`Hola! Te pasamos la *nota de crédito N° ${data.numero}* de *Sabores de mi País* por ${$m(data.total)}, por la devolución del pedido N° ${o.numero} (${motivo}).${data.facturado?' Ya está descontada de tu cuenta.':''}`),'_blank');
    $('#nc_x').onclick=()=>{m.remove();alTerminar&&alTerminar()}};
}

  <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}
