<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Sabores de mi País · Gestión</title>
<style>
:root{--m:#7b2d3e;--n:#17213a;--g:#f3f4f7;--l:#d9dce3;--ok:#1d7a46;--er:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,Segoe UI,sans-serif;color:#1c2333;background:var(--g)}
header{background:var(--n);color:#fff;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:10px 16px}
header nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
header nav a{padding:7px 14px;border-radius:6px;cursor:pointer;color:#cfd4e2}
header nav a.on{background:var(--m);color:#fff}
header span a{cursor:pointer;text-decoration:underline;margin-left:8px}
main{max-width:980px;margin:0 auto;padding:16px}
h2{margin:8px 0 12px}h3{margin:20px 0 8px}
.box{background:#fff;border:1px solid var(--l);border-radius:8px;padding:14px;margin-bottom:14px}
.login{max-width:340px;margin:12vh auto}
.login h1{font-size:22px;color:var(--m);margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:10px}
input,select{width:100%;padding:9px;border:1px solid #b9bfcc;border-radius:6px;font:inherit;background:#fff;margin-bottom:8px}
.g input,.g select{margin:0}
label.f{display:block;font-size:13px;color:#6a7184}
button{background:var(--m);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button:hover{filter:brightness(1.12)}
button.alt{background:#fff;color:var(--m);border:1px solid var(--m)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:8px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--l)}
th{background:#eceef3;font-weight:600}
td input{width:70px;margin:0;padding:5px}td select{margin:0;padding:5px;width:auto}td button{padding:5px 10px}
.r{padding:8px;border-bottom:1px solid var(--l);cursor:pointer}.r:hover{background:#f6e9ec}
small{color:#6a7184}td a{cursor:pointer;color:var(--er)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eceef3}
.tag.recibida{background:#d8efe1;color:var(--ok)}.tag.anulada{background:#f6dcda;color:var(--er)}.tag.recibida_parcial{background:#fff1cc;color:#7a5a00}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 18px;border-radius:8px;z-index:9;display:none}
.err{color:var(--er)}
.ped{background:#fff;border:1px solid var(--l);border-left:4px solid #b9bfcc;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;gap:8px}
.ped.est-pendiente{border-left-color:#c58a00}.ped.est-aprobado,.ped.est-en_preparacion,.ped.est-listo,.ped.est-en_reparto{border-left-color:#2f5ea8}.ped.est-entregado{border-left-color:var(--ok)}.ped.est-cancelado{border-left-color:#b9bfcc;opacity:.7}
.ped-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.ped-top .cli{flex:1;min-width:0}.ped-top .tot{font-weight:700;font-variant-numeric:tabular-nums}
.ped-acc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ped-acc button{padding:6px 12px;font-size:14px}
.ped-acc select.mas{width:auto;margin:0;padding:6px;font-size:14px}
.badge{font-size:12px;padding:3px 9px;border-radius:10px;background:#eceef3;font-weight:600}
.b-pendiente{background:#fff1cc;color:#7a5a00}.b-aprobado,.b-en_preparacion,.b-listo,.b-en_reparto{background:#dde7f6;color:#234a87}.b-entregado{background:#d8efe1;color:var(--ok)}.b-cancelado{background:#eceef3;color:#6a7184}
.fac{font-size:13px;color:var(--ok);font-weight:600}
.stk{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;margin-top:2px;white-space:nowrap}
.stok{background:#d8efe1;color:#1d7a46}.stb{background:#fff1cc;color:#7a5a00}.st0{background:#f6dcda;color:#b3261e}
.aviso{background:#fff1cc;color:#7a5a00;padding:8px 10px;border-radius:6px;font-size:14px}
td.bajo{color:#7a5a00;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:auto;margin:0}
.tw{overflow-x:auto}.tw table{display:table}
td input.cnt,td input.mn{width:84px;text-align:right}
#s_imp summary{cursor:pointer}#s_imp textarea{width:100%;font:13px ui-monospace,Consolas,monospace;padding:8px;border:1px solid #b9bfcc;border-radius:6px;margin:8px 0}
pre.ej{background:#f3f4f7;padding:8px;border-radius:6px;font-size:13px;margin:6px 0;overflow-x:auto}
.ok{color:var(--ok);font-weight:600}
.clirow{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:8px}.clirow a{cursor:pointer;color:var(--m);text-decoration:underline}
#p_rep{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.chips small{width:100%}
.chip{background:#f6e9ec;color:var(--m);border:1px solid #e5c9d0;border-radius:16px;padding:6px 12px;font-size:14px}
td.qbox{white-space:nowrap}button.wa{color:#1d7a46;border-color:#1d7a46}.chip:hover{filter:none;background:#efd8de}
@media(max-width:640px){#p_i .pu{display:none}#p_i{display:table}}td.qbox input{width:56px;text-align:center}td button.qb{padding:4px 10px;min-width:34px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kp .box{margin:0;display:grid;gap:4px}
.kp .lab{font-size:13px;color:#6a7184;text-transform:uppercase;letter-spacing:.04em}
.kp .num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kp .det{font-size:13px;color:#6a7184}
.kp .box.alerta{border-color:var(--er)}.kp .box.alerta .num{color:var(--er)}
.kp .box.ok .num{color:var(--ok)}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.dos .box{margin:0;min-width:0}.dos h3{margin:0 0 8px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mora{color:var(--er);font-weight:600}
@media(max-width:640px){table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ggfqdkgqtpnkvxoykoty.supabase.co','sb_publishable_kfvkZgS8FewPabohJrKf9Q_UDyEcQiR');
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $m=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?new Date(d+(String(d).length==10?'T12:00':'')).toLocaleDateString('es-AR'):'—';
const ESTADOS=['pendiente','aprobado','en_preparacion','listo','en_reparto','entregado','cancelado'];
let S={perfil:null,tab:'inicio',clientes:[],productos:[],items:[],sub:'ordenes',prov:[],oc:[]};
function toast(t,er){const e=$('#t');e.textContent=t;e.style.background=er?'var(--er)':'var(--ok)';e.style.display='block';setTimeout(()=>e.style.display='none',er?6000:3000)}
async function out(){await sb.auth.signOut();loginView()}

function loginView(){
  app.innerHTML=`<div class="box login"><h1>Sabores de mi País</h1><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña"><button id="go">Ingresar</button><p id="le" class="err"></p></div>`;
  const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#le').textContent=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':'Error de conexión: '+error.message+(error.status?' ('+error.status+')':'');else init()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function init(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
  const{data:p,error:pe}=await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(pe){app.innerHTML='<div class="box login"><p class="err">No se pudo leer tu perfil: '+esc(pe.message)+'</p><button onclick="out()">Salir</button></div>';return}
  if(!p||!p.activo){app.innerHTML='<div class="box login"><p>Tu usuario todavía no está activado. Pedile al dueño que lo active.</p><button onclick="out()">Salir</button></div>';return}
  S.perfil=p;
  const[c,pr]=await Promise.all([
    sb.from('clientes').select('*').eq('activo',true).order('razon_social'),
    sb.from('precios_productos').select('producto_id,codigo,descripcion,precio_mayorista,precio_minorista,precio_especial').order('descripcion').range(0,1999)]);
  if(c.error||pr.error){app.innerHTML='<div class="box login"><p class="err">No se pudieron cargar los datos: '+esc((c.error||pr.error).message)+'</p><button onclick="out()">Salir</button></div>';return}
  S.clientes=c.data;S.productos=pr.data;await cargarStock();shell();
}
function shell(){
  app.innerHTML=`<header><b>Sabores de mi País</b><nav>${['inicio','pedidos','clientes','cobranza','compras','stock'].map(t=>`<a data-t="${t}" class="${S.tab==t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</nav><span>${esc(S.perfil.nombre)} (${S.perfil.rol})<a onclick="out()">Salir</a></span></header><main id="v"></main>`;
  $$('nav a').forEach(a=>a.onclick=()=>{S.tab=a.dataset.t;shell()});
  ({inicio:vInicio,pedidos:vPedidos,clientes:vClientes,cobranza:vCobranza,compras:vCompras,stock:vStock})[S.tab]();
}

/* Stock: físico, reservado, disponible y mínimo por producto */
S.stock={};S.stockOk=false;S.min={};
async function cargarStock(){
  const[st,mi]=await Promise.all([sb.from('stock').select('producto_id,fisico,reservado,disponible').range(0,4999),
    sb.from('productos').select('id,stock_minimo,activo').range(0,4999)]);
  S.stockOk=!st.error;S.stock={};S.inv=false;
  for(const r of st.data||[]){S.stock[r.producto_id]={f:+r.fisico||0,r:+r.reservado||0,d:r.disponible!=null?+r.disponible:(+r.fisico||0)-(+r.reservado||0)};if(+r.fisico)S.inv=true}
  S.min={};for(const r of mi.data||[])S.min[r.id]={m:+r.stock_minimo||0,a:r.activo!==false};
}
const stk=id=>S.stock[id]||{f:0,r:0,d:0};
const nf=n=>Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
function chipStock(id,pide){if(!S.stockOk||!S.inv)return '';const d=stk(id).d,m=S.min[id]?.m||0;
  const c=d<=0||(pide&&pide>d)?'st0':(m&&d<=m?'stb':'stok');
  return `<span class="stk ${c}" title="Disponible en depósito">Disp. ${nf(d)}</span>`}

/* Buscador de productos reutilizable */
function buscador(inp,res,onPick,extra){
  $(inp).oninput=()=>{const q=$(inp).value.toLowerCase().trim();if(q.length<2){$(res).innerHTML='';return}
    const r=S.productos.filter(p=>(p.descripcion+' '+p.codigo).toLowerCase().includes(q)).slice(0,8);
    $(res).innerHTML=r.map(p=>`<div class="r" data-id="${p.producto_id}">${esc(p.descripcion)} <small>${esc(p.codigo)}</small> ${extra?extra(p):''}</div>`).join('')||'<small>Sin resultados.</small>';
    $$(res+' .r').forEach(d=>d.onclick=()=>{$(inp).value='';$(res).innerHTML='';onPick(S.productos.find(x=>x.producto_id==d.dataset.id))})};
}

/* ---------- Inicio (tablero) ---------- */
const fechaDe=o=>o.fecha||o.creado_en||o.created_at||o.fecha_emision||null;
const diaLocal=d=>{const x=new Date(String(d).length==10?d+'T12:00':d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
async function vInicio(){
  const hoyD=new Date(),hoy=diaLocal(hoyD),mes=hoy.slice(0,7);
  const en7=new Date();en7.setDate(en7.getDate()+7);const lim7=diaLocal(en7);
  $('#v').innerHTML=`<h2>Hoy, ${hoyD.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h2>
  <div class="kp">
    <div class="box" id="k1"><span class="lab">Facturado hoy</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="k2"><span class="lab">Pedidos por aprobar</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="k3"><span class="lab">Te deben los clientes</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="k4"><span class="lab">Les debés a proveedores</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="k5"><span class="lab">Stock bajo</span><span class="num">…</span><span class="det"></span></div>
  </div>
  <div class="dos">
    <div class="box"><h3>Pedidos por aprobar</h3><div id="t1">Cargando…</div></div>
    <div class="box"><h3>Facturas vencidas de clientes</h3><div id="t2">Cargando…</div></div>
    <div class="box"><h3>Pagos a proveedores (próximos 7 días)</h3><div id="t3">Cargando…</div></div>
    <div class="box"><h3>Productos para reponer</h3><div id="t4">Cargando…</div></div>
  </div>`;
  const kp=(id,num,det,cls)=>{const b=$('#'+id);b.querySelector('.num').textContent=num;b.querySelector('.det').textContent=det||'';if(cls)b.classList.add(cls)};
  const fallo=(id,e)=>kp(id,'—','No se pudo leer: '+e.message);
  const cli=id=>esc(S.clientes.find(c=>c.id==id)?.razon_social||'Cliente');
  const [fv,pe,fe,sp,fp]=await Promise.all([
    sb.from('facturas_venta').select('*').order('id',{ascending:false}).limit(500),
    sb.from('pedidos').select('*,clientes(razon_social)').eq('estado','pendiente').order('numero',{ascending:true}).limit(50),
    sb.from('facturas_estado').select('*').gt('pendiente',0.005).order('vencimiento').limit(500),
    sb.from('v_saldo_proveedores').select('*'),
    sb.from('facturas_proveedor').select('*,proveedores(razon_social)').lte('vencimiento',lim7).order('vencimiento').limit(50)]);
  // 1 facturado hoy y en el mes
  if(fv.error)fallo('k1',fv.error);else{
    let h=0,nh=0,m=0;for(const f of fv.data){const d=fechaDe(f);if(!d)continue;const k=diaLocal(d);const t=Number(f.total||0);if(k==hoy){h+=t;nh++}if(k.slice(0,7)==mes)m+=t}
    kp('k1',$m(h),nh+(nh==1?' factura':' facturas')+' · en el mes '+$m(m))}
  // 2 pedidos pendientes
  if(pe.error){fallo('k2',pe.error);$('#t1').innerHTML='<p class="err">'+esc(pe.error.message)+'</p>'}else{
    const P=pe.data,tot=P.reduce((a,o)=>a+Number(o.total||0),0);
    kp('k2',String(P.length),P.length?'Suman '+$m(tot):'Nada pendiente',P.length?'alerta':'ok');
    $('#t1').innerHTML=P.length?'<table><tr><th>N°</th><th>Cliente</th><th class="n">Total</th></tr>'+P.slice(0,8).map(o=>`<tr><td>${o.numero}</td><td>${esc(o.clientes?.razon_social)}</td><td class="n">${$m(o.total)}</td></tr>`).join('')+'</table>'+(P.length>8?`<small>Y ${P.length-8} más.</small>`:'')+'<p><button class="alt" id="irP">Ir a Pedidos</button></p>':'<p><small>No hay pedidos esperando aprobación.</small></p>';
    $('#irP')&&($('#irP').onclick=()=>{S.tab='pedidos';shell()})}
  // 3 deuda clientes
  if(fe.error){fallo('k3',fe.error);$('#t2').innerHTML='<p class="err">'+esc(fe.error.message)+'</p>'}else{
    const F=fe.data,tot=F.reduce((a,x)=>a+Number(x.pendiente||0),0),V=F.filter(x=>x.dias_mora>0),tv=V.reduce((a,x)=>a+Number(x.pendiente||0),0);
    kp('k3',$m(tot),V.length?'Vencido: '+$m(tv)+' en '+V.length+(V.length==1?' factura':' facturas'):'Nada vencido',V.length?'alerta':'');
    V.sort((a,b)=>b.dias_mora-a.dias_mora);
    $('#t2').innerHTML=V.length?'<table><tr><th>Cliente</th><th>Factura</th><th>Mora</th><th class="n">Debe</th></tr>'+V.slice(0,8).map(x=>`<tr><td>${cli(x.cliente_id)}</td><td>${x.tipo} ${x.numero}</td><td class="mora">${x.dias_mora} días</td><td class="n">${$m(x.pendiente)}</td></tr>`).join('')+'</table>'+(V.length>8?`<small>Y ${V.length-8} más.</small>`:'')+'<p><button class="alt" id="irC">Ir a Cobranza</button></p>':'<p><small>Ningún cliente tiene facturas vencidas.</small></p>';
    $('#irC')&&($('#irC').onclick=()=>{S.tab='cobranza';shell()})}
  // 4 proveedores
  if(sp.error)fallo('k4',sp.error);else{
    const D=sp.data.filter(x=>Number(x.saldo)>0.005),tot=D.reduce((a,x)=>a+Number(x.saldo),0);
    kp('k4',$m(tot),D.length?D.length+(D.length==1?' proveedor':' proveedores'):'Sin deudas')}
  if(fp.error)$('#t3').innerHTML='<p class="err">'+esc(fp.error.message)+'</p>';else{
    const sal=id=>Number(sp.data?.find(x=>x.proveedor_id==id)?.saldo||0);
    const L=fp.data.filter(f=>f.tipo!='NC'&&sal(f.proveedor_id)>0.005);
    $('#t3').innerHTML=L.length?'<table><tr><th>Proveedor</th><th>Factura</th><th>Vence</th><th class="n">Total</th></tr>'+L.slice(0,8).map(f=>`<tr><td>${esc(f.proveedores?.razon_social)}</td><td>${f.tipo} ${esc(f.numero)}</td><td class="${f.vencimiento<hoy?'mora':''}">${fd(f.vencimiento)}</td><td class="n">${$m(f.total)}</td></tr>`).join('')+'</table><p><button class="alt" id="irV">Ir a Compras</button></p>':'<p><small>No hay facturas de proveedores por vencer esta semana.</small></p>';
    $('#irV')&&($('#irV').onclick=()=>{S.tab='compras';S.sub='cuenta';shell()})}
  // 5 stock bajo
  await cargarStock();
  if(!S.stockOk){kp('k5','—','No se pudo leer el stock');$('#t4').innerHTML='<p class="err">No se pudo leer el stock. Corré stock.sql en Supabase.</p>'}else{
    if(!S.inv){kp('k5','—','Inventario sin cargar');$('#t4').innerHTML='<p><small>Todavía no cargaste el inventario. Cuando hagas el conteo, cargalo en la pestaña Stock y acá vas a ver qué reponer.</small></p><p><button class="alt" id="irS">Ir a Stock</button></p>';$('#irS').onclick=()=>{S.tab='stock';shell()};return}
    const B=bajos();
    kp('k5',String(B.length),B.length?(B.filter(x=>x.d<=0).length+' sin stock'):'Todo sobre el mínimo',B.length?'alerta':'ok');
    $('#t4').innerHTML=B.length?'<table><tr><th>Producto</th><th class="n">Disp.</th><th class="n">Mín.</th></tr>'+B.slice(0,8).map(x=>`<tr><td>${esc(x.p.descripcion)}</td><td class="n ${x.d<=0?'mora':''}">${nf(x.d)}</td><td class="n">${nf(x.m)}</td></tr>`).join('')+'</table>'+(B.length>8?`<small>Y ${B.length-8} más.</small>`:'')+'<p><button class="alt" id="irS">Ir a Stock</button></p>':'<p><small>Ningún producto está por debajo de su mínimo.</small></p>';
    $('#irS')&&($('#irS').onclick=()=>{S.tab='stock';S.soloBajo=true;shell()})}
}
/* Productos activos con mínimo cargado y disponible en o por debajo del mínimo */
function bajos(){return S.productos.map(p=>({p,d:stk(p.producto_id).d,m:S.min[p.producto_id]?.m||0,a:S.min[p.producto_id]?.a!==false}))
  .filter(x=>x.a&&x.m>0&&x.d<=x.m).sort((a,b)=>(a.d-a.m)-(b.d-b.m))}

/* ---------- Stock ---------- */
async function vStock(){
  $('#v').innerHTML=`<h2>Stock</h2>
  <div class="box"><div class="g"><input id="s_q" placeholder="Buscar producto por nombre o código" autocomplete="off">
    <label class="chk"><input type="checkbox" id="s_b" ${S.soloBajo?'checked':''}> Solo bajo el mínimo</label></div>
    <p><small>Escribí en <b>Contado</b> lo que hay en el depósito y, si querés, el <b>Mínimo</b> para que te avise cuándo reponer. Después tocá <b>Guardar cambios</b>. La diferencia de stock queda registrada como ajuste.</small></p>
    <div class="tw"><table id="s_t"></table></div>
    <div class="g" style="margin-top:10px"><input id="s_mot" placeholder="Motivo (opcional, ej.: inventario inicial)"></div>
    <button id="s_g">Guardar cambios</button> <span id="s_n"></span></div>
  <details class="box" id="s_imp"><summary><b>Cargar muchos productos de una vez (pegar desde Excel)</b></summary>
    <p><small>Armá en Excel o Google Sheets una planilla con estas columnas, en este orden y sin títulos: <b>Código</b> · <b>Cantidad contada</b> · <b>Mínimo</b> (opcional). Seleccioná las filas, copialas y pegalas acá.</small></p>
    <pre class="ej">SDMP-00594	24	6
SDMP-01279	10	2
SDMP-01281	36</pre>
    <textarea id="s_pg" rows="8" placeholder="Pegá acá las filas copiadas de la planilla"></textarea>
    <button class="alt" id="s_rev">Revisar</button> <div id="s_res"></div></details>`;
  await cargarStock();
  if(!S.stockOk){$('#s_t').innerHTML='<tr><td class="err">No se pudo leer el stock. Corré stock.sql en Supabase.</td></tr>';return}
  const cont={},mins={};
  const upd=()=>{const n=new Set([...Object.keys(cont),...Object.keys(mins)]).size;$('#s_n').textContent=n?n+(n==1?' producto con cambios':' productos con cambios'):''};
  const draw=()=>{const q=$('#s_q').value.toLowerCase().trim(),sb_=$('#s_b').checked;
    let L=S.productos.filter(p=>S.min[p.producto_id]?.a!==false);
    if(q)L=L.filter(p=>(p.descripcion+' '+p.codigo).toLowerCase().includes(q));
    if(sb_){const ids=new Set(bajos().map(x=>x.p.producto_id));L=L.filter(p=>ids.has(p.producto_id))}
    const V=L.slice(0,200);
    $('#s_t').innerHTML='<tr><th>Producto</th><th class="n">Físico</th><th class="n">Reservado</th><th class="n">Disponible</th><th class="n">Mínimo</th><th class="n">Contado</th></tr>'+
      V.map(p=>{const id=p.producto_id,s=stk(id),m=S.min[id]?.m||0;
        return `<tr><td>${esc(p.descripcion)} <small>${esc(p.codigo)}</small></td><td class="n">${nf(s.f)}</td><td class="n">${nf(s.r)}</td><td class="n ${S.inv&&s.d<=0?'mora':(m&&s.d<=m?'bajo':'')}">${nf(s.d)}</td>
        <td class="n"><input type="number" min="0" step="1" class="mn" data-id="${id}" value="${mins[id]??''}" placeholder="${m?nf(m):'—'}"></td>
        <td class="n"><input type="number" min="0" step="1" class="cnt" data-id="${id}" value="${cont[id]??''}" placeholder="${nf(s.f)}"></td></tr>`}).join('')+
      (L.length>V.length?`<tr><td colspan="6"><small>Se muestran 200 de ${L.length}. Buscá para encontrar el resto.</small></td></tr>`:'')+
      (L.length?'':'<tr><td colspan="6"><small>No hay productos para mostrar.</small></td></tr>');
    $$('.cnt').forEach(e=>e.oninput=()=>{e.value===''?delete cont[e.dataset.id]:cont[e.dataset.id]=e.value;upd()});
    $$('.mn').forEach(e=>e.oninput=()=>{e.value===''?delete mins[e.dataset.id]:mins[e.dataset.id]=e.value;upd()})};
  $('#s_q').oninput=draw;$('#s_b').onchange=()=>{S.soloBajo=$('#s_b').checked;draw()};draw();
  const guardar=async(C,M,mot)=>{let ok=0,err=null;
    for(const id of Object.keys(M)){const{error}=await sb.rpc('fijar_minimo',{p_producto:id,p_minimo:+M[id]});if(error){err=error;break}ok++}
    if(!err)for(const id of Object.keys(C)){const{error}=await sb.rpc('ajustar_stock',{p_producto:id,p_contado:+C[id],p_motivo:mot});if(error){err=error;break}ok++}
    return{ok,err}};
  $('#s_g').onclick=async()=>{if(!Object.keys(cont).length&&!Object.keys(mins).length)return toast('Escribí al menos un Contado o un Mínimo.',1);
    if([...Object.values(cont),...Object.values(mins)].some(v=>!(+v>=0)))return toast('Las cantidades no pueden ser negativas.',1);
    $('#s_g').disabled=true;const{ok,err}=await guardar(cont,mins,$('#s_mot').value.trim()||'Conteo de inventario');
    if(!err){for(const k in cont)delete cont[k];for(const k in mins)delete mins[k]}
    await cargarStock();$('#s_g').disabled=false;draw();upd();
    err?toast('No se pudo guardar: '+err.message,1):toast('Cambios guardados: '+ok+(ok==1?' dato actualizado.':' datos actualizados.'))};
  /* Pegar desde Excel */
  let plan=null;
  $('#s_rev').onclick=()=>{const porCod={};for(const p of S.productos)porCod[String(p.codigo).trim().toUpperCase()]=p;
    const ok=[],mal=[];
    for(const raw of $('#s_pg').value.split(/\r?\n/)){const l=raw.trim();if(!l)continue;
      const c=l.split(/\t|;/).map(x=>x.trim());const p=porCod[(c[0]||'').toUpperCase()];
      const num=x=>x===undefined||x===''?null:Number(String(x).replace(/\./g,'').replace(',','.'));
      const q=num(c[1]),m=num(c[2]);
      if(!p)mal.push(l+' → no encontré ese código');else if(q===null&&m===null||[q,m].some(v=>v!==null&&!(v>=0)))mal.push(l+' → cantidad no válida');else ok.push({p,q,m})}
    plan=ok;
    $('#s_res').innerHTML=(ok.length?`<p><b>${ok.length}</b> ${ok.length==1?'producto listo':'productos listos'} para cargar.</p>`:'<p>No hay filas válidas.</p>')+
      (mal.length?`<p class="err">${mal.length} ${mal.length==1?'fila no se va a cargar':'filas no se van a cargar'}:</p><ul class="err">${mal.slice(0,10).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${mal.length>10?'<small>Y '+(mal.length-10)+' más.</small>':''}`:'')+
      (ok.length?`<button id="s_ap">Cargar ${ok.length} ${ok.length==1?'producto':'productos'}</button>`:'');
    $('#s_ap')&&($('#s_ap').onclick=async()=>{$('#s_ap').disabled=true;$('#s_ap').textContent='Cargando…';
      const C={},M={};for(const x of plan){if(x.q!==null)C[x.p.producto_id]=x.q;if(x.m!==null)M[x.p.producto_id]=x.m}
      const{ok,err}=await guardar(C,M,$('#s_mot').value.trim()||'Carga desde planilla');
      await cargarStock();draw();
      if(err){$('#s_res').innerHTML='<p class="err">Se cargaron '+ok+' datos y después falló: '+esc(err.message)+'</p>';return}
      $('#s_pg').value='';$('#s_res').innerHTML='<p class="ok">Listo: '+plan.length+' productos cargados.</p>';toast('Planilla cargada.')})};
}

    $$('#p_i [data-m]').forEach(b=>b.onclick=()=>{const i=S.items[b.dataset.m];i.q>1?i.q--:S.items.splice(b.dataset.m,1);drawI()});

    $$('#p_i [data-x]').forEach(a=>a.onclick=()=>{S.items.splice(a.dataset.x,1);drawI()})};

    if(S.pcli!==c)return;
    const P=(ped||[]).filter(o=>o.pedido_items?.length);

    $('#p_rep').innerHTML=`<button class="alt" id="p_ru">Repetir último pedido (N° ${u.numero} · ${u.pedido_items.length} productos)</button>`;
    $('#p_ru').onclick=()=>{let n=0;for(const it of u.pedido_items){const p=S.productos.find(x=>x.producto_id==it.producto_id);if(p){add(p,Number(it.cantidad)||1);n++}}
      drawI();toast(n+' productos agregados del pedido N° '+u.numero+'. Ajustá las cantidades si hace falta.')};
    const cnt={};for(const o of P)for(const it of o.pedido_items)cnt[it.producto_id]=(cnt[it.producto_id]||0)+1;
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id])=>S.productos.find(x=>x.producto_id==id)).filter(Boolean);
    $('#p_fav').innerHTML=top.length?'<small>Lo que más compra (tocá para agregar):</small>'+top.map(p=>`<button class="chip" data-id="${p.producto_id}">${esc(p.descripcion)}</button>`).join(''):'';
    $$('#p_fav .chip').forEach(b=>b.onclick=()=>{add(S.productos.find(x=>x.producto_id==b.dataset.id));drawI()});
    $('#p_q').focus()};
  const listaCli=()=>{const q=$('#p_cq').value.toLowerCase().trim();
    const r=q?S.clientes.filter(c=>(c.razon_social+' '+(c.cuit||'')).toLowerCase().includes(q)).slice(0,8):[];
    $('#p_cr').innerHTML=q?(r.map(c=>`<div class="r" data-id="${c.id}">${esc(c.razon_social)} <small>${esc(c.cuit)}</small></div>`).join('')||'<small>No hay clientes con ese nombre.</small>'):'';
    $$('#p_cr .r').forEach(d=>d.onclick=()=>elegir(S.clientes.find(c=>c.id==d.dataset.id)));return r};

  $('#p_cq').focus();
  $('#p_g').onclick=async()=>{const c=cli();if(!c||!S.items.length)return toast('Elegí un cliente y agregá productos.',1);

    if(error){$('#p_g').disabled=false;return toast(error.message,1)}
    const{error:e2}=await sb.from('pedido_items').insert(S.items.map(i=>({pedido_id:o.id,producto_id:i.p.producto_id,cantidad:i.q,precio_unitario:pr(i.p)})));
    if(e2){$('#p_g').disabled=false;return toast('El pedido N° '+o.numero+' quedó sin productos: '+e2.message,1)}
    toast('Pedido N° '+o.numero+' guardado.');await cargarStock();vPedidos()};
  listaPedidos();
}

/* ---------- Lista de pedidos: aprobar y facturar en un toque ---------- */
const EST_TXT={pendiente:'Por aprobar',aprobado:'Aprobado',en_preparacion:'En preparación',listo:'Listo',en_reparto:'En reparto',entregado:'Entregado',cancelado:'Cancelado'};
const SIG={aprobado:['en_preparacion','A preparación'],en_preparacion:['listo','Marcar listo'],listo:['en_reparto','Salió a reparto'],en_reparto:['entregado','Entregado']};
const FILTROS=[['abiertos','En curso'],['pendiente','Por aprobar'],['entregado','Entregados'],['todos','Todos']];
async function facturarPedido(o){
  const c=S.clientes.find(x=>x.id==o.cliente_id);if(!c){toast('No encuentro el cliente de este pedido.',1);return null}
  if(!(o.total>0)){toast('El pedido no tiene importe.',1);return null}
  const{data:ya}=await sb.from('facturas_venta').select('tipo,numero').eq('pedido_id',o.id).limit(1);
  if(ya?.length){toast('Este pedido ya tiene la factura '+ya[0].tipo+' N° '+ya[0].numero+'.',1);return null}
  const tipo=c.condicion_iva=='responsable_inscripto'?'A':'B';
  const{data:u}=await sb.from('facturas_venta').select('numero').eq('tipo',tipo).order('numero',{ascending:false}).limit(1);
  const v=new Date();v.setDate(v.getDate()+(c.condicion_pago_dias||0));
  const{data:f,error}=await sb.from('facturas_venta').insert({tipo,numero:(u?.[0]?.numero||0)+1,cliente_id:c.id,pedido_id:o.id,vencimiento:diaLocal(v),total:o.total}).select().single();
  if(error){toast(error.message,1);return null}
  return f}
async function cambiarEstado(o,e){const{error}=await sb.from('pedidos').update({estado:e}).eq('id',o.id);
  if(error){toast(error.message,1);return false}o.estado=e;cargarStock();return true}
async function listaPedidos(){
  S.pf=S.pf||'abiertos';
  $('#pl').outerHTML=`<div class="sub" id="pfil">${FILTROS.map(([k,t])=>`<button class="${S.pf==k?'':'alt'}" data-pf="${k}">${t}</button>`).join('')}</div><div id="pl">Cargando…</div>`;
  $$('[data-pf]').forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;$$('[data-pf]').forEach(x=>x.className=x.dataset.pf==S.pf?'':'alt');cargar()});
  const cargar=async()=>{
    let q=sb.from('pedidos').select('*,clientes(razon_social)').order('numero',{ascending:false}).limit(30);
    if(S.pf=='abiertos')q=q.not('estado','in','(entregado,cancelado)');else if(S.pf!='todos')q=q.eq('estado',S.pf);
    const{data,error}=await q;if(error){$('#pl').innerHTML='<p class="err">'+esc(error.message)+'</p>';return}
    const ids=data.map(o=>o.id),fac={};
    if(ids.length){const{data:F}=await sb.from('facturas_venta').select('pedido_id,tipo,numero').in('pedido_id',ids);for(const f of F||[])fac[f.pedido_id]=f}
    $('#pl').innerHTML=data.length?data.map(o=>{const f=fac[o.id],sig=SIG[o.estado],cerr=o.estado=='cancelado';
      const prin=o.estado=='pendiente'
        ?`<button data-ap="${o.id}">Aprobar</button>${f?'':`<button data-apf="${o.id}">Aprobar y facturar</button>`}`
        :(sig?`<button data-sig="${o.id}">${sig[1]}</button>`:'');
      const fb=cerr?'':(f?`<span class="fac">Factura ${f.tipo} N° ${f.numero}</span>`:(o.estado=='pendiente'?'':`<button data-fa="${o.id}">Facturar</button>`));
      return `<div class="ped est-${o.estado}">
        <div class="ped-top"><b>N° ${o.numero}</b> <span class="cli">${esc(o.clientes?.razon_social)}</span><span class="tot">${$m(o.total)}</span></div>
        <div class="ped-acc"><span class="badge b-${o.estado}">${EST_TXT[o.estado]||o.estado}</span>${prin}${fb}
          <button class="alt wa" data-w="${o.id}">WhatsApp</button><button class="alt" data-pdf="${o.id}">PDF</button>
          <select class="mas" data-e="${o.id}" aria-label="Cambiar estado"><option value="">Más…</option>${ESTADOS.filter(e=>e!=o.estado).map(e=>`<option value="${e}">${e=='cancelado'?'Cancelar pedido':'Pasar a: '+EST_TXT[e]}</option>`).join('')}</select></div></div>`}).join('')
      :'<p><small>No hay pedidos en esta lista.</small></p>';
    const ped=id=>data.find(x=>x.id==id);
    $$('#pl [data-ap]').forEach(b=>b.onclick=async()=>{b.disabled=true;if(await cambiarEstado(ped(b.dataset.ap),'aprobado'))toast('Pedido N° '+ped(b.dataset.ap).numero+' aprobado.');cargar()});
    $$('#pl [data-apf]').forEach(b=>b.onclick=async()=>{b.disabled=true;const o=ped(b.dataset.apf);
      if(!await cambiarEstado(o,'aprobado'))return cargar();const f=await facturarPedido(o);
      if(f)toast('Pedido N° '+o.numero+' aprobado y facturado: '+f.tipo+' N° '+f.numero+' por '+$m(f.total)+'.');cargar()});
    $$('#pl [data-sig]').forEach(b=>b.onclick=async()=>{b.disabled=true;const o=ped(b.dataset.sig),n=SIG[o.estado][0];
      if(await cambiarEstado(o,n))toast('Pedido N° '+o.numero+': '+EST_TXT[n]+'.');cargar()});
    $$('#pl [data-fa]').forEach(b=>b.onclick=async()=>{b.disabled=true;const o=ped(b.dataset.fa),f=await facturarPedido(o);
      if(f)toast('Factura '+f.tipo+' N° '+f.numero+' generada por '+$m(f.total)+'.');cargar()});
    $$('#pl [data-e]').forEach(s=>s.onchange=async()=>{const o=ped(s.dataset.e),e=s.value;if(!e)return;
      if(e=='cancelado'&&!confirm('¿Cancelar el pedido N° '+o.numero+'? Se libera la mercadería reservada.')){s.value='';return}
      if(await cambiarEstado(o,e))toast('Pedido N° '+o.numero+': '+EST_TXT[e]+'.');cargar()});
    $$('#pl [data-w]').forEach(b=>b.onclick=()=>enviarWA(ped(b.dataset.w)));
    $$('#pl [data-pdf]').forEach(b=>b.onclick=()=>pedidoPDF(ped(b.dataset.pdf)));
  };
  cargar();
}

/* ---------- Pedido por WhatsApp / PDF ---------- */
async function itemsPedido(o){
  const{data,error}=await sb.from('pedido_items').select('*').eq('pedido_id',o.id);
  if(error){toast('No se pudieron leer los productos: '+error.message,1);return null}
  return data.map(i=>({d:S.productos.find(p=>p.producto_id==i.producto_id)?.descripcion||'Producto',q:+i.cantidad,pu:+i.precio_unitario,st:+i.cantidad*+i.precio_unitario}));

function telWA(t){let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9'))d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length==12)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,'$1$2');return d.length>=10?'549'+d:''}

    ['#f_ne','#f_iv','#f_pe'].forEach(k=>$(k).oninput=()=>$('#f_tot').textContent=$m(tot()));
    $('#f_ne').onchange=()=>{if(!$('#f_iv').value&&$('#f_t').value=='A'){$('#f_iv').value=(+$('#f_ne').value*0.21).toFixed(2);$('#f_tot').textContent=$m(tot())}};
    $('#f_g').onclick=async()=>{const n=$('#f_n').value.trim();if(!n||!(tot()>0))return toast('Completá número e importes de la factura.',1);
      const v=new Date($('#f_f').value+'T12:00');v.setDate(v.getDate()+(pv.dias_pago||0));
      const{error}=await sb.from('facturas_proveedor').insert({proveedor_id:id,tipo:$('#f_t').value,numero:n,fecha:$('#f_f').value,vencimiento:v.toISOString().slice(0,10),
        orden_id:+$('#f_o').value||null,neto:+$('#f_ne').value||0,iva:+$('#f_iv').value||0,percepciones:+$('#f_pe').value||0});
      if(error)return toast(error.code=='23505'?'Esa factura ya estaba cargada.':error.message,1);
      toast('Factura guardada.');$('#a_p').onchange()};
    $('#g_g').onclick=async()=>{const imp=+$('#g_i').value;if(!(imp>0))return toast('Poné el importe del pago.',1);
      const{error}=await sb.from('pagos_proveedor').insert({proveedor_id:id,importe:imp,medio:$('#g_m').value,referencia:$('#g_r').value.trim()||null});
      if(error)return toast(error.message,1);toast('Pago de '+$m(imp)+' registrado.');$('#a_p').onchange()};
  };
  if(S.provSel)$('#a_p').onchange();
}
init();
</script>
</body>
</html>
