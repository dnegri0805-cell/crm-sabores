.ecb{display:inline-flex!important;align-items:center;gap:6px;background:#fff!important;border:1px solid #e3e6ee!important;color:#1c2333!important;border-radius:999px!important;padding:5px 12px!important;font-size:13.5px!important;font-weight:500!important;min-height:0!important;white-space:nowrap;box-shadow:none}
.ecb b{font-weight:700;color:var(--tx2)}.ecb i.cl-est{width:9px;height:9px;padding:0;border-radius:50%;background:currentColor!important}.ecb i.cl-est::before{display:none}
.ecb.on{border-color:var(--m)!important;background:#f8eef1!important;color:var(--m)!important}.ecb.on b{color:var(--m)}
html.oscuro .ecb{background:#18202f!important;border-color:#2a3446!important;color:#e6e9f0!important}html.oscuro .ecb.on{background:#3a1d26!important;color:#f0b3c2!important}
/* Tablero de pedidos */
.pvis{display:inline-flex;gap:0;margin-left:auto}.pvis button{display:inline-flex;align-items:center;gap:6px;border-radius:0!important}.pvis button:first-child{border-radius:999px 0 0 999px!important}.pvis button:last-child{border-radius:0 999px 999px 0!important}
#pfil{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kb{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start;position:relative;left:50%;transform:translateX(-50%);width:min(1560px,calc(100vw - 48px))}.kb-col{min-width:0}
.kb-col{background:#f3f4f7;border-radius:14px;padding:10px;min-height:220px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.kb-col.sobre{border-color:var(--m);background:#f8eef1}
.kb-h{display:flex;justify-content:space-between;align-items:center;font-size:14px}.kb-h span{background:#fff;border-radius:999px;padding:0 8px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.kb-s{display:block;color:var(--tx2);font-size:12.5px;margin:2px 0 8px;min-height:16px;font-variant-numeric:tabular-nums}
.kb-l{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.kb-c{min-width:0}
.kb-c{background:#fff;border:1px solid #e6e8ed;border-left:4px solid #b9bfcc;border-radius:10px;padding:9px 10px;cursor:grab;box-shadow:0 1px 2px rgba(20,25,40,.05)}
.kb-c.arr{opacity:.45}.kb-c:hover{box-shadow:0 4px 12px rgba(20,25,40,.1)}
.kb-c>.cli{display:block;font-weight:700;font-size:14px;color:#1c2333;text-decoration:none;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kb-ct{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-top:2px}.kb-ct b{font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kb-c small{color:var(--tx2);font-size:12px}.kb-tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.kb-tg .badge{font-size:11px}
.kb-v{color:var(--tx2);font-size:12.5px;text-align:center;margin:18px 0}
.kb-c.est-pendiente{border-left-color:#d49b00}.kb-c.est-aprobado{border-left-color:#3b6fd8}.kb-c.est-en_preparacion{border-left-color:#7a5af0}.kb-c.est-listo{border-left-color:#0f8f8a}.kb-c.est-en_reparto{border-left-color:#2457c5}.kb-c.est-entregado{border-left-color:#1d7a46}
.kb-ay{margin-top:8px}
html.oscuro .kb-col{background:#141b28}html.oscuro .kb-col.sobre{background:#3a1d26}html.oscuro .kb-c{background:#18202f;border-color:#273246}html.oscuro .kb-c>.cli{color:#e6e9f0}html.oscuro .kb-h span{background:#232c3c}
/* Botón flotante + */
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#fab[hidden]{display:none}
.fab-b{width:58px;height:58px;border-radius:50%!important;padding:0!important;display:grid!important;place-items:center;background:var(--m)!important;color:#fff!important;border:0!important;box-shadow:0 10px 24px -8px rgba(123,45,62,.65),0 2px 6px rgba(0,0,0,.15);transition:transform .2s}
.fab-b.on{transform:rotate(45deg)}
.fab-m{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.fab-m[hidden]{display:none}
.fab-m button{display:flex;align-items:center;gap:10px;background:none!important;border:0!important;padding:0!important;box-shadow:none;min-height:0!important;animation:fabIn .18s ease both}
.fab-m button span{background:#fff;color:#1c2333;font-weight:600;font-size:14.5px;padding:7px 12px;border-radius:10px;box-shadow:0 4px 14px rgba(20,25,40,.18)}
.fab-m button i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--m);box-shadow:0 4px 14px rgba(20,25,40,.18)}
@keyframes fabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:900px){#fab{bottom:24px;right:24px}}
html.oscuro .fab-m button span,html.oscuro .fab-m button i{background:#18202f;color:#e6e9f0}
.fa-r{display:grid;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}.fa-r button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px}.fa-r button span{display:flex;flex-direction:column}.fa-r small{color:var(--tx2)}
@media print{#fab{display:none!important}}
@media(max-width:899px){#v{padding-bottom:84px}}

/* Cobranza: acción sugerida */
.morc td.macc,table.morc tr td.macc{display:flex!important;flex-wrap:nowrap!important;align-items:flex-start;gap:8px!important;grid-template-columns:none!important}.morc td.macc .msm>summary{width:auto!important}table.morc td.macc .msm .masc button{padding:9px 12px!important;border-radius:8px!important;font-size:14.5px!important}
.morc td.macc .msug{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.morc td.macc .msug button,table.morc td.macc .msug button{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px!important;font-size:15px!important;font-weight:700;border-radius:12px!important}
.morc td.macc .msug small{color:var(--tx2);font-size:12.5px;text-align:center}
.morc td.macc .msug.suave button{font-weight:600}
.morc td.macc .msm{flex:none}.morc td.macc .msm>summary{min-height:44px;display:grid;place-items:center;padding:0 14px!important;border-radius:12px}
.morc td.macc .msm .masc{right:0;left:auto;min-width:230px}.morc td.macc .msm .masc button,.morc td.macc .msm .masc .btn{width:100%;text-align:left;border-radius:8px!important;padding:9px 12px!important;font-size:14.5px!important;display:block;text-decoration:none}
/* Campanita */
@media(max-width:460px){header:has(#hback:not([hidden])) .mjhn{display:none}header .hbt{padding-left:6px;padding-right:6px}}
.hbell{position:relative}.hbell #hb_n{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e0a21c;color:#1c2333;font:700 11px/18px Inter,system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--n,#17213a)}
.hbell #hb_n[hidden]{display:none}
.act{max-width:520px}.act-l{display:flex;flex-direction:column}
.act-i{display:flex!important;align-items:flex-start;gap:12px;text-align:left;background:none!important;border:0!important;border-bottom:1px solid #f0f1f5!important;border-radius:0!important;padding:12px 6px!important;color:#1c2333!important;font-weight:400!important;box-shadow:none;min-height:0!important;width:100%}
.act-i:last-child{border-bottom:0!important}.act-i:hover{background:#f8f9fb!important}
.act-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f3f4f7;color:var(--tx2)}
.act-ped .act-ic{background:#f8eef1;color:var(--m)}.act-ent .act-ic{background:#e7f6ec;color:#1d7a46}.act-pag .act-ic{background:#e7f6ec;color:#1d7a46}.act-rec .act-ic{background:#fde8ea;color:#b4232f}.act-cat .act-ic{background:#e8f0ff;color:#2457c5}
.act-t{flex:1;min-width:0;font-size:14.5px;line-height:1.4;display:flex;flex-direction:column}.act-t small{color:var(--tx2);font-size:12.5px;margin-top:2px}
.act-i.nuevo .act-t::before{content:'';position:absolute;margin:7px 0 0 -10px;width:6px;height:6px;border-radius:50%;background:var(--m)}.act-i.nuevo{position:relative}.act-i.nuevo .act-t{font-weight:500}
html.oscuro .act-i{color:#e6e9f0!important;border-color:#232c3c!important}html.oscuro .act-i:hover{background:#1c2536!important}html.oscuro .act-ic{background:#232c3c}
/* Panel lateral del pedido */
.pdrw-f{position:fixed;inset:0;z-index:70;background:rgba(23,33,58,0);transition:background .2s}.pdrw-f.on{background:rgba(23,33,58,.35)}
.pdrw{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;box-shadow:-12px 0 32px rgba(20,25,40,.18);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.pdrw-f.on .pdrw{transform:none}
.pd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid #eceef3}.pd-h small{color:var(--tx2);font-size:13px}.pd-h h3{margin:2px 0 0;font-size:20px}
.pd-x{width:40px;height:40px;padding:0!important;display:grid!important;place-items:center;border-radius:50%!important;flex:none}
.pd-b{flex:1;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.pd-est{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pd-est .fac{font-size:13px;color:#1d7a46;display:inline-flex;gap:4px;align-items:center}
.pd-tot b{font-size:28px;font-weight:800;letter-spacing:-.015em;font-variant-numeric:tabular-nums}.pd-tot small{display:block;color:var(--tx2);font-size:13px}
.pd-nota{display:flex;flex-direction:column;gap:4px;background:#f8f9fb;border-radius:10px;padding:10px 12px;font-size:14px}.pd-nota span{display:flex;gap:6px;align-items:flex-start}
.pd-items{border:1px solid #eceef3;border-radius:12px;overflow:hidden}
.pd-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f0f1f5}.pd-i:last-child{border-bottom:0}
.pd-i img,.pd-ph{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#f6f7fa;flex:none;border:1px solid #eceef3}
.pd-i>div{flex:1;min-width:0;display:flex;flex-direction:column}.pd-i b{font-size:14px;font-weight:600}.pd-i small{color:var(--tx2);font-size:12.5px}.pd-i>span{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pd-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.pd-acc button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}.pd-acc button:first-child:not(.alt){grid-column:1/-1}
.ped[data-pid]{cursor:pointer}.ped[data-pid]:hover{box-shadow:0 4px 14px rgba(20,25,40,.08)}.kb-c{cursor:pointer}
@media(max-width:640px){.pdrw{top:auto;height:88vh;width:100vw;border-radius:18px 18px 0 0;transform:translateY(100%)}.pdrw-f.on .pdrw{transform:none}}
html.oscuro .pdrw{background:#141b28}html.oscuro .pd-h,html.oscuro .pd-items,html.oscuro .pd-i{border-color:#232c3c}html.oscuro .pd-nota,html.oscuro .pd-i img,html.oscuro .pd-ph{background:#1c2536}

/* Próximo paso */
.prox-l{display:flex;align-items:center;gap:6px;font-size:13px;color:#3c4458;margin-top:5px;min-width:0}.prox-l .ic{flex:none;color:var(--m)}.prox-l span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prox-l b{flex:none;font-weight:600;color:var(--tx2);font-size:12.5px}
.prox-l.hoy b{color:var(--m)}.prox-l.atr b,.prox-l.atr .ic{color:#b4232f}
.rc-info .prox-l{margin-top:2px}
.box.prox{display:flex;align-items:center;gap:12px;padding:12px 14px!important;border-left:4px solid var(--m)}.box.prox.atr{border-left-color:#b4232f;background:#fff7f7}.box.prox.hoy{background:#fbf3f5}
.prox-i{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f8eef1;color:var(--m)}.prox.atr .prox-i{background:#fde8ea;color:#b4232f}
.prox-t{flex:1;min-width:0;display:flex;flex-direction:column}.prox-t small{color:var(--tx2);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.prox.atr .prox-t small{color:#b4232f}.prox-t b{font-size:15.5px}
.prox-a{display:flex;gap:6px;flex:none}.prox-a button{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:6px 12px}
.prox-n{width:100%;display:flex!important;align-items:center;justify-content:center;gap:8px;min-height:46px;border-style:dashed!important;margin-bottom:12px}
.px-m{max-width:520px}.px-ideas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.px-ideas .chip{padding:5px 11px;font-size:13px;border-radius:999px}
.px-lab{display:block;font-size:14px;font-weight:600;margin-bottom:6px}.px-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.px-f button{border-radius:999px;padding:7px 13px;font-size:14px}.px-f input{max-width:170px}
#px_g{width:100%;min-height:48px}
@media(max-width:640px){.box.prox{flex-wrap:wrap}.prox-a{width:100%;justify-content:flex-end}.prox-a button:first-child{flex:1;justify-content:center}}
html.oscuro .prox-l{color:#c3c9d6}html.oscuro .box.prox.atr{background:#2a1418}html.oscuro .box.prox.hoy{background:#2a1a20}html.oscuro .prox-i{background:#3a1d26}
/* Ranking de vendedores */
.rank{padding:14px 16px!important}.rank .mv-top small{color:var(--tx2);font-size:12.5px}
.rk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0f1f5}.rk:last-child{border-bottom:0;padding-bottom:0}
.rk-p{flex:none;width:28px;text-align:center;font-size:18px;font-weight:800;color:var(--tx2);line-height:1.4}
.rk-c{flex:1;min-width:0}.rk-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.rk-t b{font-size:15px}.rk-t b small{font-weight:400;color:var(--tx2)}.rk-t span{font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums}
.rk-bar{height:7px;border-radius:999px;background:#eef0f4;margin:6px 0 5px;overflow:hidden}.rk-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9c3a50,#7b2d3e)}.rk-bar i.ok{background:#1d7a46}
.rk small{color:var(--tx2);font-size:12.5px}
html.oscuro .rk{border-color:#232c3c}html.oscuro .rk-bar{background:#232c3c}
/* Guía de bienvenida */
#guia{position:fixed;inset:0;z-index:90}
.gu-h{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(15,20,35,.62);transition:all .25s ease;pointer-events:none;outline:3px solid #e9c46a;outline-offset:2px}
.gu-c{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.3);animation:fabIn .2s ease both}
.gu-c small{color:var(--m);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.gu-c b{display:block;font-size:19px;margin:4px 0 6px}.gu-c p{margin:0 0 14px;color:#3c4458;font-size:15px;line-height:1.45}
.gu-a{display:flex;justify-content:flex-end;gap:8px}.gu-a button{min-height:42px;padding:6px 16px}
html.oscuro .gu-c{background:#18202f}html.oscuro .gu-c p{color:#c3c9d6}

/* Vendido en el mes: barritas por día */
.mv-g{display:flex;align-items:flex-end;gap:2px;height:40px;margin-top:12px}.mv-g i{flex:1;min-width:0;background:#e3c7cf;border-radius:3px 3px 1px 1px}.mv-g i.hoy{background:var(--m)}.mv-g i.fut{background:#eef0f4;height:2px!important}.mv-g i.dom{opacity:.35}
.mv-cmp{font-weight:700}.mv-cmp.sube{color:#1d7a46}.mv-cmp.baja{color:#b4232f}
html.oscuro .mv-g i{background:#5a2c3a}html.oscuro .mv-g i.hoy{background:#c0566f}html.oscuro .mv-g i.fut{background:#232c3c}
/* Compras por mes (ficha) */
.fc2 .fc-gr{grid-column:1/-1}.gr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.gr-h h3{margin:0}
.gr-t{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}.gr-t.sube{background:#e7f6ec;color:#1d7a46}.gr-t.baja{background:#fde8ea;color:#b4232f}.gr-t.igual{background:#f3f4f7;color:#5b6274}
.gr{display:flex;align-items:flex-end;gap:10px;height:150px;margin:14px 0 6px}
.gr-c{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.gr-c i{width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#9c3a50,#7b2d3e)}.gr-c.cur i{background:repeating-linear-gradient(135deg,#d8aab6 0 6px,#e8c6cf 6px 12px)}
.gr-c small{font-size:11.5px;color:#3c4458;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.gr-c span{font-size:12.5px;color:var(--tx2);text-transform:capitalize}
.gr-p{margin:6px 0 0;font-size:14px}.gr-p small{color:var(--tx2)}
html.oscuro .gr-c small{color:#c3c9d6}html.oscuro .gr-t.sube{background:#12301f;color:#7fd3a0}html.oscuro .gr-t.baja{background:#3d1519;color:#f19aa2}html.oscuro .gr-t.igual{background:#232c3c;color:#a3abbd}
/* Pantallas vacías */
.vacio{padding:30px 16px!important;gap:10px!important}
.vac-ic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#fbf3f5,#f3e3e8);color:var(--m)}
.vac-ic .ic{color:var(--m)!important;stroke-width:1.6!important}
.vacio p{max-width:340px;font-size:15px!important;line-height:1.45;color:#3c4458!important}
.vac-b{margin-top:4px;border-radius:999px!important;padding:8px 18px!important}
.vacio.chico{padding:14px 8px!important;flex-direction:row!important;text-align:left!important;gap:12px!important;justify-content:flex-start}.vacio.chico .vac-ic{width:42px;height:42px;flex:none}.vacio.chico p{font-size:14px!important;flex:1}.vacio.chico .vac-b{margin:0;flex:none}
@media(max-width:640px){.vacio.chico{flex-wrap:wrap}.vacio.chico .vac-b{margin-left:54px}}
html.oscuro .vac-ic{background:radial-gradient(circle at 30% 30%,#3a1d26,#2a141b)}html.oscuro .vacio p{color:#c3c9d6!important}
/* Esqueletos de carga: filas con círculo y dos líneas */
.skl{position:relative;overflow:hidden;min-height:150px!important;border-radius:12px;background:
  radial-gradient(circle at 20px 25px,#e9ebf0 17px,transparent 18px) 0 0/100% 50px repeat-y,
  linear-gradient(180deg,transparent 15px,#e9ebf0 15px,#e9ebf0 25px,transparent 25px) 52px 0/55% 50px repeat-y,
  linear-gradient(180deg,transparent 31px,#eef0f4 31px,#eef0f4 39px,transparent 39px) 52px 0/32% 50px repeat-y!important;animation:none!important}
.skl::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:220% 100%;animation:skl 1.3s ease-in-out infinite}
small>.skl,td>.skl,p>small>.skl{min-height:14px!important;height:14px;background:#e9ebf0!important;border-radius:6px}
html.oscuro .skl{background:radial-gradient(circle at 20px 25px,#232c3c 17px,transparent 18px) 0 0/100% 50px repeat-y,linear-gradient(180deg,transparent 15px,#232c3c 15px,#232c3c 25px,transparent 25px) 52px 0/55% 50px repeat-y,linear-gradient(180deg,transparent 31px,#1c2536 31px,#1c2536 39px,transparent 39px) 52px 0/32% 50px repeat-y!important}
html.oscuro .skl::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:220% 100%}
html.oscuro small>.skl,html.oscuro td>.skl{background:#232c3c!important}

/* Catálogo con fotos (pedido) */
#p_prod .ptools{grid-template-columns:repeat(4,minmax(0,1fr))!important}#p_prod .ptools button{flex-direction:column!important;gap:3px!important;font-size:13px!important;min-height:52px!important}
.cfm{padding:0!important;align-items:stretch!important}.cfm .mc.cf{max-width:980px;width:100%;margin:0 auto;min-height:100%;border-radius:0;padding:0;display:flex;flex-direction:column}
