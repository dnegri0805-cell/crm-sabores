.kp .box.ok .num{color:var(--ok)}

header{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px 6px}

<body>
<div id="app"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ggfqdkgqtpnkvxoykoty.supabase.co','sb_publishable_kfvkZgS8FewPabohJrKf9Q_UDyEcQiR');
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $m=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?new Date(d+(String(d).length==10?'T12:00':'')).toLocaleDateString('es-AR'):'—';
const ESTADOS=['pendiente','aprobado','en_preparacion','listo','en_reparto','entregado','cancelado'];
let S={perfil:null,tab:'inicio',clientes:[],productos:[],items:[],sub:'ordenes',prov:[],oc:[]};
function toast(t,er){const e=$('#t');e.textContent=t;e.style.background=er?'var(--er)':'var(--ok)';e.style.display='block';setTimeout(()=>e.style.display='none',er?6000:3000)}
async function out(){await sb.auth.signOut();loginView()}

function loginView(){
  app.innerHTML=`<div class="box login"><h1>Sabores de mi País</h1><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña"><button id="go">Ingresar</button><p id="le" class="err"></p></div>`;
  const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#le').textContent=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':'Error de conexión: '+error.message+(error.status?' ('+error.status+')':'');else init()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function init(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
  const{data:p,error:pe}=await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(pe){app.innerHTML='<div class="box login"><p class="err">No se pudo leer tu perfil: '+esc(pe.message)+'</p><button onclick="out()">Salir</button></div>';return}
  if(!p||!p.activo){app.innerHTML='<div class="box login"><p>Tu usuario todavía no está activado. Pedile al dueño que lo active.</p><button onclick="out()">Salir</button></div>';return}
  S.perfil=p;
  const[c,pr]=await Promise.all([
    todo(()=>sb.from('clientes').select('*').eq('activo',true).order('razon_social').order('id')),
    todo(()=>sb.from('precios_productos').select(PROD_COLS).order('descripcion').order('producto_id'))]);
  if(c.error||pr.error){app.innerHTML='<div class="box login"><p class="err">No se pudieron cargar los datos: '+esc((c.error||pr.error).message)+'</p><button onclick="out()">Salir</button></div>';return}
  S.clientes=c.data;S.productos=pr.data;await Promise.all([cargarStock(),cargarPromos()]);shell();
}
function shell(){
  app.innerHTML=`<header><b>Sabores de mi País</b><nav>${['inicio','pedidos','reparto','clientes','cobranza','caja','compras','stock','precios','reportes'].filter(t=>!['precios','caja'].includes(t)||S.perfil.rol=='dueno').map(t=>`<a data-t="${t}" class="${S.tab==t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</nav><span>${esc(S.perfil.nombre)} (${S.perfil.rol})<a onclick="out()">Salir</a></span></header><main id="v"></main>`;
  $$('nav a').forEach(a=>a.onclick=()=>{S.tab=a.dataset.t;shell()});
  ({inicio:vInicio,pedidos:vPedidos,reparto:vReparto,caja:vCaja,clientes:vClientes,cobranza:vCobranza,compras:vCompras,stock:vStock,precios:vPrecios,reportes:vReportes})[S.tab]();
}

/* Supabase devuelve como máximo 1000 filas por pedido: esto trae todas, de a tandas */
async function todo(armar){let out=[],i=0;for(;;){const{data,error}=await armar().range(i,i+999);if(error)return{data:out,error};out=out.concat(data);if(data.length<1000)return{data:out,error:null};i+=1000}}
const PROD_COLS='producto_id,codigo,ean,descripcion,familia,marca,costo,precio_mayorista,precio_minorista,precio_especial';

/* Stock: físico, reservado, disponible y mínimo por producto */
S.stock={};S.stockOk=false;S.min={};
async function cargarStock(){
  const[st,mi]=await Promise.all([todo(()=>sb.from('stock').select('producto_id,fisico,reservado,disponible').order('producto_id')),
    todo(()=>sb.from('productos').select('*').order('id'))]);
  S.stockOk=!st.error;S.stock={};S.inv=false;
  for(const r of st.data||[]){S.stock[r.producto_id]={f:+r.fisico||0,r:+r.reservado||0,d:r.disponible!=null?+r.disponible:(+r.fisico||0)-(+r.reservado||0)};if(+r.fisico)S.inv=true}
  S.min={};S.bultoOk=(mi.data||[]).some(r=>'unidades_bulto' in r);for(const r of mi.data||[])S.min[r.id]={m:+r.stock_minimo||0,a:r.activo!==false,pv:r.proveedor_id,b:Math.max(1,+r.unidades_bulto||1),tb:r.tipo_bulto||'Caja'};
}
const stk=id=>S.stock[id]||{f:0,r:0,d:0};
const nf=n=>Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
function chipStock(id,pide){if(!S.stockOk||!S.inv)return '';const d=stk(id).d,m=S.min[id]?.m||0;
  const c=d<=0||(pide&&pide>d)?'st0':(m&&d<=m?'stb':'stok');
  return `<span class="stk ${c}" title="Disponible en depósito">Disp. ${nf(d)}</span>`}

/* Búsqueda sin importar tildes ni mayúsculas; todas las palabras tienen que aparecer */
const norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const coincide=(texto,q)=>{const t=norm(texto);return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w))};
const txtProd=p=>p.descripcion+' '+p.codigo+' '+(p.marca||'')+' '+(p.familia||'');

/* ---------- Promociones ---------- */
S.promos=[];
async function cargarPromos(){const{data,error}=await sb.from('promociones').select('*').eq('activa',true);S.promos=error?[]:data}
function promoPara(id,lista,q){const p=S.productos.find(x=>x.producto_id==id),m=S.min[id]||{},hoy=diaLocal(new Date());if(!p)return null;let best=null;
  for(const r of S.promos){if(!r.activa||hoy<r.desde||(r.hasta&&hoy>r.hasta))continue;
    if(r.listas&&r.listas.length&&!r.listas.includes(lista))continue;
    const av=String(r.alcance_valor||'').toUpperCase();
    if(r.alcance=='marca'&&String(p.marca||'').toUpperCase()!==av)continue;if(r.alcance=='familia'&&String(p.familia||'').toUpperCase()!==av)continue;if(r.alcance=='producto'&&String(id)!==String(r.alcance_valor))continue;
    if(r.minimo_tipo=='unidades'&&q<r.minimo_unidades)continue;if(r.minimo_tipo=='bulto'&&!(m.b>1&&q>=m.b))continue;
    if(!best||+r.descuento_pct>+best.descuento_pct)best=r}
  return best}
const condPromo=r=>r.minimo_tipo=='bulto'?'llevando el bulto cerrado':r.minimo_tipo=='unidades'?'desde '+r.minimo_unidades+' u.':'';
function promoCerca(id,lista){const hoy=diaLocal(new Date()),p=S.productos.find(x=>x.producto_id==id);if(!p)return null;
  return S.promos.filter(r=>r.activa&&hoy>=r.desde&&(!r.hasta||hoy<=r.hasta)&&(!r.listas?.length||r.listas.includes(lista))&&
    (r.alcance=='todos'||(r.alcance=='marca'&&String(p.marca||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='familia'&&String(p.familia||'').toUpperCase()==String(r.alcance_valor).toUpperCase())||(r.alcance=='producto'&&String(id)==String(r.alcance_valor)))&&
    (r.minimo_tipo!='bulto'||(S.min[id]?.b>1))).sort((a,b)=>b.descuento_pct-a.descuento_pct)[0]||null}
const chipPromo=r=>r?`<span class="promo">−${nf(r.descuento_pct)} % ${esc(condPromo(r)||r.nombre)}</span>`:'';

/* ---------- Bultos (caja / pack) ---------- */
const bul=id=>{const x=S.min[id];return x&&x.b>1?{n:x.b,t:x.tb||'Caja'}:null};
const plural=(t,n)=>{t=String(t||'Caja').toLowerCase();return n==1?t:(t.endsWith('s')?t:t+'s')};
function enBultos(id,q){const b=bul(id);q=Number(q)||0;if(!b||q<b.n)return '';const c=Math.floor(q/b.n),r=q-c*b.n;return c+' '+plural(b.t,c)+(r?' + '+nf(r)+' u.':'')}
const cantTxt=(id,q)=>{const e=enBultos(id,q);return nf(q)+(e?' ('+e+')':'')};
const chipBulto=id=>{const b=bul(id);return b?`<span class="bulto">${esc(b.t)} × ${b.n}</span>`:''};

/* ---------- Escáner de códigos de barras con la cámara ---------- */
const solo=x=>String(x??'').replace(/\D/g,'').replace(/^0+/,'');
function prodPorCodigo(code){const c=String(code).trim(),n=solo(c);
  return S.productos.find(p=>(n&&solo(p.ean)===n)||String(p.codigo).trim().toUpperCase()===c.toUpperCase())}
const btnScan=id=>`<button type="button" class="alt scan" id="${id}" title="Escanear código de barras" aria-label="Escanear código de barras"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`;
function cargarScript(src){return new Promise((ok,mal)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=mal;document.head.appendChild(e)})}
let audioCtx=null;function bip(bien){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=bien?1200:300;g.gain.value=.08;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(bien?.08:.25))}catch(e){}if(navigator.vibrate)navigator.vibrate(bien?60:[80,60,80])}
async function escanear(titulo,alLeer){
  const m=document.createElement('div');m.className='modal scanm';
  m.innerHTML=`<div class="mc"><div class="bh"><h3>${esc(titulo)}</h3><button id="sc_x">Listo</button></div>
    <div class="cam"><video id="sc_v" playsinline muted autoplay></video><div class="mira"></div></div>
    <p id="sc_e" class="sc-est">Apuntá la cámara al código de barras…</p>
    <form id="sc_f" class="sc-man"><input id="sc_i" inputmode="numeric" placeholder="O escribí el código" autocomplete="off"><button class="alt">Buscar</button></form></div>`;
  document.body.appendChild(m);
  let stream=null,reader=null,timer=null,fin=false,ultimo='',tUlt=0;
  const est=(t,cls)=>{const e=$('#sc_e');e.textContent=t;e.className='sc-est '+(cls||'')};
  const cerrar=()=>{fin=true;clearInterval(timer);try{reader&&reader.reset()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());m.remove()};
  $('#sc_x').onclick=cerrar;
  const leer=code=>{const now=Date.now();if(code===ultimo&&now-tUlt<1500)return;ultimo=code;tUlt=now;
    const p=prodPorCodigo(code);if(!p){bip(false);est('No encontré el código '+code+'. Revisá que el producto tenga el EAN cargado.','mal');return}
    bip(true);est(alLeer(p,code)||('✔ '+p.descripcion),'bien')};
  $('#sc_f').onsubmit=e=>{e.preventDefault();const v=$('#sc_i').value.trim();if(v){ultimo='';leer(v);$('#sc_i').value=''}};
  const v=$('#sc_v');
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('sin cámara');
    if('BarcodeDetector' in window){
      const fm=await BarcodeDetector.getSupportedFormats();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f=>fm.includes(f))});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      if(fin){stream.getTracks().forEach(t=>t.stop());return}
      v.srcObject=stream;await v.play();
      let ocupado=false;timer=setInterval(async()=>{if(ocupado||fin||v.readyState<2)return;ocupado=true;try{const r=await det.detect(v);if(r[0])leer(r[0].rawValue)}catch(e){}ocupado=false},180);
    }else{
      est('Preparando la cámara…');
      await cargarScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
      if(fin)return;
      reader=new ZXing.BrowserMultiFormatReader();
      await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,(r)=>{if(r&&!fin)leer(r.getText())});
      stream=v.srcObject;est('Apuntá la cámara al código de barras…');
    }
  }catch(e){est('No se pudo abrir la cámara. Dale permiso al navegador para usarla, o escribí el código abajo.','mal');$('#sc_i').focus()}
}

/* Buscador de productos reutilizable */
function buscador(inp,res,onPick,extra){
  $(inp).oninput=()=>{const q=$(inp).value.toLowerCase().trim();if(q.length<2){$(res).innerHTML='';return}
    const r=S.productos.filter(p=>coincide(txtProd(p),q)).slice(0,15);
    $(res).innerHTML=r.map(p=>`<div class="r" data-id="${p.producto_id}">${esc(p.descripcion)} ${p.marca?`<span class="marca">${esc(p.marca)}</span>`:''} <small>${esc(p.codigo)}</small> ${extra?extra(p):''}</div>`).join('')||'<small>Sin resultados.</small>';
    $$(res+' .r').forEach(d=>d.onclick=()=>{$(inp).value='';$(res).innerHTML='';onPick(S.productos.find(x=>x.producto_id==d.dataset.id))})};
}

const diaLocal=d=>{const x=new Date(String(d).length==10?d+'T12:00':d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};

    let h=0,nh=0,m=0;for(const f of fv.data){const d=fechaDe(f);if(!d)continue;const k=diaLocal(d);const t=Number(f.total||0);if(k==hoy){h+=t;nh++}if(k.slice(0,7)==mes)m+=t}
    kp('k1',$m(h),nh+(nh==1?' factura':' facturas')+' · en el mes '+$m(m))}
  // 2 pedidos pendientes
  if(pe.error){fallo('k2',pe.error);$('#t1').innerHTML='<p class="err">'+esc(pe.error.message)+'</p>'}else{
    const P=pe.data,tot=P.reduce((a,o)=>a+Number(o.total||0),0);

  // 3 deuda clientes

    const F=fe.data,tot=F.reduce((a,x)=>a+Number(x.pendiente||0),0),V=F.filter(x=>x.dias_mora>0),tv=V.reduce((a,x)=>a+Number(x.pendiente||0),0);
    kp('k3',$m(tot),V.length?'Vencido: '+$m(tv)+' en '+V.length+(V.length==1?' factura':' facturas'):'Nada vencido',V.length?'alerta':'');
    V.sort((a,b)=>b.dias_mora-a.dias_mora);
    $('#t2').innerHTML=V.length?'<table><tr><th>Cliente</th><th>Factura</th><th>Mora</th><th class="n">Debe</th></tr>'+V.slice(0,8).map(x=>`<tr><td>${cli(x.cliente_id)}</td><td>${x.tipo} ${x.numero}</td><td class="mora">${x.dias_mora} días</td><td class="n">${$m(x.pendiente)}</td></tr>`).join('')+'</table>'+(V.length>8?`<small>Y ${V.length-8} más.</small>`:'')+'<p><button class="alt" id="irC">Ir a Cobranza</button></p>':'<p><small>Ningún cliente tiene facturas vencidas.</small></p>';
    $('#irC')&&($('#irC').onclick=()=>{S.tab='cobranza';shell()})}
  // 4 proveedores
  if(sp.error)fallo('k4',sp.error);else{
    const D=sp.data.filter(x=>Number(x.saldo)>0.005),tot=D.reduce((a,x)=>a+Number(x.saldo),0);
    kp('k4',$m(tot),D.length?D.length+(D.length==1?' proveedor':' proveedores'):'Sin deudas')}
  if(fp.error)$('#t3').innerHTML='<p class="err">'+esc(fp.error.message)+'</p>';else{
    const sal=id=>Number(sp.data?.find(x=>x.proveedor_id==id)?.saldo||0);

    $('#t3').innerHTML=L.length?'<table><tr><th>Proveedor</th><th>Factura</th><th>Vence</th><th class="n">Total</th></tr>'+L.slice(0,8).map(f=>`<tr><td>${esc(f.proveedores?.razon_social)}</td><td>${f.tipo} ${esc(f.numero)}</td><td class="${f.vencimiento<hoy?'mora':''}">${fd(f.vencimiento)}</td><td class="n">${$m(f.total)}</td></tr>`).join('')+'</table><p><button class="alt" id="irV">Ir a Compras</button></p>':'<p><small>No hay facturas de proveedores por vencer esta semana.</small></p>';
    $('#irV')&&($('#irV').onclick=()=>{S.tab='compras';S.sub='cuenta';shell()})}
  // 5 stock bajo
  await cargarStock();
  if(!S.stockOk){kp('k5','—','No se pudo leer el stock');$('#t4').innerHTML='<p class="err">No se pudo leer el stock. Corré stock.sql en Supabase.</p>'}else{
    if(!S.inv){kp('k5','—','Inventario sin cargar');$('#t4').innerHTML='<p><small>Todavía no cargaste el inventario. Cuando hagas el conteo, cargalo en la pestaña Stock y acá vas a ver qué reponer.</small></p><p><button class="alt" id="irS">Ir a Stock</button></p>';$('#irS').onclick=()=>{S.tab='stock';shell()};return}
    const B=bajos();
    kp('k5',String(B.length),B.length?(B.filter(x=>x.d<=0).length+' sin stock'):'Todo sobre el mínimo',B.length?'alerta':'ok');
    $('#t4').innerHTML=B.length?'<table><tr><th>Producto</th><th class="n">Disp.</th><th class="n">Mín.</th></tr>'+B.slice(0,8).map(x=>`<tr><td>${esc(x.p.descripcion)}</td><td class="n ${x.d<=0?'mora':''}">${nf(x.d)}</td><td class="n">${nf(x.m)}</td></tr>`).join('')+'</table>'+(B.length>8?`<small>Y ${B.length-8} más.</small>`:'')+'<p><button class="alt" id="irS">Ir a Stock</button></p>':'<p><small>Ningún producto está por debajo de su mínimo.</small></p>';
    $('#irS')&&($('#irS').onclick=()=>{S.tab='stock';S.soloBajo=true;shell()})}

/* Productos activos con mínimo cargado y disponible en o por debajo del mínimo */
function bajos(){return S.productos.map(p=>({p,d:stk(p.producto_id).d,m:S.min[p.producto_id]?.m||0,a:S.min[p.producto_id]?.a!==false}))
  .filter(x=>x.a&&x.m>0&&x.d<=x.m).sort((a,b)=>(a.d-a.m)-(b.d-b.m))}

/* ---------- Stock ---------- */
async function vStock(){
  $('#v').innerHTML=`<h2>Stock</h2>
  <div class="box"><div class="g"><div class="conscan"><input id="s_q" placeholder="Buscar producto por nombre o código" autocomplete="off">${btnScan('s_sc')}</div>
    <label class="chk"><input type="checkbox" id="s_b" ${S.soloBajo?'checked':''}> Solo bajo el mínimo</label></div>
    <p><small>Escribí en <b>Contado</b> lo que hay en el depósito y, si querés, el <b>Mínimo</b> para que te avise cuándo reponer. Después tocá <b>Guardar cambios</b>. La diferencia de stock queda registrada como ajuste.</small></p>
    <div class="tw"><table id="s_t"></table></div>
    <div class="g" style="margin-top:10px"><input id="s_mot" placeholder="Motivo (opcional, ej.: inventario inicial)"></div>
    <button id="s_g">Guardar cambios</button> <span id="s_n"></span></div>
  <details class="box" id="s_imp"><summary><b>Cargar muchos productos de una vez (pegar desde Excel)</b></summary>
    <p><small>Armá en Excel o Google Sheets una planilla con estas columnas, en este orden y sin títulos: <b>Código</b> · <b>Cantidad contada</b> · <b>Mínimo</b> (opcional). Seleccioná las filas, copialas y pegalas acá.</small></p>
    <pre class="ej">SDMP-00594	24	6
SDMP-01279	10	2
SDMP-01281	36</pre>
    <textarea id="s_pg" rows="8" placeholder="Pegá acá las filas copiadas de la planilla"></textarea>
    <button class="alt" id="s_rev">Revisar</button> <div id="s_res"></div></details>`;
  await cargarStock();
  if(!S.stockOk){$('#s_t').innerHTML='<tr><td class="err">No se pudo leer el stock. Corré stock.sql en Supabase.</td></tr>';return}
  const cont={},mins={};
  const upd=()=>{const n=new Set([...Object.keys(cont),...Object.keys(mins)]).size;$('#s_n').textContent=n?n+(n==1?' producto con cambios':' productos con cambios'):''};
  const draw=()=>{const q=$('#s_q').value.toLowerCase().trim(),sb_=$('#s_b').checked;
    let L=S.productos.filter(p=>S.min[p.producto_id]?.a!==false);
    if(q)L=L.filter(p=>coincide(txtProd(p),q));
    if(sb_){const ids=new Set(bajos().map(x=>x.p.producto_id));L=L.filter(p=>ids.has(p.producto_id))}
    const V=L.slice(0,200);
    $('#s_t').innerHTML='<tr><th>Producto</th><th class="n">Físico</th><th class="n">Reservado</th><th class="n">Disponible</th><th class="n">Mínimo</th><th class="n">Contado</th></tr>'+
      V.map(p=>{const id=p.producto_id,s=stk(id),m=S.min[id]?.m||0;
        return `<tr><td>${esc(p.descripcion)} <small>${esc(p.codigo)}</small></td><td class="n">${nf(s.f)}</td><td class="n">${nf(s.r)}</td><td class="n ${S.inv&&s.d<=0?'mora':(m&&s.d<=m?'bajo':'')}">${nf(s.d)}</td>
        <td class="n"><input type="number" min="0" step="1" class="mn" data-id="${id}" value="${mins[id]??''}" placeholder="${m?nf(m):'—'}"></td>
        <td class="n"><input type="number" min="0" step="1" class="cnt" data-id="${id}" value="${cont[id]??''}" placeholder="${nf(s.f)}"></td></tr>`}).join('')+
      (L.length>V.length?`<tr><td colspan="6"><small>Se muestran 200 de ${L.length}. Buscá para encontrar el resto.</small></td></tr>`:'')+
      (L.length?'':'<tr><td colspan="6"><small>No hay productos para mostrar.</small></td></tr>');
    $$('.cnt').forEach(e=>e.oninput=()=>{e.value===''?delete cont[e.dataset.id]:cont[e.dataset.id]=e.value;upd()});
    $$('.mn').forEach(e=>e.oninput=()=>{e.value===''?delete mins[e.dataset.id]:mins[e.dataset.id]=e.value;upd()})};
  $('#s_q').oninput=draw;$('#s_b').onchange=()=>{S.soloBajo=$('#s_b').checked;draw()};draw();
  $('#s_sc').onclick=()=>escanear('Contar con el escáner: cada lectura suma 1',p=>{const id=p.producto_id;cont[id]=(+cont[id]||0)+1;

  $('#s_g').onclick=async()=>{if(!Object.keys(cont).length&&!Object.keys(mins).length)return toast('Escribí al menos un Contado o un Mínimo.',1);
    if([...Object.values(cont),...Object.values(mins)].some(v=>!(+v>=0)))return toast('Las cantidades no pueden ser negativas.',1);

  let plan=null;

    const ok=[],mal=[];

      const num=x=>x===undefined||x===''?null:Number(String(x).replace(/\./g,'').replace(',','.'));
      const q=num(c[1]),m=num(c[2]);
      if(!p)mal.push(l+' → no encontré ese código');else if(q===null&&m===null||[q,m].some(v=>v!==null&&!(v>=0)))mal.push(l+' → cantidad no válida');else ok.push({p,q,m})}
    plan=ok;
    $('#s_res').innerHTML=(ok.length?`<p><b>${ok.length}</b> ${ok.length==1?'producto listo':'productos listos'} para cargar.</p>`:'<p>No hay filas válidas.</p>')+
      (mal.length?`<p class="err">${mal.length} ${mal.length==1?'fila no se va a cargar':'filas no se van a cargar'}:</p><ul class="err">${mal.slice(0,10).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${mal.length>10?'<small>Y '+(mal.length-10)+' más.</small>':''}`:'')+
      (ok.length?`<button id="s_ap">Cargar ${ok.length} ${ok.length==1?'producto':'productos'}</button>`:'');
    $('#s_ap')&&($('#s_ap').onclick=async()=>{$('#s_ap').disabled=true;$('#s_ap').textContent='Cargando…';
      const C={},M={};for(const x of plan){if(x.q!==null)C[x.p.producto_id]=x.q;if(x.m!==null)M[x.p.producto_id]=x.m}
      const{ok,err}=await guardar(C,M,$('#s_mot').value.trim()||'Carga desde planilla');
      await cargarStock();draw();
      if(err){$('#s_res').innerHTML='<p class="err">Se cargaron '+ok+' datos y después falló: '+esc(err.message)+'</p>';return}
      $('#s_pg').value='';$('#s_res').innerHTML='<p class="ok">Listo: '+plan.length+' productos cargados.</p>';toast('Planilla cargada.')})};
}

}

/* ---------- Caja diaria y gastos ---------- */
const CAT_GASTO=['Combustible','Sueldos','Alquiler','Servicios (luz, gas, internet)','Impuestos','Mantenimiento vehículo','Comisiones','Bancarios','Otros'];
const MEDIOS=['efectivo','transferencia','cheque','tarjeta','debito_automatico','otro'];
const MED_TXT={efectivo:'Efectivo',transferencia:'Transferencia',cheque:'Cheque',echeq:'eCheq',tarjeta:'Tarjeta',debito_automatico:'Débito automático',otro:'Otro'};
async function vCaja(){
  S.cjD=S.cjD||diaLocal(new Date());
  const d=S.cjD,dd=new Date(d+'T12:00'),mi=d.slice(0,7)+'-01',mf=diaLocal(new Date(dd.getFullYear(),dd.getMonth()+1,1));
  const titulo=dd.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  $('#v').innerHTML=`<div class="bh"><h2 style="margin:0">Caja · ${titulo}</h2><div class="fc-acc"><button class="alt" id="cj_a" aria-label="Día anterior">←</button><input type="date" id="cj_d" value="${d}" style="width:auto;margin:0"><button class="alt" id="cj_s" aria-label="Día siguiente">→</button><button class="alt" id="cj_h">Hoy</button></div></div>
  <div id="cj">Cargando…</div>`;
  const ir=x=>{S.cjD=x;vCaja()},mov=n=>{const t=new Date(d+'T12:00');t.setDate(t.getDate()+n);ir(diaLocal(t))};
  $('#cj_a').onclick=()=>mov(-1);$('#cj_s').onclick=()=>mov(1);$('#cj_h').onclick=()=>ir(diaLocal(new Date()));$('#cj_d').onchange=e=>e.target.value&&ir(e.target.value);
  const ini=new Date(mi+'T00:00').toISOString(),fin=new Date(mf+'T00:00').toISOString();
  const[re,pp,ga,ci,ul,pe,co]=await Promise.all([
    todo(()=>sb.from('recibos').select('*').eq('anulado',false).gte('fecha',ini).lt('fecha',fin).order('fecha')),
    todo(()=>sb.from('pagos_proveedor').select('*,proveedores(razon_social)').gte('fecha',mi).lt('fecha',mf).order('fecha')),
    todo(()=>sb.from('gastos').select('*').gte('fecha',mi).lt('fecha',mf).order('fecha')),
    sb.from('cierres_caja').select('*').eq('fecha',d).maybeSingle(),
    sb.from('cierres_caja').select('fecha,efectivo_contado').lt('fecha',d).order('fecha',{ascending:false}).limit(1),
    todo(()=>sb.from('pedidos').select('*,pedido_items(producto_id,cantidad)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('productos').select('id,costo').order('id'))]);
  if(ga.error){$('#cj').innerHTML='<p class="err">No se pudo leer la caja: '+esc(ga.error.message)+'. Corré caja.sql en Supabase.</p>';return}
  const delDia=(x,k)=>diaLocal(x[k])===d;
  const R=(re.data||[]).filter(x=>delDia(x,'fecha')),P=(pp.data||[]).filter(x=>x.fecha===d),G=(ga.data||[]).filter(x=>x.fecha===d);
  const sum=(A,k='importe')=>A.reduce((a,x)=>a+Number(x[k]||0),0),porMedio=A=>{const o={};for(const x of A)o[x.medio]=(o[x.medio]||0)+Number(x.importe);return o};
  const cob=porMedio(R),ef=x=>x.medio==='efectivo';
  const inicial=ci.data?Number(ci.data.efectivo_inicial):Number(ul.data?.[0]?.efectivo_contado||0);
  const esperado=inicial+sum(R.filter(ef))-sum(P.filter(ef))-sum(G.filter(ef));
  // movimientos del día
  const cli=id=>S.clientes.find(c=>c.id==id)?.razon_social||'Cliente';
  const M=[...R.map(x=>({h:x.fecha,t:'Cobro',d:'Recibo N° '+x.numero+' · '+cli(x.cliente_id),m:x.medio,v:+x.importe})),
    ...P.map(x=>({h:x.created_at||x.fecha,t:'Pago',d:(x.proveedores?.razon_social||'Proveedor')+(x.referencia?' · '+x.referencia:''),m:x.medio,v:-x.importe})),
    ...G.map(x=>({h:x.creado_en||x.fecha,t:'Gasto',d:x.categoria+(x.descripcion?' · '+x.descripcion:''),m:x.medio,v:-x.importe,id:x.id}))].sort((a,b)=>String(a.h).localeCompare(String(b.h)));
  // mes
  const ventas=(pe.data||[]).filter(o=>{const f=fechaDe(o);return f&&diaLocal(f)>=mi&&diaLocal(f)<mf});
  const costo={};for(const r of co.data||[])costo[r.id]=Number(r.costo)||0;
  const vMes=sum(ventas,'total');let cmv=0,sinC=false;for(const o of ventas)for(const i of o.pedido_items||[]){const c=costo[i.producto_id];if(c>0)cmv+=c*Number(i.cantidad||0);else sinC=true}
  const gMes=sum(ga.data||[]),netoMes=vMes-cmv-gMes;
  const gCat={};for(const x of ga.data||[])gCat[x.categoria]=(gCat[x.categoria]||0)+Number(x.importe);
  const gC=Object.entries(gCat).sort((a,b)=>b[1]-a[1]),gMax=Math.max(1,...gC.map(x=>x[1]));
  const nomMes=dd.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  $('#cj').innerHTML=`<div class="kp">
    <div class="box ok"><span class="lab">Cobrado</span><span class="num">${$m(sum(R))}</span><span class="det">${Object.entries(cob).map(([k,v])=>(MED_TXT[k]||k)+' '+$m(v)).join(' · ')||'Sin cobros'}</span></div>
    <div class="box"><span class="lab">Pagado a proveedores</span><span class="num">${$m(sum(P))}</span><span class="det">${P.length} ${P.length==1?'pago':'pagos'}</span></div>
    <div class="box"><span class="lab">Gastos</span><span class="num">${$m(sum(G))}</span><span class="det">${G.length} ${G.length==1?'gasto':'gastos'}</span></div>
    <div class="box"><span class="lab">Efectivo en caja</span><span class="num">${$m(esperado)}</span><span class="det">Debería haber (inicial ${$m(inicial)})</span></div></div>
  <div class="dos fc2">
    <div class="box"><h3>Movimientos del día</h3>${M.length?`<table>${M.map(x=>`<tr><td><span class="badge ${x.v>0?'b-entregado':'b-mora30'}">${x.t}</span></td><td>${esc(x.d)}<br><small>${MED_TXT[x.m]||esc(x.m)}</small></td><td class="n ${x.v<0?'mora':''}">${x.v<0?'−':''}${$m(Math.abs(x.v))}</td><td>${x.id?`<a class="lnk" data-gb="${x.id}">Borrar</a>`:''}</td></tr>`).join('')}</table>`:'<p><small>No hay movimientos este día.</small></p>'}</div>
    <div class="box"><h3>Cargar gasto</h3><div class="g">
      <label class="f">Categoría<select id="g_c">${CAT_GASTO.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="f">Importe<input id="g_i" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="f">Medio de pago<select id="g_m">${MEDIOS.map(m=>`<option value="${m}">${MED_TXT[m]}</option>`).join('')}</select></label>
      <label class="f">Detalle (opcional)<input id="g_d" placeholder="Ej.: nafta camioneta"></label></div>
      <button id="g_g">Guardar gasto</button></div>
    <div class="box"><h3>Cierre de caja</h3>${ci.data?`<p>Cerrada: debería haber <b>${$m(ci.data.efectivo_esperado)}</b>, se contaron <b>${$m(ci.data.efectivo_contado)}</b>.</p>
      <p class="${Math.abs(ci.data.diferencia)<0.005?'':'mora'}"><b>${Math.abs(ci.data.diferencia)<0.005?'La caja cerró justa.':(ci.data.diferencia>0?'Sobran ':'Faltan ')+$m(Math.abs(ci.data.diferencia))}</b></p>${ci.data.nota?'<p><small>'+esc(ci.data.nota)+'</small></p>':''}<button class="alt" id="cc_re">Volver a cerrar</button>`:''}
      <div id="cc_f" ${ci.data?'hidden':''}><p><small>Contá el efectivo al final del día y escribilo. El CRM lo compara con lo que debería haber.</small></p><div class="g">
      <label class="f">Efectivo al empezar el día<input id="cc_i" type="number" step="0.01" min="0" value="${inicial.toFixed(2)}"></label>
      <label class="f">Efectivo contado<input id="cc_c" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="f">Nota (opcional)<input id="cc_n"></label></div><p id="cc_dif"></p><button id="cc_g">Cerrar caja</button></div></div>
    <div class="box"><h3>Ganancia de ${nomMes}</h3><table>
      <tr><td>Ventas</td><td class="n">${$m(vMes)}</td></tr>
      <tr><td>Costo de la mercadería vendida${sinC?' <small>(hay productos sin costo)</small>':''}</td><td class="n">− ${$m(cmv)}</td></tr>
      <tr><td>Gastos del negocio</td><td class="n">− ${$m(gMes)}</td></tr>
      <tr class="tot"><td><b>Ganancia neta</b></td><td class="n ${netoMes<0?'mora':''}"><b>${netoMes<0?'− '+$m(-netoMes):$m(netoMes)}</b></td></tr></table>
      ${gC.length?`<h3 style="margin-top:14px">Gastos por categoría</h3>${gC.map(([k,v])=>`<div class="gbar"><span>${esc(k)}</span><b>${$m(v)}</b><i style="width:${(v/gMax*100).toFixed(1)}%"></i></div>`).join('')}`:''}
      <p><small>Ventas = pedidos aprobados en adelante. El costo usa el costo actual de cada producto.</small></p></div></div>`;
  $('#g_g').onclick=async()=>{const imp=+$('#g_i').value;if(!(imp>0))return toast('Poné el importe del gasto.',1);
    $('#g_g').disabled=true;const{error}=await sb.from('gastos').insert({fecha:d,categoria:$('#g_c').value,descripcion:$('#g_d').value.trim()||null,importe:imp,medio:$('#g_m').value});
    if(error){$('#g_g').disabled=false;return toast(error.message,1)}toast('Gasto de '+$m(imp)+' guardado.');vCaja()};
  $$('#cj [data-gb]').forEach(a=>a.onclick=async()=>{if(!confirm('¿Borrar este gasto?'))return;const{error}=await sb.from('gastos').delete().eq('id',a.dataset.gb);error?toast(error.message,1):(toast('Gasto borrado.'),vCaja())});
  const esp=()=>esperado-inicial+(+$('#cc_i').value||0);
  const dif=()=>{const c=$('#cc_c').value;if(c===''){$('#cc_dif').innerHTML='';return}const x=+c-esp();$('#cc_dif').innerHTML=`Debería haber <b>${$m(esp())}</b> · ${Math.abs(x)<0.005?'<b>Cierra justo.</b>':`<b class="mora">${x>0?'Sobran':'Faltan'} ${$m(Math.abs(x))}</b>`}`};
  $('#cc_c').oninput=dif;$('#cc_i').oninput=dif;
  $('#cc_re')&&($('#cc_re').onclick=()=>{$('#cc_f').hidden=false;$('#cc_re').hidden=true});
  $('#cc_g').onclick=async()=>{const c=$('#cc_c').value;if(c===''||+c<0)return toast('Escribí el efectivo que contaste.',1);
    const{error}=await sb.from('cierres_caja').upsert({fecha:d,efectivo_inicial:+$('#cc_i').value||0,efectivo_esperado:+esp().toFixed(2),efectivo_contado:+c,nota:$('#cc_n').value.trim()||null});
    if(error)return toast(error.message,1);toast('Caja cerrada.');vCaja()};
}

/* ---------- Administrar promociones (en Precios) ---------- */
async function vPromos(){

  const estado=r=>!r.activa?['Apagada','b-cancelado']:hoy<r.desde?['Empieza '+fd(r.desde),'b-pendiente']:r.hasta&&hoy>r.hasta?['Terminó','b-cancelado']:['Vigente','b-entregado'];

      <label class="f" id="pm_vw" hidden>Cuál<select id="pm_vm"></select><input id="pm_vp" placeholder="Buscá el producto" hidden autocomplete="off"></label>

      <label class="f" id="pm_uw" hidden>Desde cuántas unidades<input id="pm_u" type="number" min="1" step="1" value="12"></label>
      <label class="f">Desde<input id="pm_d" type="date" value="${hoy}"></label>

      <div id="pm_r"></div>
      <div class="chk-row">Listas: ${['mayorista','minorista','especial'].map(l=>`<label class="chk"><input type="checkbox" class="pm_l" value="${l}" checked> ${l}</label>`).join('')}</div>
      <p id="pm_prev"><small></small></p>
      <button id="pm_g">Guardar promoción</button> <button class="alt" id="pm_x">Cancelar</button></div>
    ${data.length?`<div class="tw"><table><tr><th>Promoción</th><th>Aplica a</th><th>Condición</th><th>Vigencia</th><th>Estado</th><th></th></tr>${data.map(r=>{const[e,c]=estado(r);return `<tr>
      <td><b>${esc(r.nombre)}</b><br><span class="promo">−${nf(r.descuento_pct)} %</span></td><td>${esc(alc(r))}${r.listas?.length&&r.listas.length<3?'<br><small>Listas: '+r.listas.join(', ')+'</small>':''}</td>
      <td><small>${condPromo(r)||'Siempre'}</small></td><td><small>${fd(r.desde)}${r.hasta?' al '+fd(r.hasta):' · sin fin'}</small></td>
      <td><span class="badge ${c}">${e}</span></td><td style="white-space:nowrap"><button class="alt" data-pt="${r.id}">${r.activa?'Apagar':'Prender'}</button> <a class="lnk" data-pb="${r.id}">Borrar</a></td></tr>`}).join('')}</table></div>`
    :'<p><small>Todavía no cargaste promociones. Por ejemplo: 5 % de descuento llevando el pack cerrado de Maní JL.</small></p>'}`;
  let prodSel=null;

    $('#pm_uw').hidden=$('#pm_c').value!='unidades';prev()};
  const prev=()=>{const a=$('#pm_a').value,v=a=='producto'?prodSel?.producto_id:$('#pm_vm').value;
    const L=S.productos.filter(p=>a=='todos'||(a=='marca'&&p.marca==v)||(a=='familia'&&p.familia==v)||(a=='producto'&&p.producto_id==v));

    $('#pm_prev small').textContent=L.length?`Alcanza a ${conB} ${conB==1?'producto':'productos'}${$('#pm_c').value=='bulto'&&conB<L.length?' (los que tienen bulto cargado)':''}.`:''};
  $('#pm_n').onclick=()=>{$('#pm_f').hidden=false;$('#pm_n').hidden=true;vis()};$('#pm_x').onclick=()=>vPromos();

  $('#pm_g').onclick=async()=>{const n=$('#pm_nom').value.trim(),pct=+$('#pm_pct').value,a=$('#pm_a').value,c=$('#pm_c').value;
    if(!n)return toast('Ponele un nombre a la promoción.',1);if(!(pct>0&&pct<90))return toast('El descuento tiene que estar entre 0,5 y 89 %.',1);
    const av=a=='todos'?null:a=='producto'?prodSel?.producto_id:$('#pm_vm').value;if(a!='todos'&&!av)return toast('Elegí a qué se aplica.',1);
    const ls=[...$$('.pm_l')].filter(x=>x.checked).map(x=>x.value);if(!ls.length)return toast('Marcá al menos una lista.',1);
    const{error}=await sb.from('promociones').insert({nombre:n,descuento_pct:pct,alcance:a,alcance_valor:av,minimo_tipo:c,minimo_unidades:c=='unidades'?Math.max(1,+$('#pm_u').value||1):0,
      listas:ls.length==3?null:ls,desde:$('#pm_d').value||hoy,hasta:$('#pm_h').value||null,activa:true});
    if(error)return toast(error.message,1);await cargarPromos();toast('Promoción guardada.');vPromos()};
  $$('#pm [data-pt]').forEach(b=>b.onclick=async()=>{const r=data.find(x=>x.id==b.dataset.pt);const{error}=await sb.from('promociones').update({activa:!r.activa}).eq('id',r.id);
    if(error)return toast(error.message,1);await cargarPromos();toast(r.activa?'Promoción apagada.':'Promoción prendida.');vPromos()});
  $$('#pm [data-pb]').forEach(a=>a.onclick=async()=>{if(!confirm('¿Borrar esta promoción?'))return;const{error}=await sb.from('promociones').delete().eq('id',a.dataset.pb);
    if(error)return toast(error.message,1);await cargarPromos();vPromos()});
}

/* ---------- Reportes de ventas ---------- */
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PERIODOS=[['mes','Este mes'],['mesant','Mes anterior'],['3m','Últimos 3 meses'],['anio','Este año'],['12m','Últimos 12 meses']];
function rango(k){const h=new Date(),y=h.getFullYear(),m=h.getMonth(),f=(a,b)=>diaLocal(new Date(a,b,1));
  if(k=='mes')return[f(y,m),f(y,m+1)];if(k=='mesant')return[f(y,m-1),f(y,m)];if(k=='3m')return[f(y,m-2),f(y,m+1)];
  if(k=='anio')return[f(y,0),f(y+1,0)];return[f(y,m-11),f(y,m+1)]}
function aTabla(head,rows){return [head,...rows].map(r=>r.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n')}
async function copiarTabla(head,rows){const t=aTabla(head,rows);
  try{await navigator.clipboard.writeText(t);toast('Tabla copiada: pegala en Excel con Ctrl+V.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Tabla copiada: pegala en Excel con Ctrl+V.')}}
async function vReportes(){
  S.rp=S.rp||'mes';
  $('#v').innerHTML=`<h2>Reportes de ventas</h2>
  <div class="sub" id="rp_p">${PERIODOS.map(([k,t])=>`<button class="${S.rp==k?'':'alt'}" data-rp="${k}">${t}</button>`).join('')}</div>
  <p><small>Cuenta los pedidos aprobados en adelante (no incluye los que esperan aprobación ni los cancelados).</small></p>
  <div class="kp">
    <div class="box" id="r1"><span class="lab">Ventas</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r2"><span class="lab">Pedidos</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r3"><span class="lab">Ticket promedio</span><span class="num">…</span><span class="det"></span></div>
    <div class="box" id="r4"><span class="lab">Margen bruto</span><span class="num">…</span><span class="det"></span></div>
  </div>
  <div class="box"><h3>Ventas por mes · últimos 12 meses</h3><div id="rp_g" class="graf">Cargando…</div></div>
  <div class="dos fc2">
    <div class="box"><div class="bh"><h3>Mejores clientes</h3><button class="alt" id="cp_c">Copiar para Excel</button></div><div id="rp_c"></div></div>
    <div class="box"><div class="bh"><h3>Productos más vendidos</h3><button class="alt" id="cp_p">Copiar para Excel</button></div><div id="rp_pr"></div></div>
  </div>`;
  $$('[data-rp]').forEach(b=>b.onclick=()=>{S.rp=b.dataset.rp;$$('[data-rp]').forEach(x=>x.className=x.dataset.rp==S.rp?'':'alt');pintar()});
  const[pe,co]=await Promise.all([
    todo(()=>sb.from('pedidos').select('id,numero,total,estado,cliente_id,fecha,creado_en,created_at,clientes(razon_social),pedido_items(producto_id,cantidad,precio_unitario)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('productos').select('id,costo').order('id'))]);
  let P=pe.data;
  if(pe.error){const r2=await todo(()=>sb.from('pedidos').select('*,clientes(razon_social),pedido_items(producto_id,cantidad,precio_unitario)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false}));
    if(r2.error){$('#rp_g').innerHTML='<p class="err">No se pudieron leer los pedidos: '+esc(r2.error.message)+'</p>';return}P=r2.data}
  const costo={};for(const r of co.data||[])costo[r.id]=Number(r.costo)||0;
  for(const o of P)o._d=fechaDe(o)?diaLocal(fechaDe(o)):'';
  const nombre=id=>S.productos.find(p=>p.producto_id==id)?.descripcion||'Producto';
  let TC=[],TP=[];
  const pintar=()=>{
    const[a,b]=rango(S.rp),L=P.filter(o=>o._d>=a&&o._d<b);
    const v=L.reduce((x,o)=>x+Number(o.total||0),0);
    let vi=0,ci=0,sinC=0;
    const pc={},cc={};
    for(const o of L){const k=o.cliente_id;cc[k]=cc[k]||{n:o.clientes?.razon_social||'Cliente',p:0,v:0};cc[k].p++;cc[k].v+=Number(o.total||0);
      for(const it of o.pedido_items||[]){const q=Number(it.cantidad)||0,pu=Number(it.precio_unitario)||0,cu=costo[it.producto_id]||0;
        vi+=q*pu;if(cu>0)ci+=q*cu;else sinC+=q*pu;
        const x=pc[it.producto_id]=pc[it.producto_id]||{q:0,v:0,c:0,sc:false};x.q+=q;x.v+=q*pu;if(cu>0)x.c+=q*cu;else x.sc=true}}
    const conC=vi-sinC,mg=conC>0?(conC-ci)/conC:null;
    $('#r1 .num').textContent=$m(v);$('#r1 .det').textContent=PERIODOS.find(x=>x[0]==S.rp)[1];
    $('#r2 .num').textContent=String(L.length);$('#r2 .det').textContent=Object.keys(cc).length+(Object.keys(cc).length==1?' cliente':' clientes');
    $('#r3 .num').textContent=L.length?$m(v/L.length):'—';$('#r3 .det').textContent='por pedido';
    $('#r4 .num').textContent=mg==null?'—':(mg*100).toLocaleString('es-AR',{maximumFractionDigits:1})+' %';
    $('#r4 .det').textContent=mg==null?'Faltan costos cargados':('Ganancia '+$m(conC-ci)+(sinC>0?' · hay productos sin costo':''));
    // clientes
    TC=Object.values(cc).sort((x,y)=>y.v-x.v);
    $('#rp_c').innerHTML=TC.length?'<table><tr><th>Cliente</th><th class="n">Pedidos</th><th class="n">Ventas</th><th class="n">%</th></tr>'+TC.slice(0,10).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.p}</td><td class="n">${$m(x.v)}</td><td class="n">${v?Math.round(x.v/v*100):0} %</td></tr>`).join('')+'</table>'+(TC.length>10?`<small>Y ${TC.length-10} clientes más (se copian todos).</small>`:''):'<p><small>No hay ventas en este período.</small></p>';
    // productos
    TP=Object.entries(pc).map(([id,x])=>({n:nombre(id),...x})).sort((x,y)=>y.v-x.v);
    $('#rp_pr').innerHTML=TP.length?'<table><tr><th>Producto</th><th class="n">Unid.</th><th class="n">Ventas</th><th class="n">Margen</th></tr>'+TP.slice(0,10).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${nf(x.q)}</td><td class="n">${$m(x.v)}</td><td class="n">${x.sc||!x.v?'—':Math.round((x.v-x.c)/x.v*100)+' %'}</td></tr>`).join('')+'</table>'+(TP.length>10?`<small>Y ${TP.length-10} productos más (se copian todos).</small>`:''):'<p><small>No hay ventas en este período.</small></p>';
    grafico(a,b)};
  const grafico=(a,b)=>{const h=new Date(),M=[];
    for(let i=11;i>=0;i--){const d=new Date(h.getFullYear(),h.getMonth()-i,1),k=diaLocal(d).slice(0,7);M.push({k,l:MESES[d.getMonth()]+(d.getMonth()==0||i==11?' '+String(d.getFullYear()).slice(2):''),v:0})}
    for(const o of P){const m=M.find(x=>x.k==o._d.slice(0,7));if(m)m.v+=Number(o.total||0)}
    const max=Math.max(...M.map(x=>x.v)),W=Math.max(340,Math.min(720,$('#rp_g').clientWidth||720)),H=W<500?200:230,pl=W<500?60:64,pb=28,pt=12,cw=(W-pl-8)/12,bw=Math.min(36,cw*0.6);
    if(cw<40)M.forEach(m=>m.l=m.l.split(' ')[0]);
    const paso=(()=>{if(!max)return 1;const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r)})();
    const top=max?Math.ceil(max/paso)*paso:4,y=v=>pt+(H-pt-pb)*(1-v/top);
    const corto=v=>v>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':v>=1e3?Math.round(v/1e3)+' mil':String(Math.round(v));
    let g='';for(let t=0;t<=top+1e-9;t+=paso)g+=`<line x1="${pl}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${pl-8}" y="${y(t)+4}" class="ax" text-anchor="end">$ ${corto(t)}</text>`;
    const enP=k=>k+'-01'>=a.slice(0,7)+'-01'&&k+'-01'<b;
    const bars=M.map((m,i)=>{const cx=pl+cw*i+cw/2,yy=y(m.v),hh=Math.max(0,H-pb-yy),r=Math.min(4,hh/2);
      const path=hh>0?`M${cx-bw/2},${H-pb}V${yy+r}Q${cx-bw/2},${yy} ${cx-bw/2+r},${yy}H${cx+bw/2-r}Q${cx+bw/2},${yy} ${cx+bw/2},${yy+r}V${H-pb}Z`:'';
      return `<g class="bar${enP(m.k)?' on':''}" data-i="${i}"><rect x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" class="hit"/>${path?`<path d="${path}"/>`:''}<text x="${cx}" y="${H-8}" class="ax" text-anchor="middle">${m.l}</text></g>`}).join('');
    $('#rp_g').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes de los últimos 12 meses">${g}<line x1="${pl}" x2="${W-8}" y1="${H-pb}" y2="${H-pb}" class="base"/>${bars}</svg><div class="tip" hidden></div>
      <details><summary><small>Ver como tabla</small></summary><table>${M.map(m=>`<tr><td>${m.l}</td><td class="n">${$m(m.v)}</td></tr>`).join('')}</table></details>`;
    const tip=$('#rp_g .tip');
    $$('#rp_g .bar').forEach(el=>{el.onmouseenter=el.onclick=()=>{const m=M[el.dataset.i];tip.hidden=false;tip.innerHTML=`<b>${m.l}</b><br>${$m(m.v)}`;
      const r=el.getBoundingClientRect(),pr=$('#rp_g').getBoundingClientRect();tip.style.left=(r.left-pr.left+r.width/2)+'px';tip.style.top=Math.max(0,(el.querySelector('path')?.getBoundingClientRect().top||r.top)-pr.top-46)+'px'};
      el.onmouseleave=()=>tip.hidden=true})};
  $('#cp_c').onclick=()=>copiarTabla(['Cliente','Pedidos','Ventas','% del total'],TC.map(x=>{const t=TC.reduce((a,y)=>a+y.v,0);return[x.n,x.p,x.v.toFixed(2).replace('.',','),(t?x.v/t*100:0).toFixed(1).replace('.',',')]}));
  $('#cp_p').onclick=()=>copiarTabla(['Producto','Unidades','Ventas','Margen %'],TP.map(x=>[x.n,x.q,x.v.toFixed(2).replace('.',','),x.sc||!x.v?'':((x.v-x.c)/x.v*100).toFixed(1).replace('.',',')]));
  pintar();
}

async function facturarPedido(o){
  const c=S.clientes.find(x=>x.id==o.cliente_id);if(!c){toast('No encuentro el cliente de este pedido.',1);return null}

async function itemsPedido(o){

function telWA(t){let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9'))d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length==12)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,'$1$2');return d.length>=10?'549'+d:''}
async function enviarWA(o){
  const w=window.open('','_blank');
  const it=await itemsPedido(o);if(!it){w&&w.close();return}
  const c=S.clientes.find(x=>x.id==o.cliente_id)||{};

  const txt=`*Sabores de mi País*\nPedido N° ${o.numero} · ${c.razon_social||''}\n\n`+it.map(i=>`• ${i.qt} x ${i.d} — ${$m(i.st)}${i.pr?' _('+i.pr+')_':''}`).join('\n')+`\n\n*Total: ${$m(o.total||tot)}*\n\n¡Gracias por tu compra!`;
  const tel=telWA(c.telefono),url='https://wa.me/'+tel+'?text='+encodeURIComponent(txt);
  if(w)w.location.href=url;else location.href=url;
  if(!tel)toast('Este cliente no tiene teléfono cargado: elegí el contacto en WhatsApp.')
}

async function datosRecibo(x,c){
  const[sa,im]=await Promise.all([sb.from('saldos_clientes').select('saldo').eq('cliente_id',c.id).maybeSingle(),
    x.id!=null?sb.from('recibo_imputaciones').select('*').eq('recibo_id',x.id):Promise.resolve({data:[]})]);
  let fac=[];const I=im.error?[]:(im.data||[]);
  if(I.length){const ids=I.map(i=>i.factura_id).filter(Boolean);const{data:F}=ids.length?await sb.from('facturas_venta').select('id,tipo,numero').in('id',ids):{data:[]};
    fac=I.map(i=>{const f=(F||[]).find(y=>y.id==i.factura_id);return{t:f?'Factura '+f.tipo+' N° '+f.numero:'Factura',imp:Number(i.importe??i.monto??0)}})}
  const aplicado=fac.reduce((a,f)=>a+f.imp,0),cuenta=Math.max(0,Number(x.importe)-aplicado);
  return{saldo:sa.data?Number(sa.data.saldo):null,fac,cuenta:fac.length&&cuenta>0.005?cuenta:0}}

/* Sugerencia de compra */
async function cSugerencia(){
  S.sg=S.sg||{dias:30,cob:15,bul:true,pv:''};const g=S.sg;
  $('#cv').innerHTML=`<div class="box"><p><small>Para cada producto calcula cuánto vendiste, cuánto tenés (disponible + lo que está en camino) y cuánto pedir para cubrir los próximos días, sin bajar del stock mínimo.</small></p>
    <div class="g"><label class="f">Proveedor<select id="sg_pv"><option value="">Todos</option>${S.prov.map(p=>`<option value="${p.id}" ${p.id==g.pv?'selected':''}>${esc(p.razon_social)}</option>`).join('')}</select></label>
      <label class="f">Mirar ventas de los últimos<select id="sg_d">${[15,30,60,90].map(n=>`<option value="${n}" ${n==g.dias?'selected':''}>${n} días</option>`).join('')}</select></label>
      <label class="f">Comprar para cubrir<select id="sg_c">${[7,15,30,45,60].map(n=>`<option value="${n}" ${n==g.cob?'selected':''}>${n} días</option>`).join('')}</select></label></div>
    <label class="chk"><input type="checkbox" id="sg_b" ${g.bul?'checked':''}> Redondear a bultos cerrados (caja / pack)</label></div><div id="sg_l">Calculando…</div>`;
  const re=()=>{g.pv=$('#sg_pv').value;g.dias=+$('#sg_d').value;g.cob=+$('#sg_c').value;g.bul=$('#sg_b').checked;calc()};
  ['#sg_pv','#sg_d','#sg_c','#sg_b'].forEach(k=>$(k).onchange=re);
  await cargarStock();
  const[pe,oc,uc]=await Promise.all([
    todo(()=>sb.from('pedidos').select('*,pedido_items(producto_id,cantidad)').not('estado','in','(pendiente,cancelado)').order('numero',{ascending:false})),
    todo(()=>sb.from('ordenes_compra_items').select('producto_id,cantidad,cantidad_recibida,ordenes_compra!inner(estado)').in('ordenes_compra.estado',['borrador','enviada','recibida_parcial'])),
    todo(()=>sb.from('ordenes_compra_items').select('producto_id,costo_unitario,id').order('id',{ascending:false}))]);
  if(pe.error){$('#sg_l').innerHTML='<p class="err">'+esc(pe.error.message)+'</p>';return}
  const camino={};for(const i of oc.data||[])camino[i.producto_id]=(camino[i.producto_id]||0)+Math.max(0,Number(i.cantidad)-Number(i.cantidad_recibida));
  const ultC={};for(const i of uc.data||[])if(ultC[i.producto_id]==null)ultC[i.producto_id]=Number(i.costo_unitario);
  const calc=()=>{
    const desde=new Date();desde.setDate(desde.getDate()-g.dias);const dd=diaLocal(desde);
    const vend={};for(const o of pe.data){const f=fechaDe(o);if(!f||diaLocal(f)<dd)continue;for(const i of o.pedido_items||[])vend[i.producto_id]=(vend[i.producto_id]||0)+Number(i.cantidad||0)}
    const filas=[];
    for(const p of S.productos){const id=p.producto_id,m=S.min[id]||{};if(m.a===false)continue;if(g.pv&&m.pv!=g.pv)continue;
      const v=vend[id]||0,min=m.m||0;if(!v&&!min)continue;
      const prom=v/g.dias,disp=S.inv?stk(id).d:0,cam=camino[id]||0,obj=Math.max(Math.ceil(prom*g.cob),min);
      let sug=Math.max(0,obj-disp-cam);if(sug>0&&g.bul&&m.b>1)sug=Math.ceil(sug/m.b)*m.b;
      if(!sug)continue;
      filas.push({p,id,pv:m.pv||'',v,prom,disp,cam,min,sug,c:ultC[id]??Number(p.costo||0)})}
    S.sgF=filas;
    const grupos={};for(const f of filas)(grupos[f.pv]=grupos[f.pv]||[]).push(f);
    const nomPv=id=>S.prov.find(p=>p.id==id)?.razon_social||'Sin proveedor asignado';
    $('#sg_l').innerHTML=(S.inv?'':'<p class="aviso">Todavía no cargaste el inventario: la sugerencia supone que no tenés stock. Cargalo en la pestaña Stock para que sea exacta.</p>')+
      (filas.length?Object.entries(grupos).sort((a,b)=>nomPv(a[0]).localeCompare(nomPv(b[0]))).map(([pv,F])=>{const tot=F.reduce((a,f)=>a+f.sug*f.c,0);return `<div class="box"><div class="bh"><h3>${esc(nomPv(pv))}</h3>${pv?`<button data-sgo="${pv}">Crear orden de compra · ${$m(tot)}</button>`:''}</div>
        <div class="tw"><table><tr><th>Producto</th><th class="n">Vendido ${g.dias} d.</th><th class="n">Por día</th><th class="n">Disponible</th><th class="n">En camino</th><th class="n">Mínimo</th><th class="n">Pedir</th><th class="n">Costo</th><th class="n">Subtotal</th></tr>
        ${F.sort((a,b)=>b.sug*b.c-a.sug*a.c).map(f=>`<tr><td>${esc(f.p.descripcion)} ${chipBulto(f.id)}</td><td class="n">${nf(f.v)}</td><td class="n">${nf(Math.round(f.prom*10)/10)}</td><td class="n ${f.disp<=0&&S.inv?'mora':''}">${S.inv?nf(f.disp):'—'}</td><td class="n">${f.cam?nf(f.cam):'—'}</td><td class="n">${f.min?nf(f.min):'—'}</td>
          <td class="n"><input type="number" min="0" step="1" class="sgq" data-id="${f.id}" value="${f.sug}"><br><small class="eq">${enBultos(f.id,f.sug)}</small></td><td class="n">${f.c?$m(f.c):'<span class="mora">sin costo</span>'}</td><td class="n" data-st="${f.id}">${$m(f.sug*f.c)}</td></tr>`).join('')}</table></div>
        ${pv?'':'<p><small>Asignales proveedor a estos productos para poder armar la orden.</small></p>'}</div>`}).join('')
      :`<div class="box"><p>No hace falta comprar nada${g.pv?' a este proveedor':''}: con lo que tenés y lo que viene en camino cubrís ${g.cob} días de ventas.</p>${Object.keys(vend).length?'':'<p><small>Todavía no hay ventas aprobadas en ese período para calcular.</small></p>'}</div>`);
    $$('.sgq').forEach(e=>e.onchange=()=>{const f=S.sgF.find(x=>x.id==e.dataset.id);f.sug=Math.max(0,Math.round(+e.value||0));e.nextElementSibling.nextElementSibling.textContent=enBultos(f.id,f.sug);$(`[data-st="${f.id}"]`).textContent=$m(f.sug*f.c)});
    $$('[data-sgo]').forEach(b=>b.onclick=async()=>{const F=S.sgF.filter(f=>f.pv==b.dataset.sgo&&f.sug>0);if(!F.length)return toast('No hay cantidades para pedir.',1);
      if(F.some(f=>!(f.c>0)))return toast('Hay productos sin costo: cargalo en Precios antes de armar la orden.',1);
      b.disabled=true;const{data:o,error}=await sb.from('ordenes_compra').insert({proveedor_id:b.dataset.sgo,observaciones:'Armada con la sugerencia de compra ('+g.cob+' días)'}).select().single();
      if(error){b.disabled=false;return toast(error.message,1)}
      const{error:e2}=await sb.from('ordenes_compra_items').insert(F.map(f=>({orden_id:o.id,producto_id:f.id,cantidad:f.sug,costo_unitario:f.c})));
      if(e2){await sb.from('ordenes_compra').delete().eq('id',o.id);b.disabled=false;return toast('No se pudo armar la orden: '+e2.message,1)}
      toast('Orden de compra N° '+o.id+' creada en borrador. Revisala e imprimila para mandarla.');S.sub='ordenes';vCompras()})};
  calc();
}

/* Órdenes de compra */
async function cOrdenes(){
  S.oc=[];
  $('#cv').innerHTML=`<div class="box"><b>Nueva orden de compra</b><div class="g" style="margin-top:8px">${provSel('o_p')}<input id="o_f" type="date" title="Fecha de entrega esperada"></div>
  <div class="conscan"><input id="o_q" placeholder="Buscar producto por nombre o código">${btnScan('o_sc')}</div><div id="o_r"></div><table id="o_i"></table><p><b id="o_t"></b></p>
  <input id="o_o" placeholder="Observaciones (opcional)"><button id="o_g">Guardar orden</button></div>
  <div id="rx"></div><h3>Órdenes</h3><table id="ol"></table>`;
  const drawI=()=>{let t=0;
    $('#o_i').innerHTML=S.oc.length?'<tr><th>Producto</th><th>Cant.</th><th>Costo unit.</th><th>Subtotal</th><th></th></tr>'+S.oc.map((i,k)=>{const s=i.c*i.q;t+=s;
      return `<tr><td>${esc(i.p.descripcion)}</td><td style="white-space:nowrap"><input type="number" min="1" value="${i.q}" data-k="${k}" class="oq">${bul(i.p.producto_id)?` <button class="alt qb bb" data-ob="${k}">+ ${esc(bul(i.p.producto_id).t)} (${bul(i.p.producto_id).n})</button><br><small class="eq">${enBultos(i.p.producto_id,i.q)?'= '+enBultos(i.p.producto_id,i.q):''}</small>`:''}</td><td><input type="number" min="0" step="0.01" value="${i.c}" data-k="${k}" class="oc" style="width:110px"></td><td>${$m(s)}</td><td><a data-x="${k}">Quitar</a></td></tr>`}).join(''):'';
    $('#o_t').textContent=S.oc.length?'Total: '+$m(t):'';
    $$('.oq').forEach(e=>e.onchange=()=>{S.oc[e.dataset.k].q=Math.max(1,+e.value||1);setTimeout(drawI)});
    $$('.oc').forEach(e=>e.onchange=()=>{S.oc[e.dataset.k].c=Math.max(0,+e.value||0);setTimeout(drawI)});
    $$('#o_i [data-x]').forEach(a=>a.onclick=()=>{S.oc.splice(a.dataset.x,1);drawI()});
    $$('#o_i [data-ob]').forEach(b=>b.onclick=()=>{const i=S.oc[b.dataset.ob];i.q+=bul(i.p.producto_id).n;drawI()})};
  drawI();
  $('#o_sc').onclick=()=>escanear('Escanear productos de la orden',p=>{agregarOC(p);return '✔ '+p.descripcion});
  const agregarOC=async p=>{const it=S.oc.find(i=>i.p.producto_id==p.producto_id);if(it){it.q++;return drawI()}
    const[u,pc]=await Promise.all([
      sb.from('ordenes_compra_items').select('costo_unitario').eq('producto_id',p.producto_id).order('id',{ascending:false}).limit(1),
      sb.from('productos').select('costo').eq('id',p.producto_id).maybeSingle()]);
    const c=Number(u.data?.[0]?.costo_unitario||pc.data?.costo||0);
    S.oc.push({p,q:1,c});drawI();
    if(!c)toast('Este producto no tiene costo cargado: escribilo a mano.',1)};
  buscador('#o_q','#o_r',agregarOC);
  $('#o_g').onclick=async()=>{const pv=$('#o_p').value;
    if(!pv||!S.oc.length)return toast('Elegí un proveedor y agregá productos.',1);
    if(S.oc.some(i=>!(i.c>0)))return toast('Completá el costo unitario de todos los productos.',1);
    const{data:o,error}=await sb.from('ordenes_compra').insert({proveedor_id:pv,fecha_entrega:$('#o_f').value||null,observaciones:$('#o_o').value.trim()||null}).select().single();
    if(error)return toast(error.message,1);
    const{error:e2}=await sb.from('ordenes_compra_items').insert(S.oc.map(i=>({orden_id:o.id,producto_id:i.p.producto_id,cantidad:i.q,costo_unitario:i.c})));
    if(e2){await sb.from('ordenes_compra').delete().eq('id',o.id);return toast('No se pudo guardar la orden: '+e2.message,1)}
    toast('Orden de compra N° '+o.id+' guardada.');cOrdenes()};

  const{data,error}=await sb.from('ordenes_compra').select('*,proveedores(razon_social)').order('id',{ascending:false}).limit(25);
  if(error)return $('#ol').innerHTML='<tr><td class="err">'+esc(error.message)+'</td></tr>';
  $('#ol').innerHTML='<tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Total</th><th>Estado</th><th></th></tr>'+(data.map(o=>{
    const cerrada=o.estado=='recibida'||o.estado=='anulada';
    const est=['borrador','enviada'].includes(o.estado)
      ?`<select data-e="${o.id}">${['borrador','enviada','anulada'].map(e=>`<option value="${e}" ${e==o.estado?'selected':''}>${OC_TXT[e]}</option>`).join('')}</select>`
      :`<span class="tag ${o.estado}">${OC_TXT[o.estado]}</span>`;
    return `<tr><td>${o.id}</td><td>${fd(o.fecha)}</td><td>${esc(o.proveedores?.razon_social)}</td><td>${$m(o.total)}</td><td>${est}</td>
      <td style="white-space:nowrap">${cerrada?'':`<button data-r="${o.id}">Recibir</button> `}<button class="alt" data-pr="${o.id}">Imprimir</button></td></tr>`}).join('')||'<tr><td colspan="6">Todavía no hay órdenes.</td></tr>');
  $$('#ol [data-e]').forEach(s=>s.onchange=async()=>{
    if(s.value=='anulada'&&!confirm('¿Anular la orden N° '+s.dataset.e+'?'))return cOrdenes();
    const{error}=await sb.from('ordenes_compra').update({estado:s.value}).eq('id',s.dataset.e);error?toast(error.message,1):(toast('Estado actualizado.'),cOrdenes())});
  $$('#ol [data-r]').forEach(b=>b.onclick=()=>recibir(data.find(o=>o.id==b.dataset.r)));
  $$('#ol [data-pr]').forEach(b=>b.onclick=()=>imprimirOC(data.find(o=>o.id==b.dataset.pr)));
}

async function recibir(o){
  const{data:it,error}=await sb.from('ordenes_compra_items').select('*').eq('orden_id',o.id).order('id');
  if(error)return toast(error.message,1);
  $('#rx').innerHTML=`<div class="box" style="border-color:var(--m)"><b>Recibir mercadería · OC N° ${o.id} · ${esc(o.proveedores?.razon_social)}</b>
  <table style="margin-top:8px"><tr><th>Producto</th><th>Pedido</th><th>Ya recibido</th><th>Llega ahora</th></tr>${it.map(i=>{const pend=Math.max(0,i.cantidad-i.cantidad_recibida);
    return `<tr><td>${esc(prodNom(i.producto_id))}</td><td>${+i.cantidad}</td><td>${+i.cantidad_recibida}</td><td><input type="number" min="0" step="1" value="${pend}" data-i="${i.id}" data-p="${pend}" class="rq"></td></tr>`}).join('')}</table>
  <div class="g"><input id="r_rm" placeholder="N° de remito del proveedor"></div><button id="r_ok">Confirmar recepción</button> <button class="alt" id="r_no">Cancelar</button></div>`;
  $('#rx').scrollIntoView({behavior:'smooth'});
  $('#r_no').onclick=()=>$('#rx').innerHTML='';
  $('#r_ok').onclick=async()=>{const items=[...$$('.rq')].map(e=>({oc_item_id:+e.dataset.i,cantidad:+e.value||0,pend:+e.dataset.p})).filter(x=>x.cantidad>0);
    if(!items.length)return toast('No cargaste ninguna cantidad.',1);
    if(items.some(x=>x.cantidad>x.pend)&&!confirm('Hay productos que llegan en más cantidad de la pedida. ¿Confirmás igual?'))return;
    const{error}=await sb.rpc('recibir_orden',{p_orden_id:o.id,p_remito:$('#r_rm').value.trim(),p_items:items.map(({oc_item_id,cantidad})=>({oc_item_id,cantidad}))});
    if(error)return toast(error.message,1);
    toast('Mercadería de la OC N° '+o.id+' ingresada al stock.');await cargarStock();cOrdenes()};
}

      <label class="f">Percepciones<input id="f_pe" type="number" step="0.01" min="0" value="0"></label>
    </div><p><small>Total: <b id="f_tot">${$m(0)}</b> · vence a ${pv.dias_pago||0} días</small></p><button id="f_g">Guardar factura</button>
    <h3>Registrar pago</h3><div class="g"><input id="g_i" type="number" step="0.01" min="0" placeholder="Importe"><select id="g_m"><option>transferencia</option><option>efectivo</option><option>cheque</option><option>echeq</option><option>otro</option></select><input id="g_r" placeholder="Referencia (N° transf., cheque…)"></div>
    <button id="g_g">Registrar pago</button>
    <h3>Facturas</h3><table><tr><th>Comprobante</th><th>Fecha</th><th>Vence</th><th>OC</th><th>Total</th></tr>${(f.data||[]).map(x=>`<tr><td>${x.tipo} ${esc(x.numero)}</td><td>${fd(x.fecha)}</td><td>${fd(x.vencimiento)}</td><td>${x.orden_id||'—'}</td><td>${x.tipo=='NC'?'−':''}${$m(x.total)}</td></tr>`).join('')||'<tr><td colspan="5">No hay facturas cargadas.</td></tr>'}</table>
    <h3>Pagos</h3><table>${(g.data||[]).map(x=>`<tr><td>${fd(x.fecha)}</td><td>${x.medio}</td><td>${esc(x.referencia)}</td><td>${$m(x.importe)}</td></tr>`).join('')||'<tr><td>Todavía no hay pagos.</td></tr>'}</table>`;
    const tot=()=>(+$('#f_ne').value||0)+(+$('#f_iv').value||0)+(+$('#f_pe').value||0);
    ['#f_ne','#f_iv','#f_pe'].forEach(k=>$(k).oninput=()=>$('#f_tot').textContent=$m(tot()));
    $('#f_ne').onchange=()=>{if(!$('#f_iv').value&&$('#f_t').value=='A'){$('#f_iv').value=(+$('#f_ne').value*0.21).toFixed(2);$('#f_tot').textContent=$m(tot())}};
    $('#f_g').onclick=async()=>{const n=$('#f_n').value.trim();if(!n||!(tot()>0))return toast('Completá número e importes de la factura.',1);
      const v=new Date($('#f_f').value+'T12:00');v.setDate(v.getDate()+(pv.dias_pago||0));
      const{error}=await sb.from('facturas_proveedor').insert({proveedor_id:id,tipo:$('#f_t').value,numero:n,fecha:$('#f_f').value,vencimiento:v.toISOString().slice(0,10),
        orden_id:+$('#f_o').value||null,neto:+$('#f_ne').value||0,iva:+$('#f_iv').value||0,percepciones:+$('#f_pe').value||0});
      if(error)return toast(error.code=='23505'?'Esa factura ya estaba cargada.':error.message,1);
      toast('Factura guardada.');$('#a_p').onchange()};
    $('#g_g').onclick=async()=>{const imp=+$('#g_i').value;if(!(imp>0))return toast('Poné el importe del pago.',1);
      const{error}=await sb.from('pagos_proveedor').insert({proveedor_id:id,importe:imp,medio:$('#g_m').value,referencia:$('#g_r').value.trim()||null});
      if(error)return toast(error.message,1);toast('Pago de '+$m(imp)+' registrado.');$('#a_p').onchange()};
  };
  if(S.provSel)$('#a_p').onchange();
}
init();
</script>
</body>
</html>
