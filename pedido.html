<title>Hacé tu pedido · Sabores de mi País</title>
<style>
:root{--m:#7b2d3e;--m2:#f6e9ec;--n:#17213a;--g:#f4f2f3;--l:#e2dde0;--t:#1c2333;--mu:#6a7184;--ok:#1d7a46;--er:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--g);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--n);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header b{font-size:18px;display:flex;align-items:center;gap:10px}header b img{height:70px;max-width:220px;object-fit:contain}header small{display:block;color:#cfd4e2;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.busca{position:sticky;top:0;z-index:5;background:var(--g);padding:10px 0 8px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #c9c4c8;border-radius:10px;background:#fff;color:var(--t)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #c98a98;outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--l);background:#fff;color:var(--m);border-radius:18px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--m);color:#fff;border-color:var(--m)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.prim{background:var(--m);color:#fff;padding:13px 18px;font-weight:600}
.sec{background:#fff;color:var(--m);border:1px solid var(--m);padding:11px 16px}
.rep{width:100%;margin:8px 0 4px}
.lista{display:grid;gap:8px;margin-top:6px}
.p{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.p.sel{border-color:var(--m);box-shadow:inset 3px 0 0 var(--m)}
.p .d{min-width:0}.p .d b{display:block;font-weight:500}
.p .d small{color:var(--mu)}
.p .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.marca{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#234a87;background:#dde7f6;border-radius:4px;padding:1px 6px;margin-right:4px}
.q{display:flex;align-items:center;gap:6px;grid-column:1/-1;justify-content:flex-end}
.q button{width:42px;height:42px;background:var(--m2);color:var(--m);font-size:22px;font-weight:600}
.q input{width:64px;text-align:center;padding:9px 4px}
.q .add{width:auto;padding:0 18px;font-size:16px;background:var(--m);color:#fff}
.mas{text-align:center;color:var(--mu);font-size:14px;padding:10px}
.p .d{display:flex;gap:10px;align-items:flex-start}.p .d .tx{min-width:0}
.ft{width:64px;height:64px;flex:none;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--l);cursor:zoom-in}
.ft0{width:64px;height:64px;flex:none;border-radius:10px;background:var(--m2);display:grid;place-items:center;color:var(--m);font-weight:700;font-size:22px}
.vbar{display:flex;gap:8px;align-items:center}.vbar input{flex:1}.vbtn{flex:none;width:46px;height:46px;background:#fff;border:1px solid var(--l);color:var(--m);font-size:20px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;color:var(--t);font-size:12px;width:74px;padding:2px}
.cat i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cat.on i{outline:3px solid var(--m);outline-offset:2px}.cat span{line-height:1.15;text-align:center;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel{width:auto;max-width:100%;padding:8px 10px;font-size:14px;margin-top:6px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}.sec-t h2{margin:0;font-size:19px}.sec-t small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.ofertas{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}@media(min-width:600px){.ofertas{grid-auto-columns:30%}}
.card{position:relative;background:#fff;border:1px solid var(--l);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.sel{border-color:var(--m);box-shadow:0 0 0 1px var(--m)}
.card .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center;cursor:zoom-in}.card .ph img{width:100%;height:100%;object-fit:contain}
.card .ph.ini{font-size:46px;font-weight:800;cursor:default}
.card .rib{position:absolute;top:12px;left:12px;background:var(--er);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card .rib.cerca{background:var(--ok)}
.card .cn{font-size:14px;line-height:1.25;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .cm{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cp{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.card .cp s{font-size:12px;font-weight:400;color:var(--mu);display:block}
.card .cb{font-size:12px;color:var(--mu)}.card .cc{font-size:11px;color:var(--ok);font-weight:600}
.card .cq{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:4px}.card .cq button{height:38px;border-radius:10px}
.card .cq .ag{flex:1;background:var(--m);color:#fff;font-weight:700}.card .cq .bx{flex:none;padding:0 8px;background:var(--m2);color:var(--m);font-weight:700;font-size:13px}
.card .cq .mn,.card .cq .ms{width:38px;flex:none;background:var(--m2);color:var(--m);font-size:20px;font-weight:700}.card .cq input{flex:1;min-width:0;text-align:center;padding:7px 2px;height:38px}
.nuevo{position:absolute;top:12px;right:12px;background:#1f5fa8;color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:8px;z-index:1}
.card .cdet{font-size:11.5px;color:var(--mu);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.escb{background:#fff7e0;border:1px solid #f1d58a;color:#6b4e00;border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-size:14px}
#bpg .pg{max-width:720px;margin:0 auto 6px}.pg{margin:6px 0}.pgt{font-size:13px}.pgt .ok,.okt{color:var(--ok)}.pg.mal .pgt{color:var(--er)}
.pgb{height:6px;background:#eceef3;border-radius:4px;overflow:hidden;margin-top:3px}.pgb i{display:block;height:100%;background:var(--ok);border-radius:4px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:40;display:grid;place-items:center;padding:20px}.zoom img{max-width:100%;max-height:80vh;border-radius:12px;background:#fff}.zoom p{color:#fff;text-align:center;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin:10px 0 0}.tabs button{flex:1;background:rgba(255,255,255,.12);color:#fff;padding:9px 10px;font-size:15px}.tabs button.on{background:#fff;color:var(--n);font-weight:600}
.cta{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}
.cta .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.cta .lab{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.mp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#009ee3;color:#fff;font-weight:700;padding:14px;margin-top:10px;text-decoration:none;border-radius:10px}
.datos{white-space:pre-line;background:var(--g);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.fila{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}.fila:last-child{border-bottom:0}
.fila small{color:var(--mu)}.fila small.venc{color:var(--er);font-weight:600}.fila .n{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.venc{color:var(--er);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(23,33,58,.08)}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .tot{font-variant-numeric:tabular-nums}.bar .tot b{display:block;font-size:19px}
.hoja{position:fixed;inset:0;background:rgba(23,33,58,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja .c{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.hoja h2{margin:0 0 10px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--l)}
.it small{color:var(--mu)}.it .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.it .q{grid-column:1/-1;justify-content:flex-start}.it .q button{width:36px;height:36px;font-size:19px}.it .q input{width:56px;padding:6px 4px}
.it .q .x{width:auto;padding:0 12px;font-size:14px;background:none;color:var(--er)}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin:14px 0}
.acc{display:flex;gap:8px;flex-wrap:wrap}.acc button{flex:1}
.msg{background:#fff;border:1px solid var(--l);border-radius:14px;padding:24px 18px;margin-top:24px;text-align:center}
.msg h2{margin:0 0 8px}.msg .ok{font-size:44px;line-height:1;color:var(--ok)}
.err{color:var(--er)}
.promo{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ok);border-radius:4px;padding:2px 6px;margin-top:3px}
.promo.cerca{background:#e4f3ea;color:var(--ok);white-space:normal;text-align:right;max-width:150px}
.p .pr s{color:var(--mu);font-weight:400;font-size:13px}.p .pr{text-align:right}
.bulto{display:inline-block;font-size:11px;font-weight:600;color:#7a5a00;background:#fff1cc;border-radius:4px;padding:1px 6px;margin-right:4px}
.p .pr small{display:block;font-size:12px;font-weight:500;color:var(--mu);text-align:right}
.q small.eq{color:#7a5a00;font-weight:600;margin-right:auto}
.q .add.sec2{background:#fff;color:var(--m);border:1px solid var(--m)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.hoja .c{animation:sube .18s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.6}}}

/* ===== Estilo góndola (v2) ===== */
:root{--crema:#fbf6ee;--sol:#ffc93c;--sol2:#fff4d1;--rojo:#e0322b;--sombra:0 6px 18px -8px rgba(60,30,20,.28);--fd:'Bricolage Grotesque',system-ui,sans-serif}
body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--crema)}
header{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--m) 70%,#000) 0%,var(--m) 45%,var(--n) 100%);padding-bottom:26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--sol);opacity:.16}
header b{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.01em;position:relative;z-index:1}
header b img{height:64px;background:#fff;border-radius:16px;padding:4px 8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header small{font-size:15px;color:#fff;opacity:.9;margin-top:8px;position:relative;z-index:1}
header>*{max-width:688px;margin-left:auto!important;margin-right:auto!important}
.tabs{position:relative;z-index:1;background:rgba(0,0,0,.22);padding:4px;border-radius:16px;margin-top:14px}
.tabs button{background:none;border-radius:12px;font-weight:600}.tabs button.on{background:#fff;color:var(--m);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.busca{background:var(--crema)}
input,textarea{border:2px solid #ece3d6;border-radius:14px}
.vbar input{border-radius:999px;padding:13px 18px;box-shadow:var(--sombra);border-color:transparent}
.vbtn{border-radius:50%;border:0;box-shadow:var(--sombra)}
.cats{gap:4px;padding:12px 0 4px}
.cat{width:78px;font-weight:600;font-size:12.5px}
.cat i{width:62px;height:62px;overflow:hidden;box-shadow:var(--sombra);font-family:var(--fd);font-size:24px}
.cat i:has(img){background:#fff!important}.cat i img{width:100%;height:100%;object-fit:cover;transform:scale(1.3)}
.cat.on i{outline:3px solid var(--sol);outline-offset:3px}.cat.on span{color:var(--m)}
.rep{border:0;background:var(--sol2);color:#6b4a00;font-weight:700;border-radius:14px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.rep::before{content:"↻";font-size:18px}
.sec-t{margin:26px 2px 12px;align-items:center}
.sec-t h2{font-family:var(--fd);font-weight:800;font-size:25px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sec-t h2::before{content:"";width:7px;height:26px;border-radius:4px;background:var(--fc,var(--m))}
.sec-t small{background:#fff;border-radius:999px;padding:4px 10px;font-weight:600;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ofb{background:linear-gradient(135deg,var(--rojo),#ff7a1a);border-radius:22px;padding:4px 12px 14px;margin:18px -4px 0;box-shadow:0 10px 24px -12px rgba(224,50,43,.7)}
.ofb .sec-t{margin:14px 2px 10px}.ofb .sec-t h2{color:#fff;font-size:27px}.ofb .sec-t h2::before{display:none}.ofb .sec-t small{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.grid{gap:12px}
.card{border:0;border-radius:20px;padding:0 0 10px;gap:3px;box-shadow:var(--sombra);overflow:hidden;transition:transform .15s}
.card>*:not(.ph):not(.rib){margin-left:10px;margin-right:10px}
.card .ph{border-radius:0;background:radial-gradient(circle at 50% 60%,#fff 0%,color-mix(in srgb,var(--fc,#ccc) 22%,#fff) 75%);padding:10px 8px 4px;margin-bottom:6px}
.card .ph img{mix-blend-mode:multiply;transition:transform .2s}
@media(hover:hover){.card:hover{transform:translateY(-3px)}.card:hover .ph img{transform:scale(1.05)}}
.card.sel{box-shadow:0 0 0 3px var(--sol),var(--sombra)}
.card .rib{top:10px;left:10px;background:var(--rojo);font-family:var(--fd);font-size:17px;padding:6px 10px;border-radius:12px 12px 12px 3px;transform:rotate(-6deg);box-shadow:0 4px 10px rgba(224,50,43,.4)}
.card .rib.cerca{background:var(--sol);color:#5a3a00;box-shadow:0 4px 10px rgba(255,180,0,.45)}
.card .cn{font-size:14.5px;font-weight:700;line-height:1.22}
.card .cm{font-size:10.5px;font-weight:700;color:var(--fc,var(--mu));letter-spacing:.06em}
.card .cp{font-family:var(--fd);font-size:25px;letter-spacing:-.02em;color:var(--t);margin-top:4px}
.card .cp s{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--rojo)}
.card .cb{font-size:12px}.card .cc{font-size:11.5px;color:#9a5a00;background:var(--sol2);border-radius:8px;padding:4px 7px;margin-top:3px}
.card .cq{padding-top:8px}.card .cq button{height:42px;border-radius:999px}
.card .cq .ag{background:var(--m);font-size:15px;box-shadow:0 4px 10px -4px var(--m)}.card .cq .ag::before{content:"+ "}
.card .cq .bx{background:var(--sol2);color:#6b4a00;padding:0 11px}
.card .cq .mn,.card .cq .ms{width:42px;background:var(--sol);color:#4a3000}.card .cq input{border-radius:999px;height:42px;font-weight:700;border-color:var(--sol)}
.p{border:0;border-radius:18px;box-shadow:var(--sombra)}.p.sel{box-shadow:inset 4px 0 0 var(--sol),var(--sombra)}
.p .d b{font-weight:700}.p .pr{font-family:var(--fd);font-size:19px}
.ft{border:0;background:radial-gradient(circle,#fff,#f4ece0);border-radius:14px}
.q button{border-radius:999px}.q .add{border-radius:999px}
.bar{border-top:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(60,30,20,.15)}
.bar .tot b{font-family:var(--fd);font-size:23px}
.bar .prim,.prim{border-radius:999px;padding:14px 22px;font-size:16px;box-shadow:0 6px 14px -6px var(--m)}
.sec{border-radius:999px;border-width:2px;font-weight:600}
.cta,.msg{border:0;border-radius:20px;box-shadow:var(--sombra)}.cta .big{font-family:var(--fd)}
.hoja .c{border-radius:24px 24px 0 0}.hoja h2,.msg h2,.total{font-family:var(--fd)}
.mp{border-radius:999px}

/* ===== Banner de portada ===== */
.ban{position:relative;overflow:hidden;border-radius:24px;margin:16px 0 4px;min-height:190px;padding:20px 18px;display:flex;align-items:center;color:#fff;background:var(--bb,#e0322b);box-shadow:0 14px 28px -14px var(--bb,#e0322b)}
.ban::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 40%,rgba(255,255,255,.35) 0 22%,transparent 23%),radial-gradient(circle at 70% 110%,rgba(0,0,0,.18) 0 30%,transparent 31%),linear-gradient(120deg,rgba(0,0,0,.18),transparent 60%)}
.ban .bt{position:relative;z-index:2;width:60%;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ban .bk{background:var(--sol);color:#4a3000;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;transform:rotate(-3deg)}
.ban h3{margin:2px 0 0;font-family:var(--fd);font-weight:800;font-size:clamp(26px,7.5vw,38px);line-height:.98;letter-spacing:-.03em;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.ban p{margin:0;font-size:14px;line-height:1.3;opacity:.95}
.ban button{margin-top:8px;background:#fff;color:var(--bb,#e0322b);font-weight:800;border-radius:999px;padding:10px 18px;font-size:15px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.ban img{position:absolute;z-index:1;right:-10%;top:50%;width:54%;max-height:118%;object-fit:contain;transform:translateY(-50%) rotate(6deg);filter:drop-shadow(0 14px 16px rgba(0,0,0,.35))}
@media(min-width:600px){.ban{min-height:240px;padding:28px 32px}.ban img{width:44%;right:2%}.ban .bt{width:58%}.ban p{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.ban img{animation:flota 5s ease-in-out infinite}@keyframes flota{50%{transform:translateY(-54%) rotate(4deg)}}}
/* ===== Fidelización: agregá también, cupón, puntos, encuesta, presupuesto ===== */
.agt{margin:12px 0 4px}.agt h3{margin:0 0 6px;font-size:15px}.agl{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}

async function fotoChica(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.7))};im.onerror=()=>ok(null);im.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(file)})}

    const fj=h.querySelector('#fjc');if(fj)fj.onchange=()=>{sv();h._fij=fj.checked;h._fd=h._fd||[];draw()};
    h.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{sv();const d=+b.dataset.fd;h._fd=(h._fd||[]).includes(d)?h._fd.filter(x=>x!=d):[...(h._fd||[]),d];draw()});
    h.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{sv();car[b.dataset.ck]=(car[b.dataset.ck]||0)+paso(b.dataset.ck);guardar();toast('¡Sumado!');draw()});
    h.querySelectorAll('[data-cv2]').forEach(b=>b.onclick=()=>{sv();car[b.dataset.cv2]=(car[b.dataset.cv2]||0)+(+b.dataset.n);guardar();toast('¡Listo! Ahora tenés el descuento.');draw()});
    h.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{sv();car[b.dataset.ag]=(car[b.dataset.ag]||0)+1;guardar();toast('Agregado al pedido.');draw()});
    const cx=h.querySelector('#cupx');if(cx)cx.onclick=e=>{e.preventDefault();sv();h._cup=null;draw()};
    const pc=h.querySelector('#ptc');if(pc)pc.onchange=()=>{sv();h._pts=pc.checked;draw()};
    const cb=h.querySelector('#cupb');if(cb){const ap=async()=>{sv();const v=(h._cupv||'').trim().toUpperCase();if(!v)return;cb.disabled=true;
      const{data,error}=await sb.rpc('validar_cupon',{p_token:token||'',p_codigo:v,p_monto:cuentas(h).b1});cb.disabled=false;
      if(error||!data)return toast('No pudimos revisar el cupón. Probá de nuevo.');if(!data.ok)return toast(data.msg);h._cup={codigo:data.codigo,pct:+data.pct};toast('¡Cupón aplicado! −'+nf(data.pct)+' %');draw()};
      cb.onclick=ap;h.querySelector('#cupi').onkeydown=e=>{if(e.key=='Enter')ap()}}
    h.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sv();car[b.dataset.s]+=paso(b.dataset.s);guardar();draw()});
    h.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{sv();const k=b.dataset.r;car[k]>paso(k)?car[k]-=paso(k):delete car[k];guardar();draw()});
    h.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sv();delete car[b.dataset.x];guardar();draw()});
    h.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{sv();const v=sbQ(e.dataset.i,Math.max(0,Math.round(+e.value||0)));v?car[e.dataset.i]=v:delete car[e.dataset.i];guardar();setTimeout(draw)});
    h.querySelector('#seg').onclick=()=>{sv();cerrar()};
    const bajoMin=()=>C?.minimo&&totalFinal()<C.minimo;if(bajoMin()){const b=h.querySelector('#env');b.disabled=true;b.title='No llega al pedido mínimo'}
    if(bloqueado()){const b=h.querySelector('#env');b.disabled=true;b.textContent='Primero regularizá tu cuenta';b.insertAdjacentHTML('beforebegin',morosoHTML())}
    if(PUB)h.querySelector('#env').onclick=async e=>{sv();if(bajoMin())return;const nom=(h._nom||'').trim();if(!nom){toast('Poné tu nombre o el de tu negocio.');$('#pnom').focus();return}
      if(!telLimpio(h._tel)){toast('Poné tu WhatsApp para que te confirmemos el pedido.');$('#ptel').focus();return}
      const b=e.target;b.disabled=true;b.textContent='Enviando…';
      const{data:pw,error:pe}=await sb.rpc('pedido_publico',{p_nombre:nom,p_telefono:h._tel.trim(),p_domicilio:(h._dir||'').trim(),p_items:I.map(([id,q])=>({id,q})),p_nota:h._nota||null,p_ref:REF||null,p_cupon:h._cup?.codigo||null,p_rubro:RUB||C.rubro||null});
      if(!pe){marcarQR(h._tel.trim());car={};guardar();h.remove();$('#bar').hidden=true;
        $('#m').innerHTML=`<div class="msg"><div class="ok">✓</div><h2>¡Recibimos tu pedido!</h2><p>Pedido N° <b>${pw.numero}</b> · ${pw.productos} ${pw.productos==1?'producto':'productos'} · <b>${$m(pw.total)}</b></p><p>Te escribimos por WhatsApp al <b>${esc(h._tel)}</b> para confirmar stock y entrega. ¡Gracias!</p>${telLimpio(C.tel)?`<a class="sec" style="display:block;text-decoration:none;margin:10px 0" target="_blank" rel="noopener" href="https://wa.me/${telLimpio(C.tel)}?text=${encodeURIComponent('¡Hola! Soy '+nom+'. Les acabo de mandar el pedido N° '+pw.numero+' desde el catálogo.')}">Avisar por WhatsApp</a>`:''}<button class="sec" id="otro">Volver al catálogo</button></div>`;
        $('#otro').onclick=()=>{filtro='';pintar()};window.scrollTo(0,0);return}
      if(!/pedido_publico|function|schema/i.test(pe.message)){b.disabled=false;b.textContent='Enviar pedido';toast(pe.message);return}
      const tel=telLimpio(C.tel);if(!tel){b.disabled=false;b.textContent='Enviar pedido';toast('Escribinos por WhatsApp para hacer el pedido.');return}
      const t=`*Pedido desde el catálogo*\n${nom}${h._dir?'\n'+h._dir.trim():''}\n\n`+I.map(([id,q])=>{const p=prod(id);return `• ${nf(q)}${esKgP(id)?' kg':''} x ${p.d}${enB(p,q)?' ('+enB(p,q)+')':''} — ${$m(puP(p,q)*q)}`}).join('\n')+(()=>{const k=cuentas(h);return (k.e||k.cu?`\n\nSubtotal: ${$m(k.t)}`:'')+(k.e?`\nDescuento por monto ${nf(k.e)} %: −${$m(k.t-k.b1)}`:'')+(k.cu?`\nCupón ${h._cup.codigo} ${nf(k.cu)} %: −${$m(k.bn-k.b2)}`:'')+`\n\n*Total: ${$m(k.fin)}*`})()+(h._nota?'\n\nNota: '+h._nota.trim():'')+(C.ref_nombre?`\n\n🤝 Me recomendó: ${C.ref_nombre} (código ${REF})`:'');
      window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(t),'_blank');car={};guardar();h.remove();$('#bar').hidden=true;
      $('#m').innerHTML=`<div class="msg"><div class="ok">✓</div><h2>¡Listo!</h2><p>Se abrió WhatsApp con tu pedido. <b>Tocá enviar</b> en WhatsApp y te respondemos para confirmar.</p><button class="sec" id="otro">Volver al catálogo</button></div>`;
      $('#otro').onclick=()=>{filtro='';pintar()};window.scrollTo(0,0)};
    else h.querySelector('#env').onclick=async e=>{sv();const b=e.target;b.disabled=true;b.textContent='Enviando…';
      const k=cuentas(h),args={p_token:token,p_items:I.map(([id,q])=>({id,q})),p_nota:h._nota||null};if(h._cup)args.p_cupon=h._cup.codigo;if(k.pts)args.p_puntos=true;
      if(h._fij&&!(h._fd||[]).length){b.disabled=false;b.textContent='Enviar pedido';toast('Elegí qué días repetir el pedido.');return}
      const{data,error}=await sb.rpc('crear_pedido_cliente',args);
      if(error){b.disabled=false;b.textContent='Enviar pedido';toast(error.message);return}
      let fijoOk=false;if(h._fij){const{error:fe}=await sb.rpc('fijo_cliente',{p_token:token,p_dias:h._fd,p_items:I.map(([id,q])=>({id,q})),p_activo:true});fijoOk=!fe;if(!fe)C.fijo={dias:h._fd,activo:true}}
      if(h._ent&&data?.numero)sb.rpc('fijar_entrega',{p_token:token,p_numero:data.numero,p_fecha:h._ent}).then(()=>{},()=>{});
      car={};guardar();h.remove();$('#bar').hidden=true;if(+data.puntos)C.puntos=Math.max(0,(+C.puntos||0)-data.puntos);
      $('#m').innerHTML=`<div class="msg"><div class="ok">✓</div><h2>¡Recibimos tu pedido!</h2>${h._ent?`<p>📅 Te lo llevamos el <b>${new Date(h._ent+'T12:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'})}</b></p>`:''}<p>Pedido N° <b>${data.numero}</b> · ${data.productos} ${data.productos==1?'producto':'productos'} · <b>${$m(data.total)}</b></p>${+data.cupon||+data.puntos||+data.descuento?`<p class="okt">Ahorraste con ${[+data.descuento?'descuento por monto':'',+data.cupon?'tu cupón':'',+data.puntos?nf(data.puntos)+' puntos':''].filter(Boolean).join(' + ')} 🎉</p>`:''}${fijoOk?`<p class="okt">🔁 Listo: lo repetimos solo los ${h._fd.sort().map(d=>['lunes','martes','miércoles','jueves','viernes','sábados','domingos'][d-1]).join(' y ')}.</p>`:''}<p>Te avisamos cuando esté confirmado. ¡Gracias por tu compra!</p>${C.mp||C.pago?`<details style="margin:12px 0;text-align:left"><summary>¿Querés pagarlo ya?</summary>${bloquePago(C,data.total)}</details>`:''}<button class="sec" id="otro">Hacer otro pedido</button></div>`;
      $('#otro').onclick=()=>{filtro='';marca='';pintar()};
      $('#m .msg').insertAdjacentHTML('beforeend','<div class="rec"><p>📌 ¿Querés que te recordemos el próximo pedido?</p><div class="recb"><button class="sec" data-rec="7">En 7 días</button><button class="sec" data-rec="15">En 15 días</button><button class="sec" data-rec="30">En 30 días</button></div></div>');
      $$('#m [data-rec]').forEach(b=>b.onclick=async()=>{const{data:rd,error:re}=await sb.rpc('recordarme',{p_token:token,p_dias:+b.dataset.rec});if(re)return toast(/recordarme/.test(re.message)?'Esta opción todavía no está disponible.':re.message);$('#m .rec').innerHTML='<p class="okt">✓ Listo: te escribimos el '+String(rd.fecha).split('-').reverse().join('/')+' con tu pedido de siempre.</p>'});
      window.scrollTo(0,0)}};
  h.onclick=e=>{if(e.target===h){h._nota=$('#nota')?.value;cerrar()}};
  document.body.appendChild(h);draw();
}
iniciar();
</script>
</body>
</html>
