<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7b2d3e">
<title>Hacé tu pedido · Sabores de mi País</title>
<style>
:root{--m:#7b2d3e;--m2:#f6e9ec;--n:#17213a;--g:#f4f2f3;--l:#e2dde0;--t:#1c2333;--mu:#6a7184;--ok:#1d7a46;--er:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--g);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--n);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header b{font-size:18px;display:flex;align-items:center;gap:10px}header b img{height:70px;max-width:220px;object-fit:contain}header small{display:block;color:#cfd4e2;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.busca{position:sticky;top:0;z-index:5;background:var(--g);padding:10px 0 8px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #c9c4c8;border-radius:10px;background:#fff;color:var(--t)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #c98a98;outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--l);background:#fff;color:var(--m);border-radius:18px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--m);color:#fff;border-color:var(--m)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.prim{background:var(--m);color:#fff;padding:13px 18px;font-weight:600}
.sec{background:#fff;color:var(--m);border:1px solid var(--m);padding:11px 16px}
.rep{width:100%;margin:8px 0 4px}
.lista{display:grid;gap:8px;margin-top:6px}
.p{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.p.sel{border-color:var(--m);box-shadow:inset 3px 0 0 var(--m)}
.p .d{min-width:0}.p .d b{display:block;font-weight:500}
.p .d small{color:var(--mu)}
.p .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.marca{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#234a87;background:#dde7f6;border-radius:4px;padding:1px 6px;margin-right:4px}
.q{display:flex;align-items:center;gap:6px;grid-column:1/-1;justify-content:flex-end}
.q button{width:42px;height:42px;background:var(--m2);color:var(--m);font-size:22px;font-weight:600}
.q input{width:64px;text-align:center;padding:9px 4px}
.q .add{width:auto;padding:0 18px;font-size:16px;background:var(--m);color:#fff}
.mas{text-align:center;color:var(--mu);font-size:14px;padding:10px}
.p .d{display:flex;gap:10px;align-items:flex-start}.p .d .tx{min-width:0}
.ft{width:64px;height:64px;flex:none;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--l);cursor:zoom-in}
.ft0{width:64px;height:64px;flex:none;border-radius:10px;background:var(--m2);display:grid;place-items:center;color:var(--m);font-weight:700;font-size:22px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:40;display:grid;place-items:center;padding:20px}.zoom img{max-width:100%;max-height:80vh;border-radius:12px;background:#fff}.zoom p{color:#fff;text-align:center;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin:10px 0 0}.tabs button{flex:1;background:rgba(255,255,255,.12);color:#fff;padding:9px 10px;font-size:15px}.tabs button.on{background:#fff;color:var(--n);font-weight:600}
.cta{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}
.cta .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.cta .lab{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.mp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#009ee3;color:#fff;font-weight:700;padding:14px;margin-top:10px;text-decoration:none;border-radius:10px}
.datos{white-space:pre-line;background:var(--g);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.fila{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}.fila:last-child{border-bottom:0}
.fila small{color:var(--mu)}.fila small.venc{color:var(--er);font-weight:600}.fila .n{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.venc{color:var(--er);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(23,33,58,.08)}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .tot{font-variant-numeric:tabular-nums}.bar .tot b{display:block;font-size:19px}
.hoja{position:fixed;inset:0;background:rgba(23,33,58,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja .c{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.hoja h2{margin:0 0 10px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--l)}
.it small{color:var(--mu)}.it .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.it .q{grid-column:1/-1;justify-content:flex-start}.it .q button{width:36px;height:36px;font-size:19px}.it .q input{width:56px;padding:6px 4px}
.it .q .x{width:auto;padding:0 12px;font-size:14px;background:none;color:var(--er)}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin:14px 0}
.acc{display:flex;gap:8px;flex-wrap:wrap}.acc button{flex:1}
.msg{background:#fff;border:1px solid var(--l);border-radius:14px;padding:24px 18px;margin-top:24px;text-align:center}
.msg h2{margin:0 0 8px}.msg .ok{font-size:44px;line-height:1;color:var(--ok)}
.err{color:var(--er)}
.promo{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--ok);border-radius:4px;padding:2px 6px;margin-top:3px}
.promo.cerca{background:#e4f3ea;color:var(--ok);white-space:normal;text-align:right;max-width:150px}
.p .pr s{color:var(--mu);font-weight:400;font-size:13px}.p .pr{text-align:right}
.bulto{display:inline-block;font-size:11px;font-weight:600;color:#7a5a00;background:#fff1cc;border-radius:4px;padding:1px 6px;margin-right:4px}
.p .pr small{display:block;font-size:12px;font-weight:500;color:var(--mu);text-align:right}
.q small.eq{color:#7a5a00;font-weight:600;margin-right:auto}
.q .add.sec2{background:#fff;color:var(--m);border:1px solid var(--m)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.hoja .c{animation:sube .18s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<header><b id="hb">Sabores de mi País</b><small id="hc">Cargando tu catálogo…</small><div class="tabs" id="tabs" hidden><button data-tab="pedido" class="on">🛒 Hacer pedido</button><button data-tab="cuenta">💳 Mi cuenta</button></div></header>
<main id="m"></main>
<div class="bar" id="bar" hidden><div class="in"><div class="tot"><span id="bn"></span><b id="bt"></b></div><button class="prim" id="bv">Ver pedido</button></div></div>
<div id="t" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ggfqdkgqtpnkvxoykoty.supabase.co','sb_publishable_kfvkZgS8FewPabohJrKf9Q_UDyEcQiR',{auth:{persistSession:false}});
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $m=n=>'$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const norm=t=>String(t??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const token=new URLSearchParams(location.search).get('c')||'';
const K='carrito_'+token;
let C=null,P=[],car={},filtro='',marca='',lim=60;
function toast(t){const e=$('#t');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2600)}
function guardar(){try{localStorage.setItem(K,JSON.stringify(car))}catch(e){}}
function cargarCarrito(){try{const x=JSON.parse(localStorage.getItem(K)||'{}');for(const id in x)if(P.find(p=>p.id==id)&&x[id]>0)car[id]=+x[id]}catch(e){}}
const prod=id=>P.find(p=>p.id==id);
const nf=n=>Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
const pl=(t,n)=>{t=String(t||'Caja').toLowerCase();return n==1?t:(t.endsWith('s')?t:t+'s')};
function promoP(p,q,cerca){let best=null;for(const r of (C?.promos||[])){const av=String(r.av||'').toUpperCase();
  if(r.a=='marca'&&String(p.m||'').toUpperCase()!==av)continue;if(r.a=='familia'&&String(p.f||'').toUpperCase()!==av)continue;if(r.a=='producto'&&String(p.id)!==String(r.av))continue;
  if(r.mt=='bulto'&&!(p.b>1))continue;if(!cerca){if(r.mt=='unidades'&&q<r.mu)continue;if(r.mt=='bulto'&&q<p.b)continue}
  if(!best||+r.pct>+best.pct)best=r}return best}
const condP=(r,p)=>r.mt=='bulto'?'llevando 1 '+String(p.tb||'caja').toLowerCase()+' o más':r.mt=='unidades'?'desde '+r.mu+' u.':'';
const puP=(p,q)=>{const r=promoP(p,q);return r?Math.round(p.p*(1-r.pct/100)*100)/100:p.p};
function enB(p,q){if(!(p.b>1)||q<p.b)return '';const c=Math.floor(q/p.b),r=q-c*p.b;return c+' '+pl(p.tb,c)+(r?' + '+nf(r)+' u.':'')}
const totalCar=()=>Object.entries(car).reduce((a,[id,q])=>{const p=prod(id);return a+(p?puP(p,q)*q:0)},0);

/* Logo y colores elegidos en el CRM */
function aplicarMarca(m){if(!m)return;if(m.logo===null||m.logo===undefined)m.logo='logo.png';const r=document.documentElement.style,tinte=(h,k)=>{const n=parseInt(h.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(255-v)*k));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};
  if(/^#[0-9a-f]{6}$/i.test(m.c||'')){r.setProperty('--m',m.c);r.setProperty('--m2',tinte(m.c,.9))}
  if(/^#[0-9a-f]{6}$/i.test(m.n||'')){r.setProperty('--n',m.n);document.querySelector('meta[name=theme-color]').setAttribute('content',m.n)}
  if(m.logo&&(/^data:image\//.test(m.logo)||m.logo=='logo.png'||/\/logo\.png$/.test(m.logo))){const b=$('#hb');b.innerHTML='';const i=new Image();i.alt='';i.src=m.logo;b.append(i,document.createTextNode('Sabores de mi País'))}}
try{aplicarMarca(JSON.parse(localStorage.getItem('marca_cat')||'null')||{})}catch(e){}
sb.rpc('marca_publica').then(({data})=>{if(data){aplicarMarca(data);try{localStorage.setItem('marca_cat',JSON.stringify(data))}catch(e){}}});

async function iniciar(){
  if(!token){$('#hc').textContent='';$('#m').innerHTML='<div class="msg"><h2>Falta el link</h2><p>Abrí el link que te mandamos por WhatsApp para ver tu catálogo.</p></div>';return}
  const{data,error}=await sb.rpc('catalogo_cliente',{p_token:token});
  if(error){$('#hc').textContent='';$('#m').innerHTML=`<div class="msg"><h2>No pudimos abrir tu catálogo</h2><p class="err">${esc(error.message)}</p></div>`;return}
  C=data;P=(data.productos||[]).filter(p=>p.p>0);hayFotos=P.some(p=>p.img);cargarCarrito();
  $('#hc').textContent=C.cliente+' · precios lista '+C.lista;
  $('#tabs').hidden=false;$$('[data-tab]').forEach(b=>b.onclick=()=>irTab(b.dataset.tab));
  irTab(location.hash=='#cuenta'?'cuenta':'pedido');
}
let hayFotos=false;
function irTab(t){$$('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==t));try{history.replaceState(null,'',t=='cuenta'?'#cuenta':location.pathname+location.search)}catch(e){}
  if(t=='cuenta'){$('#bar').hidden=true;miCuenta()}else pintar();window.scrollTo(0,0)}
function zoom(p){if(!p?.img)return;const z=document.createElement('div');z.className='zoom';z.innerHTML=`<div><img src="${esc(p.img)}" alt="${esc(p.d)}"><p>${esc(p.d)} · ${$m(p.p)}</p></div>`;z.onclick=()=>z.remove();document.body.appendChild(z)}
const telLimpio=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9'))d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);return d.length>=10?'549'+d:''};
const fdc=d=>d?new Date(String(d).length==10?d+'T12:00':d).toLocaleDateString('es-AR'):'';
function bloquePago(x,monto){const tel=telLimpio(x.tel);
  return (x.mp?`<a class="mp" href="${esc(x.mp)}" target="_blank" rel="noopener">Pagar con Mercado Pago</a>`:'')+
    (x.pago?`<div class="datos"><b>Datos para transferir</b>\n${esc(x.pago)}</div>`:'')+
    (tel?`<a class="sec" style="display:block;text-align:center;margin-top:10px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent('Hola! Soy '+(C?.cliente||'')+'. Les aviso que pagué'+(monto?' '+$m(monto):'')+'. Les mando el comprobante.')}">Avisar que pagué (WhatsApp)</a>`:'')}
async function miCuenta(){$('#m').innerHTML='<p class="mas">Cargando tu cuenta…</p>';
  const{data:x,error}=await sb.rpc('cuenta_cliente',{p_token:token});
  if(error){$('#m').innerHTML=`<div class="msg"><h2>No pudimos abrir tu cuenta</h2><p class="err">${esc(/cuenta_cliente/.test(error.message)?'Esta sección todavía no está activada.':error.message)}</p></div>`;return}
  const F=x.facturas||[],Pg=x.pagos||[],debe=+x.saldo>0.005;
  $('#m').innerHTML=`<div class="cta"><div class="lab">${debe?'Tu saldo':'Tu cuenta'}</div><div class="big">${debe?$m(x.saldo):'¡Estás al día!'}</div>
      ${+x.vencido>0.005?`<div class="venc">Vencido: ${$m(x.vencido)}</div>`:debe?'<small style="color:var(--mu)">Nada vencido todavía.</small>':''}
      ${debe?bloquePago(x,+x.saldo):''}</div>
    <div class="cta"><h3 style="margin:0 0 4px">Facturas pendientes</h3>${F.length?F.map(f=>`<div class="fila"><div>Factura ${esc(f.t)} N° ${f.n}<br><small>${f.f?'del '+fdc(f.f)+' · ':''}vence ${fdc(f.v)}</small>${f.dm>0?`<br><small class="venc">Vencida hace ${f.dm} ${f.dm==1?'día':'días'}</small>`:''}</div><div class="n">${$m(f.p)}${+f.p<+f.tot?`<br><small>de ${$m(f.tot)}</small>`:''}</div></div>`).join(''):'<p class="mas" style="padding:4px 0;text-align:left">No tenés facturas pendientes.</p>'}</div>
    <div class="cta"><h3 style="margin:0 0 4px">Tus últimos pagos</h3>${Pg.length?Pg.map(r=>`<div class="fila"><div>Recibo N° ${r.n}<br><small>${fdc(r.f)} · ${esc(String(r.m||'').replace('_',' '))}</small></div><div class="n">${$m(r.i)}</div></div>`).join(''):'<p class="mas" style="padding:4px 0;text-align:left">Todavía no hay pagos registrados.</p>'}</div>
    <p class="mas">Los pagos que hagas pueden tardar en aparecer hasta que los registremos.</p>`}
function pintar(){
  const marcas=[...new Set(P.map(p=>p.m).filter(Boolean))].sort();
  $('#m').innerHTML=`<div class="busca"><input id="q" type="search" placeholder="Buscar producto (ej.: maní 85, crocante pizza)" value="${esc(filtro)}" autocomplete="off" aria-label="Buscar producto">
    ${marcas.length>1?`<div class="chips"><button class="chip ${marca?'':'on'}" data-mk="">Todas</button>${marcas.map(m=>`<button class="chip ${marca==m?'on':''}" data-mk="${esc(m)}">${esc(m)}</button>`).join('')}</div>`:''}</div>
    ${(C.ultimo||[]).length?`<button class="sec rep" id="rep">Repetir mi último pedido (${C.ultimo.length} productos)</button>`:''}
    <div class="lista" id="l"></div>`;
  $('#q').oninput=e=>{filtro=e.target.value;lim=60;lista()};
  $$('[data-mk]').forEach(b=>b.onclick=()=>{marca=b.dataset.mk;lim=60;$$('[data-mk]').forEach(x=>x.classList.toggle('on',x.dataset.mk==marca));lista()});
  $('#rep')&&($('#rep').onclick=()=>{let n=0;for(const u of C.ultimo){if(prod(u.id)){car[u.id]=(car[u.id]||0)+Math.max(1,Math.round(u.q));n++}}guardar();lista();barra();toast(n?n+' productos agregados de tu último pedido.':'Esos productos ya no están disponibles.')});
  lista();barra();
}
function lista(){
  const ws=norm(filtro).split(/\s+/).filter(Boolean);
  const L=P.filter(p=>(!marca||p.m==marca)&&ws.every(w=>norm(p.d+' '+(p.m||'')+' '+(p.f||'')+' '+p.c).includes(w)));
  const V=L.slice(0,lim);
  $('#l').innerHTML=V.map(p=>{const q=car[p.id]||0;return `<div class="p ${q?'sel':''}"><div class="d">${p.img?`<img class="ft" src="${esc(p.img)}" alt="" loading="lazy" data-z="${p.id}">`:(hayFotos?`<span class="ft0" aria-hidden="true">${esc((p.d||'?')[0])}</span>`:'')}<div class="tx"><b>${esc(p.d)}</b><small>${p.m?`<span class="marca">${esc(p.m)}</span>`:''}${p.b>1?`<span class="bulto">${esc(p.tb)} × ${p.b}</span>`:''}${esc(p.c)}</small></div></div><div class="pr">${(()=>{const r=promoP(p,q),rc=r?null:promoP(p,q,true);return (r?`<s>${$m(p.p)}</s> ${$m(puP(p,q))}`:$m(p.p))+(p.b>1?`<small>${esc(p.tb)}: ${$m((rc&&rc.mt=='bulto'?Math.round(p.p*(1-rc.pct/100)*100)/100:puP(p,q))*p.b)}</small>`:'')+(r?`<span class="promo">−${nf(r.pct)} %</span>`:rc?`<span class="promo cerca">−${nf(rc.pct)} % ${esc(condP(rc,p))}</span>`:'')})()}</div>
    <div class="q">${q&&enB(p,q)?`<small class="eq">= ${enB(p,q)}</small>`:''}${q?`<button data-r="${p.id}" aria-label="Restar">−</button><input type="number" inputmode="numeric" min="0" value="${q}" data-i="${p.id}" aria-label="Cantidad"><button data-s="${p.id}" aria-label="Sumar">+</button>`:`<button class="add${p.b>1?' sec2':''}" data-s="${p.id}">Agregar 1</button>`}${p.b>1?`<button class="add" data-bb="${p.id}">+ ${esc(p.tb)} (${p.b})</button>`:''}</div></div>`}).join('')+
    (L.length>V.length?`<button class="sec" id="mas" style="width:100%">Ver más productos (${L.length-V.length})</button>`:'')+
    (L.length?'':'<p class="mas">No encontramos productos con esa búsqueda.</p>');
  $$('#l [data-z]').forEach(i=>i.onclick=()=>zoom(prod(i.dataset.z)));
  $$('#l [data-s]').forEach(b=>b.onclick=()=>cambiar(b.dataset.s,1));
  $$('#l [data-r]').forEach(b=>b.onclick=()=>cambiar(b.dataset.r,-1));
  $$('#l [data-bb]').forEach(b=>b.onclick=()=>cambiar(b.dataset.bb,prod(b.dataset.bb).b));
  $$('#l [data-i]').forEach(e=>e.onchange=()=>{const v=Math.max(0,Math.round(+e.value||0));v?car[e.dataset.i]=v:delete car[e.dataset.i];guardar();setTimeout(lista);barra()});
  $('#mas')&&($('#mas').onclick=()=>{lim+=60;lista()});
}
function cambiar(id,d){const q=(car[id]||0)+d;q>0?car[id]=q:delete car[id];guardar();lista();barra()}
function barra(){const n=Object.keys(car).length;$('#bar').hidden=!n;if(!n)return;
  $('#bn').textContent=n+(n==1?' producto':' productos');$('#bt').textContent=$m(totalCar())}
$('#bv').onclick=revisar;
function revisar(){
  const cerrar=()=>{h.remove();lista();barra()};
  const h=document.createElement('div');h.className='hoja';
  const draw=()=>{const I=Object.entries(car).filter(([id])=>prod(id));
    if(!I.length){cerrar();return}
    h.innerHTML=`<div class="c" role="dialog" aria-label="Tu pedido"><h2>Tu pedido</h2>
      ${I.map(([id,q])=>{const p=prod(id);return `<div class="it"><div>${esc(p.d)}<br><small>${$m(puP(p,q))} c/u${promoP(p,q)?' (−'+nf(promoP(p,q).pct)+' %)':''}${enB(p,q)?' · '+nf(q)+' u. = '+enB(p,q):''}</small></div><div class="n">${$m(puP(p,q)*q)}</div>
        <div class="q"><button data-r="${id}" aria-label="Restar">−</button><input type="number" inputmode="numeric" min="0" value="${q}" data-i="${id}" aria-label="Cantidad"><button data-s="${id}" aria-label="Sumar">+</button><button class="x" data-x="${id}">Quitar</button></div></div>`}).join('')}
      <div class="total"><span>Total</span><span>${$m(totalCar())}</span></div>
      <textarea id="nota" rows="2" maxlength="500" placeholder="¿Algo que tengamos que saber? (horario de entrega, etc.)">${esc(h._nota||'')}</textarea>
      <p style="font-size:13px;color:var(--mu)">Los precios incluyen IVA. Te confirmamos el pedido cuando lo revisemos.</p>
      <div class="acc"><button class="sec" id="seg">Seguir comprando</button><button class="prim" id="env">Enviar pedido</button></div></div>`;
    const sv=()=>{h._nota=$('#nota').value};
    h.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sv();car[b.dataset.s]++;guardar();draw()});
    h.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{sv();const k=b.dataset.r;car[k]>1?car[k]--:delete car[k];guardar();draw()});
    h.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sv();delete car[b.dataset.x];guardar();draw()});
    h.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{sv();const v=Math.max(0,Math.round(+e.value||0));v?car[e.dataset.i]=v:delete car[e.dataset.i];guardar();setTimeout(draw)});
    h.querySelector('#seg').onclick=()=>{sv();cerrar()};
    h.querySelector('#env').onclick=async e=>{sv();const b=e.target;b.disabled=true;b.textContent='Enviando…';
      const{data,error}=await sb.rpc('crear_pedido_cliente',{p_token:token,p_items:I.map(([id,q])=>({id,q})),p_nota:h._nota||null});
      if(error){b.disabled=false;b.textContent='Enviar pedido';toast(error.message);return}
      car={};guardar();h.remove();$('#bar').hidden=true;
      $('#m').innerHTML=`<div class="msg"><div class="ok">✓</div><h2>¡Recibimos tu pedido!</h2><p>Pedido N° <b>${data.numero}</b> · ${data.productos} ${data.productos==1?'producto':'productos'} · <b>${$m(data.total)}</b></p><p>Te avisamos cuando esté confirmado. ¡Gracias por tu compra!</p>${C.mp||C.pago?`<details style="margin:12px 0;text-align:left"><summary>¿Querés pagarlo ya?</summary>${bloquePago(C,data.total)}</details>`:''}<button class="sec" id="otro">Hacer otro pedido</button></div>`;
      $('#otro').onclick=()=>{filtro='';marca='';pintar()};window.scrollTo(0,0)}};
  h.onclick=e=>{if(e.target===h){h._nota=$('#nota')?.value;cerrar()}};
  document.body.appendChild(h);draw();
}
iniciar();
</script>
</body>
</html>
